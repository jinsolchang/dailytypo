function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function rand(min, max) { return min + Math.random() * (max - min); }
function randInt(min, max) { return Math.floor(rand(min, max + 1)); }
function chance(p) { return Math.random() < p; }

function randomSlogan() { return pick(POLITICAL_SLOGANS); }
function randomShop() { return pick(SHOP_SIGNS); }

let camX = 0, camY = 0;
let velX = 0, velY = 0;

const CELL_SIZE = 600;
const cells = new Map();
const allElements = new Set();

function cellKey(cx, cy) { return `${cx},${cy}`; }

function visibleCells() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const margin = 1;
  const minCX = Math.floor((camX - w/2) / CELL_SIZE) - margin;
  const maxCX = Math.floor((camX + w/2) / CELL_SIZE) + margin;
  const minCY = Math.floor((camY - h/2) / CELL_SIZE) - margin;
  const maxCY = Math.floor((camY + h/2) / CELL_SIZE) + margin;
  const out = [];
  for (let cy = minCY; cy <= maxCY; cy++) {
    for (let cx = minCX; cx <= maxCX; cx++) out.push([cx, cy]);
  }
  return out;
}

function entryClassForDelta() {
  if (Math.abs(velX) < 0.5 && Math.abs(velY) < 0.5) {
    return pick(['in-right','in-left','in-up','in-down']);
  }
  if (Math.abs(velX) > Math.abs(velY)) {
    return velX > 0 ? 'in-left' : 'in-right';
  } else {
    return velY > 0 ? 'in-up' : 'in-down';
  }
}

function pickSignType() {
  const r = Math.random();
  if (r < 0.42) return 'standard';
  if (r < 0.52) return 'arrow';
  if (r < 0.60) return 'vertical';
  if (r < 0.67) return 'stamp';
  if (r < 0.79) return 'sub-main';
  if (r < 0.87) return 'with-symbol';
  if (r < 0.94) return 'with-rating';
  return 'with-price';
}

function makeSign(wx, wy) {
  const type = pickSignType();
  const isPolitical = chance(0.35);
  const mainText = isPolitical ? randomSlogan() : randomShop();

  if (type === 'vertical') return makeVertical(wx, wy, mainText);
  if (type === 'arrow') return makeArrow(wx, wy, mainText);
  if (type === 'stamp') return makeStamp(wx, wy, mainText);

  const el = document.createElement('div');
  el.className = 'sign';
  const color = pick(COLORS);
  const font = pick(FONTS_ALL);
  el.classList.add(color, font);

  const borderVar = pick(BORDER_VARIANTS);
  if (borderVar) el.classList.add(borderVar);
  if (chance(0.08)) el.classList.add(pick(GLOW_CLASSES));
  if (chance(0.12)) el.classList.add('weathered');

  const fontSize = randInt(20, 72);
  el.style.fontSize = fontSize + 'px';

  if (type === 'sub-main') {
    el.classList.add('with-sub');
    const sub = document.createElement('span');
    sub.className = 'subtitle';
    sub.textContent = pick(SUBTITLES);
    const main = document.createElement('span');
    main.className = 'main-line';
    main.textContent = mainText;
    el.appendChild(sub);
    el.appendChild(main);
  } else if (type === 'with-symbol') {
    const sym = document.createElement('span');
    sym.className = 'icon-symbol';
    sym.textContent = pick(SYMBOLS);
    el.appendChild(sym);
    const main = document.createElement('span');
    main.textContent = mainText;
    el.appendChild(main);
  } else if (type === 'with-rating') {
    const main = document.createElement('span');
    main.textContent = mainText;
    el.appendChild(main);
    const r = document.createElement('span');
    r.className = 'star-rating';
    r.textContent = pick(RATING_OPTIONS);
    el.appendChild(r);
  } else if (type === 'with-price') {
    const main = document.createElement('span');
    main.textContent = mainText;
    el.appendChild(main);
    const p = document.createElement('span');
    p.className = 'price-tag';
    p.textContent = pick(PRICE_OPTIONS);
    el.appendChild(p);
  } else {
    if (chance(0.18)) {
      const badge = document.createElement('span');
      badge.className = 'badge-24h';
      badge.textContent = '24';
      el.appendChild(badge);
    }
    const main = document.createElement('span');
    main.textContent = mainText;
    el.appendChild(main);
  }

  if (!isPolitical && chance(0.35)) {
    const f = document.createElement('span');
    f.className = 'floor-tag';
    f.textContent = pick(FLOOR_OPTIONS);
    el.appendChild(f);
  }
  if (!isPolitical && chance(0.28)) {
    const p = document.createElement('span');
    p.className = 'phone';
    p.textContent = pick(PHONE_OPTIONS);
    el.appendChild(p);
  }

  const scaleX = pick([0.6, 0.75, 0.9, 1, 1, 1, 1.1, 1.3, 1.6]);
  const scaleY = pick([0.8, 1, 1, 1, 1.2, 1.4]);
  const rotate = chance(0.2) ? rand(-4, 4) : 0;

  el.style.setProperty('--base-transform', `translate(-50%, -50%) scale(${scaleX}, ${scaleY}) rotate(${rotate}deg)`);
  el.style.left = wx + 'px';
  el.style.top = wy + 'px';
  el.style.transform = `translate(-50%, -50%) scale(${scaleX}, ${scaleY}) rotate(${rotate}deg)`;
  el.style.zIndex = randInt(2, 30);
  el.classList.add(entryClassForDelta());
  el._wx = wx; el._wy = wy;
  canvas.appendChild(el);
  return el;
}

function makeVertical(wx, wy, text) {
  const el = document.createElement('div');
  el.className = 'vertical ' + pick(COLORS) + ' ' + pick(FONTS_DISPLAY);
  el.style.fontSize = randInt(24, 44) + 'px';
  el.textContent = text.length > 8 ? text.slice(0, 7) : text;
  if (chance(0.15)) el.classList.add('weathered');

  const rotate = chance(0.1) ? rand(-2, 2) : 0;
  el.style.setProperty('--base-transform', `translate(-50%, -50%) rotate(${rotate}deg)`);
  el.style.left = wx + 'px';
  el.style.top = wy + 'px';
  el.style.transform = `translate(-50%, -50%) rotate(${rotate}deg)`;
  el.style.zIndex = randInt(3, 25);
  el.classList.add(entryClassForDelta());
  el._wx = wx; el._wy = wy;
  canvas.appendChild(el);
  return el;
}

  canvas.appendChild(el);

}

function makeStamp(wx, wy, text) {
  const el = document.createElement('div');
  const variant = pick(['', 'gold', 'black']);
  el.className = 'stamp ' + variant + ' ' + pick(['f-black-han','f-jua','f-gugi','f-song-myung']);
  el.style.fontSize = randInt(13, 18) + 'px';
  const short = text.length > 10 ? text.slice(0, 9) : text;
  el.textContent = short;

  const rotate = rand(-12, 12);
  const scale = rand(0.7, 1.15);
  el.style.setProperty('--base-transform', `translate(-50%, -50%) rotate(${rotate}deg) scale(${scale})`);
  el.style.left = wx + 'px';
  el.style.top = wy + 'px';
  el.style.transform = `translate(-50%, -50%) rotate(${rotate}deg) scale(${scale})`;
  el.style.zIndex = randInt(12, 28);
  el.classList.add(entryClassForDelta());
  el._wx = wx; el._wy = wy;
  canvas.appendChild(el);
  return el;
}

function makePoster(wx, wy) {
  const cand = pick(CANDIDATES);
  const layout = pick(['tall', 'tall', 'tall', 'wide', 'square', 'banner']);
  const el = document.createElement('div');
  el.className = `poster layout-${layout}`;

  const partyLabel = PARTY_NAMES[cand.party] || '시민의당';
  const headerText = `${pick(HEADER_LABELS)} · ${partyLabel}`;
  const slogan = randomSlogan();

  const skin = pick(['skin-1','skin-2','skin-3']);
  const head = pick(['','head-gray','head-white','head-bald','head-mid-part']);
  const suitClass = `suit-${cand.party === 'red' ? 'red' : cand.party === 'blue' ? 'blue' : pick(['gray','black','navy'])}`;
  const glasses = chance(0.7) ? '<div class="glasses"></div>' : '';
  const smile = chance(0.85) ? '<div class="smile"></div>' : '';

  const faceHTML = `<div class="face ${skin} ${head} ${suitClass}">
    <div class="head"></div>
    <div class="suit"></div>
    ${glasses}
    ${smile}
  </div>`;

  const invertSlogan = chance(0.35);
  const sloganClass = chance(0.25) ? `party-${cand.party}-bg` : (invertSlogan ? 'invert' : '');
  const numInvert = chance(0.3) ? 'invert' : (chance(0.4) ? `party-${cand.party}-num` : '');

  if (layout === 'tall') {
    el.innerHTML = `
      <div class="poster-header party-${cand.party}">${headerText}</div>
      <div class="poster-number ${numInvert}">${cand.num}</div>
      <div class="poster-name">${cand.name}</div>
      <div class="poster-title">${cand.title}</div>
      ${faceHTML}
      <div class="poster-slogan ${sloganClass}">${slogan}</div>
    `;
  } else if (layout === 'wide') {
    el.innerHTML = `
      <div class="poster-left">
        <div class="poster-header party-${cand.party}">${headerText}</div>
        <div class="poster-number ${numInvert}">${cand.num}</div>
        <div class="poster-name">${cand.name}</div>
        <div class="poster-title">${cand.title}</div>
      </div>
      <div class="poster-right">
        ${faceHTML.replace('height: 100px', 'height: 100%').replace('class="face', 'style="height:140px" class="face')}
        <div class="poster-slogan ${sloganClass}" style="font-size:16px;padding:10px 8px;">${slogan}</div>
      </div>
    `;
  } else if (layout === 'square') {
    el.innerHTML = `
      <div class="poster-header party-${cand.party}">${headerText}</div>
      <div style="display:flex;background:#f4e8c1;">
        <div style="flex:1;">
          <div class="poster-number ${numInvert}" style="font-size:72px;padding:8px 12px 0;">${cand.num}</div>
          <div class="poster-name" style="font-size:30px;">${cand.name}</div>
          <div class="poster-title">${cand.title}</div>
        </div>
        <div style="width:110px;">${faceHTML}</div>
      </div>
      <div class="poster-slogan ${sloganClass}">${slogan}</div>
    `;
  } else {
    el.innerHTML = `
      <div style="width:120px;">${faceHTML.replace('height: 100px', 'height: 100%').replace('class="face', 'style="height:130px" class="face')}</div>
      <div style="flex:1;display:flex;flex-direction:column;">
        <div class="poster-header party-${cand.party}">${headerText}</div>
        <div style="display:flex;align-items:center;background:#f4e8c1;flex:1;">
          <div class="poster-number ${numInvert}" style="font-size:64px;padding:4px 12px;">${cand.num}</div>
          <div style="flex:1;">
            <div class="poster-name" style="font-size:28px;padding:4px 12px 2px;">${cand.name}</div>
            <div style="font-size:13px;font-family:'Black Han Sans',sans-serif;padding:4px 12px 8px;color:#333;">${slogan}</div>
          </div>
        </div>
      </div>
    `;
  }

  const rotate = rand(-5, 5);
  const scale = rand(0.7, 1.15);
  el.style.setProperty('--base-transform', `translate(-50%, -50%) rotate(${rotate}deg) scale(${scale})`);
  el.style.left = wx + 'px';
  el.style.top = wy + 'px';
  el.style.transform = `translate(-50%, -50%) rotate(${rotate}deg) scale(${scale})`;
  el.style.zIndex = randInt(15, 35);
  el.classList.add(entryClassForDelta());
  el._wx = wx; el._wy = wy;
  canvas.appendChild(el);
  return el;
}

function makeClock(wx, wy) {
  const el = document.createElement('div');
  const color = pick(['', 'green', 'amber']);
  el.className = 'led-clock ' + color;
  el._isClock = true;

  const withLabel = chance(0.4);
  if (withLabel) {
    el.innerHTML = `<span class="clock-label">${pick(['CURRENT TIME','현재시각','TIME','지금'])}</span>${nowClock()}`;
  } else {
    el.textContent = nowClock();
  }

  const fontSize = randInt(28, 56);
  el.style.fontSize = fontSize + 'px';

  const rotate = chance(0.2) ? rand(-2, 2) : 0;
  const scale = rand(0.7, 1.2);
  el.style.setProperty('--base-transform', `translate(-50%, -50%) rotate(${rotate}deg) scale(${scale})`);
  el.style.left = wx + 'px';
  el.style.top = wy + 'px';
  el.style.transform = `translate(-50%, -50%) rotate(${rotate}deg) scale(${scale})`;
  el.style.zIndex = 26;
  el.classList.add(entryClassForDelta());
  el._wx = wx; el._wy = wy;
  canvas.appendChild(el);
  return el;
}

function makeBanner(wx, wy) {
  const el = document.createElement('div');
  el.className = 'banner';
  const isPol = chance(0.6);
  const text = isPol ? randomSlogan() : randomShop();

  const colorOptions = ['#e8202a', '#1845a8', '#0050b5', '#c8001a', '#0a7a3b', '#ff6a13', '#5e1a8a', '#0a8090', '#d4a017'];
  const gradOptions = [
    'linear-gradient(90deg, #e8202a 0%, #c8001a 100%)',
    'linear-gradient(90deg, #1845a8 0%, #003ec8 100%)',
    'linear-gradient(180deg, #ffd400 0%, #d49a00 100%)',
    'linear-gradient(135deg, #ff4d8d 0%, #c8001a 100%)',
    'linear-gradient(90deg, #0a7a3b 0%, #4fc14a 100%)',
  ];

  if (chance(0.4)) {
    el.style.background = pick(gradOptions);
  } else {
    el.style.background = pick(colorOptions);
  }

  const font = pick(['f-black-han', 'f-black-han', 'f-gothic', 'f-do-hyeon', 'f-jua']);
  el.classList.add(font);

  const ribbon = chance(0.3) ? '◆' : (chance(0.2) ? '◈' : '');
  if (ribbon) {
    const left = document.createElement('span');
    left.className = 'ribbon-end';
    left.textContent = ribbon;
    el.appendChild(left);
  }
  const main = document.createElement('span');
  main.textContent = text;
  el.appendChild(main);
  if (ribbon) {
    const right = document.createElement('span');
    right.className = 'ribbon-end';
    right.textContent = ribbon;
    el.appendChild(right);
  }

  const fontSize = randInt(22, 48);
  el.style.fontSize = fontSize + 'px';

  const rotate = chance(0.5) ? rand(-3, 3) : 0;
  const scaleY = pick([0.6, 0.8, 1, 1.1]);
  el.style.setProperty('--base-transform', `translate(-50%, -50%) scaleY(${scaleY}) rotate(${rotate}deg)`);
  el.style.left = wx + 'px';
  el.style.top = wy + 'px';
  el.style.transform = `translate(-50%, -50%) scaleY(${scaleY}) rotate(${rotate}deg)`;
  el.style.zIndex = randInt(5, 20);
  el.classList.add(entryClassForDelta());
  el._wx = wx; el._wy = wy;
  canvas.appendChild(el);
  return el;
}

function populateCell(cx, cy) {
  const key = cellKey(cx, cy);
  if (cells.has(key)) return;

  const items = [];
  const x0 = cx * CELL_SIZE;
  const y0 = cy * CELL_SIZE;

  const numSigns = randInt(6, 11);
  const numPosters = chance(0.6) ? randInt(1, 2) : 0;
  const includeClock = chance(0.18);
  const numBanners = chance(0.55) ? randInt(1, 2) : 0;

  for (let i = 0; i < numSigns; i++) {
    items.push(makeSign(x0 + rand(20, CELL_SIZE - 20), y0 + rand(20, CELL_SIZE - 20)));
  }
  for (let i = 0; i < numPosters; i++) {
    items.push(makePoster(x0 + rand(140, CELL_SIZE - 140), y0 + rand(180, CELL_SIZE - 180)));
  }
  if (includeClock) {
    items.push(makeClock(x0 + rand(120, CELL_SIZE - 120), y0 + rand(40, CELL_SIZE - 40)));
  }
  for (let i = 0; i < numBanners; i++) {
    items.push(makeBanner(x0 + rand(200, CELL_SIZE - 200), y0 + rand(40, CELL_SIZE - 40)));
  }

  cells.set(key, items);
  items.forEach(el => allElements.add(el));
  updateCount();
}

function pruneCells() {
  const vc = new Set(visibleCells().map(([x,y]) => cellKey(x,y)));
  for (const [key, items] of cells.entries()) {
    if (!vc.has(key)) {
      items.forEach(el => {
        el.style.opacity = '0';
        allElements.delete(el);
        setTimeout(() => el.remove(), 400);
      });
      cells.delete(key);
    }
  }
}

function updateCount() {
  countEl.textContent = allElements.size;
}

function render() {
  canvas.style.transform = `translate(${-camX + window.innerWidth/2}px, ${-camY + window.innerHeight/2}px)`;
}

function ensureCellsAndPrune() {
  visibleCells().forEach(([cx, cy]) => populateCell(cx, cy));
  pruneCells();
}

function tick() {
  if (!dragging) {
    camX += velX;
    camY += velY;
    velX *= 0.92;
    velY *= 0.92;
    if (Math.abs(velX) < 0.05) velX = 0;
    if (Math.abs(velY) < 0.05) velY = 0;
  }
  render();
  requestAnimationFrame(tick);
}

let lastCheck = 0;
function checkCellsLoop() {
  const now = performance.now();
  if (now - lastCheck > 120) {
    ensureCellsAndPrune();
    lastCheck = now;
  }
  requestAnimationFrame(checkCellsLoop);
}

setInterval(() => {
  document.querySelectorAll('.led-clock').forEach(el => {
    const lbl = el.querySelector('.clock-label');
    if (lbl) {
      el.innerHTML = lbl.outerHTML + nowClock();
    } else {
      el.textContent = nowClock();
    }
  });
}, 1000);

let dragging = false;
let lastX = 0, lastY = 0;
let lastT = 0;

function onDown(x, y) {
  dragging = true;
  lastX = x; lastY = y; lastT = performance.now();
  velX = 0; velY = 0;
  document.body.classList.add('dragging');
}
function onMove(x, y) {
  if (!dragging) return;
  const dx = x - lastX;
  const dy = y - lastY;
  const now = performance.now();
  const dt = Math.max(1, now - lastT);
  camX -= dx;
  camY -= dy;
  velX = -dx / dt * 16;
  velY = -dy / dt * 16;
  lastX = x; lastY = y; lastT = now;
}
function onUp() {
  dragging = false;
  document.body.classList.remove('dragging');
}

window.addEventListener('mousedown', e => onDown(e.clientX, e.clientY));
window.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
window.addEventListener('mouseup', onUp);
window.addEventListener('mouseleave', onUp);

window.addEventListener('touchstart', e => {
  if (e.touches.length === 1) onDown(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: true });
window.addEventListener('touchmove', e => {
  if (e.touches.length === 1) onMove(e.touches[0].clientX, e.touches[0].clientY);
  e.preventDefault();
}, { passive: false });
window.addEventListener('touchend', onUp);
window.addEventListener('touchcancel', onUp);

window.addEventListener('wheel', e => {
  e.preventDefault();
  velX = 0; velY = 0;
  camX += e.deltaX;
  camY += e.deltaY;
}, { passive: false });

const keys = new Set();
window.addEventListener('keydown', e => {
  keys.add(e.key);
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
});
window.addEventListener('keyup', e => keys.delete(e.key));

function keyboardLoop() {
  const speed = 12;
  if (keys.has('ArrowLeft'))  velX = -speed;
  if (keys.has('ArrowRight')) velX = speed;
  if (keys.has('ArrowUp'))    velY = -speed;
  if (keys.has('ArrowDown'))  velY = speed;
  requestAnimationFrame(keyboardLoop);
}

window.addEventListener('resize', () => ensureCellsAndPrune());

ensureCellsAndPrune();
tick();
checkCellsLoop();
keyboardLoop();
</script>
</body>
</html>
