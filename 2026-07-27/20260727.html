<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>김밥 해부학 — 완벽한 한 줄을 향한 토핑 선별</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#0d0d0d;
  font-family:'Noto Sans KR',sans-serif;
  color:#fff;
  min-height:100vh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}
canvas{display:block;cursor:crosshair}
.ui{position:fixed;top:24px;left:50%;transform:translateX(-50%);text-align:center;z-index:10;pointer-events:none}
.title{font-size:clamp(1.2rem,3vw,1.8rem);font-weight:900;letter-spacing:-0.02em;margin-bottom:6px}
.subtitle{font-size:0.75rem;color:rgba(255,255,255,0.4);letter-spacing:0.1em}
.status{
  position:fixed;bottom:30px;left:50%;transform:translateX(-50%);
  display:flex;gap:24px;font-size:0.8rem;color:rgba(255,255,255,0.5);
  background:rgba(0,0,0,0.6);padding:12px 24px;border-radius:30px;
  backdrop-filter:blur(10px);
}
.status span{color:#4ade80;font-weight:700}
.message{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  font-size:1.1rem;font-weight:700;color:#fff;
  text-shadow:0 2px 20px rgba(0,0,0,0.8);
  opacity:0;transition:opacity 0.4s;
  pointer-events:none;z-index:100;
  text-align:center;
  background:rgba(0,0,0,0.7);padding:16px 32px;border-radius:8px;
}
.message.show{opacity:1}
.hint{
  position:fixed;bottom:100px;left:50%;transform:translateX(-50%);
  font-size:0.7rem;color:rgba(255,255,255,0.3);
  text-align:center;
}
.trash{
  position:fixed;right:40px;bottom:40px;
  width:80px;height:100px;
  border:2px dashed rgba(255,100,100,0.3);
  border-radius:8px;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  color:rgba(255,100,100,0.5);
  font-size:0.7rem;
  transition:all 0.2s;
}
.trash.active{
  border-color:#ff6b6b;
  background:rgba(255,100,100,0.1);
  color:#ff6b6b;
  transform:scale(1.1);
}
.trash-icon{font-size:2rem;margin-bottom:4px}
</style>
</head>
<body>

<div class="ui">
  <div class="title">김밥 해부학</div>
  <div class="subtitle">GIMBAP ANATOMY — 토핑 선별 실험</div>
</div>

<canvas id="canvas"></canvas>

<div class="status">
  <div>제거: <span id="removed">0</span></div>
  <div>남은 토핑: <span id="remaining">0</span></div>
  <div>실수: <span id="mistakes">0</span></div>
</div>

<div class="hint" id="hint">토핑을 클릭해서 드래그 → 쓰레기통에 버리세요</div>

<div class="trash" id="trash">
  <div class="trash-icon">🗑</div>
  <div>DROP HERE</div>
</div>

<div class="message" id="message"></div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const trash = document.getElementById('trash');
const messageEl = document.getElementById('message');
const hintEl = document.getElementById('hint');

let W, H, scale;
let toppings = [];
let dragging = null;
let mouseX = 0, mouseY = 0;
let removed = 0, mistakes = 0;

// 토핑 정의
const TOPPING_DEFS = [
  { name: '단무지', color: '#f7d358', shape: 'rect', w: 12, h: 40, tasty: true },
  { name: '시금치', color: '#2e7d32', shape: 'squiggle', w: 25, h: 8, tasty: true },
  { name: '달걀', color: '#ffd54f', shape: 'rect', w: 35, h: 12, tasty: true },
  { name: '당근', color: '#ff7043', shape: 'rect', w: 8, h: 35, tasty: true },
  { name: '햄', color: '#e57373', shape: 'rect', w: 30, h: 10, tasty: true },
  { name: '게맛살', color: '#ffab91', shape: 'bundle', w: 20, h: 15, tasty: true },
  { name: '오이', color: '#81c784', shape: 'rect', w: 10, h: 30, tasty: false },
  { name: '우엉', color: '#8d6e63', shape: 'rect', w: 6, h: 35, tasty: false },
  { name: '어묵', color: '#d7ccc8', shape: 'rect', w: 25, h: 8, tasty: true },
  { name: '김치', color: '#c62828', shape: 'blob', w: 18, h: 15, tasty: false },
];

// 리사이즈
function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  scale = Math.min(W, H) / 800;
  canvas.width = W;
  canvas.height = H;
}

// 김밥 단면 원형 내에 토핑 배치
function initToppings() {
  toppings = [];
  const cx = W / 2;
  const cy = H / 2;
  const gimbapRadius = Math.min(W, H) * 0.32;
  const riceRadius = gimbapRadius * 0.85;
  
  // 8-12개 토핑 랜덤 생성
  const count = 8 + Math.floor(Math.random() * 5);
  
  for (let i = 0; i < count; i++) {
    const def = TOPPING_DEFS[Math.floor(Math.random() * TOPPING_DEFS.length)];
    
    // 원형 내부 랜덤 위치
    const angle = Math.random() * Math.PI * 2;
    const dist = Math.random() * riceRadius * 0.7;
    const x = cx + Math.cos(angle) * dist;
    const y = cy + Math.sin(angle) * dist;
    const rot = Math.random() * Math.PI * 2;
    
    toppings.push({
      ...def,
      id: i,
      x, y,
      rot,
      originX: x,
      originY: y,
      scale: 0.8 + Math.random() * 0.4,
      stuck: null, // 딸려나오는 토핑
      returning: false,
    });
  }
  
  document.getElementById('remaining').textContent = toppings.length;
}

// 김밥 단면 그리기
function drawGimbap() {
  const cx = W / 2;
  const cy = H / 2;
  const radius = Math.min(W, H) * 0.32;
  
  // 김 (외피)
  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI * 2);
  ctx.fillStyle = '#1a1a1a';
  ctx.fill();
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 3;
  ctx.stroke();
  
  // 밥 (내부)
  ctx.beginPath();
  ctx.arc(cx, cy, radius * 0.92, 0, Math.PI * 2);
  const riceGrad = ctx.createRadialGradient(cx - radius * 0.2, cy - radius * 0.2, 0, cx, cy, radius);
  riceGrad.addColorStop(0, '#fafafa');
  riceGrad.addColorStop(0.7, '#f0f0f0');
  riceGrad.addColorStop(1, '#e8e8e8');
  ctx.fillStyle = riceGrad;
  ctx.fill();
  
  // 밥알 텍스처
  ctx.fillStyle = 'rgba(200,200,200,0.3)';
  for (let i = 0; i < 150; i++) {
    const a = Math.random() * Math.PI * 2;
    const d = Math.random() * radius * 0.88;
    const rx = cx + Math.cos(a) * d;
    const ry = cy + Math.sin(a) * d;
    ctx.beginPath();
    ctx.ellipse(rx, ry, 2 + Math.random() * 2, 1 + Math.random(), Math.random() * Math.PI, 0, Math.PI * 2);
    ctx.fill();
  }
}

// 토핑 그리기
function drawTopping(t, offsetX = 0, offsetY = 0, alpha = 1) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(t.x + offsetX, t.y + offsetY);
  ctx.rotate(t.rot);
  ctx.scale(t.scale, t.scale);
  
  const hw = t.w / 2;
  const hh = t.h / 2;
  
  // 그림자
  ctx.shadowColor = 'rgba(0,0,0,0.3)';
  ctx.shadowBlur = 8;
  ctx.shadowOffsetX = 2;
  ctx.shadowOffsetY = 2;
  
  ctx.fillStyle = t.color;
  ctx.strokeStyle = shadeColor(t.color, -20);
  ctx.lineWidth = 1.5;
  
  if (t.shape === 'rect') {
    // 직사각형 토핑 (단무지, 달걀, 햄 등)
    roundRect(-hw, -hh, t.w, t.h, 3);
    ctx.fill();
    ctx.stroke();
    // 하이라이트
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    roundRect(-hw + 2, -hh + 2, t.w * 0.4, t.h * 0.3, 2);
    ctx.fill();
  } else if (t.shape === 'squiggle') {
    // 시금치 같은 구불구불
    ctx.beginPath();
    ctx.moveTo(-hw, 0);
    for (let i = 0; i <= 6; i++) {
      const px = -hw + (t.w / 6) * i;
      const py = Math.sin(i * 1.5) * hh;
      ctx.lineTo(px, py);
    }
    ctx.lineTo(hw, hh * 0.5);
    ctx.lineTo(-hw, hh * 0.3);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  } else if (t.shape === 'bundle') {
    // 게맛살 다발
    for (let i = 0; i < 4; i++) {
      const by = -hh + (t.h / 3) * i;
      ctx.fillStyle = i % 2 === 0 ? t.color : '#fff';
      roundRect(-hw, by, t.w, t.h / 4, 2);
      ctx.fill();
    }
    ctx.strokeStyle = shadeColor(t.color, -20);
    roundRect(-hw, -hh, t.w, t.h, 2);
    ctx.stroke();
  } else if (t.shape === 'blob') {
    // 김치 같은 불규칙
    ctx.beginPath();
    ctx.moveTo(-hw * 0.8, -hh * 0.5);
    ctx.bezierCurveTo(-hw, hh * 0.3, hw * 0.5, hh, hw * 0.9, hh * 0.2);
    ctx.bezierCurveTo(hw * 0.7, -hh * 0.8, 0, -hh, -hw * 0.8, -hh * 0.5);
    ctx.fill();
    ctx.stroke();
  }
  
  ctx.restore();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function shadeColor(color, percent) {
  const num = parseInt(color.replace('#', ''), 16);
  const amt = Math.round(2.55 * percent);
  const R = Math.max(0, Math.min(255, (num >> 16) + amt));
  const G = Math.max(0, Math.min(255, ((num >> 8) & 0x00FF) + amt));
  const B = Math.max(0, Math.min(255, (num & 0x0000FF) + amt));
  return '#' + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1);
}

// 토핑 클릭 감지
function hitTest(x, y) {
  for (let i = toppings.length - 1; i >= 0; i--) {
    const t = toppings[i];
    const dx = x - t.x;
    const dy = y - t.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const hitRadius = Math.max(t.w, t.h) * t.scale * 0.7;
    if (dist < hitRadius) return t;
  }
  return null;
}

// 쓰레기통 영역 체크
function isOverTrash(x, y) {
  const rect = trash.getBoundingClientRect();
  return x > rect.left - 30 && x < rect.right + 30 && y > rect.top - 30 && y < rect.bottom + 30;
}

// 메인 렌더
function render() {
  ctx.clearRect(0, 0, W, H);
  
  // 배경 그라데이션
  const bg = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W, H) * 0.7);
  bg.addColorStop(0, '#1a1a1a');
  bg.addColorStop(1, '#0a0a0a');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);
  
  drawGimbap();
  
  // 토핑들 (드래그 중인 것 제외)
  for (const t of toppings) {
    if (t === dragging) continue;
    if (t.returning) {
      // 되돌아가는 애니메이션
      t.x += (t.originX - t.x) * 0.15;
      t.y += (t.originY - t.y) * 0.15;
      if (Math.abs(t.x - t.originX) < 1 && Math.abs(t.y - t.originY) < 1) {
        t.x = t.originX;
        t.y = t.originY;
        t.returning = false;
      }
    }
    drawTopping(t);
  }
  
  // 드래그 중인 토핑
  if (dragging) {
    // 딸려나온 토핑 먼저
    if (dragging.stuck) {
      const st = dragging.stuck;
      const offsetX = 20 + Math.sin(Date.now() * 0.01) * 5;
      const offsetY = -15 + Math.cos(Date.now() * 0.008) * 3;
      drawTopping(st, mouseX - st.x + offsetX, mouseY - st.y + offsetY, 0.8);
    }
    // 메인 토핑
    drawTopping(dragging, mouseX - dragging.x, mouseY - dragging.y);
  }
  
  requestAnimationFrame(render);
}

// 이벤트
function onPointerDown(e) {
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  
  const hit = hitTest(x, y);
  if (hit) {
    dragging = hit;
    mouseX = x;
    mouseY = y;
    
    // 35% 확률로 다른 토핑 딸려나옴
    if (Math.random() < 0.35) {
      const others = toppings.filter(t => t !== hit);
      if (others.length > 0) {
        const stuck = others[Math.floor(Math.random() * others.length)];
        dragging.stuck = stuck;
        showMessage(`앗! ${stuck.name}이(가) ${hit.name}에 붙어서 딸려나왔어요!`);
      }
    }
    
    hintEl.style.opacity = '0';
  }
}

function onPointerMove(e) {
  const rect = canvas.getBoundingClientRect();
  mouseX = e.clientX - rect.left;
  mouseY = e.clientY - rect.top;
  
  // 쓰레기통 하이라이트
  if (dragging && isOverTrash(e.clientX, e.clientY)) {
    trash.classList.add('active');
  } else {
    trash.classList.remove('active');
  }
}

function onPointerUp(e) {
  if (!dragging) return;
  
  const overTrash = isOverTrash(e.clientX, e.clientY);
  
  if (overTrash) {
    // 토핑 제거
    const idx = toppings.indexOf(dragging);
    if (idx > -1) {
      toppings.splice(idx, 1);
      removed++;
      document.getElementById('removed').textContent = removed;
      document.getElementById('remaining').textContent = toppings.length;
      
      if (!dragging.tasty) {
        showMessage(`${dragging.name} 제거 완료! 좋은 선택이에요 👍`);
      } else {
        showMessage(`${dragging.name}을(를) 버렸어요... 맛있는 건데 😢`);
        mistakes++;
        document.getElementById('mistakes').textContent = mistakes;
      }
    }
    
    // 딸려나온 토핑은 다시 넣기
    if (dragging.stuck) {
      const st = dragging.stuck;
      st.returning = true;
      // 새 위치로 살짝 이동
      st.originX = st.originX + (Math.random() - 0.5) * 30;
      st.originY = st.originY + (Math.random() - 0.5) * 30;
      showMessage(`${st.name}은(는) 다시 김밥 안으로... 🔄`, 2000);
    }
    
    // 모두 제거 시
    if (toppings.length === 0) {
      setTimeout(() => {
        showMessage('김밥 토핑을 모두 제거했습니다! 새 김밥이 나옵니다 🍙', 3000);
        setTimeout(initToppings, 2000);
      }, 500);
    }
  } else {
    // 쓰레기통 밖 → 원위치
    dragging.returning = true;
    if (dragging.stuck) {
      dragging.stuck.returning = true;
      dragging.stuck = null;
    }
  }
  
  dragging = null;
  trash.classList.remove('active');
}

function showMessage(text, duration = 2500) {
  messageEl.textContent = text;
  messageEl.classList.add('show');
  setTimeout(() => messageEl.classList.remove('show'), duration);
}

// 초기화
window.addEventListener('resize', () => { resize(); initToppings(); });
canvas.addEventListener('pointerdown', onPointerDown);
canvas.addEventListener('pointermove', onPointerMove);
canvas.addEventListener('pointerup', onPointerUp);
canvas.addEventListener('pointerleave', onPointerUp);

resize();
initToppings();
render();

// 터치 방지
document.body.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
</script>

</body>
</html>
