<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>김밥 해체실험 — 토핑 분리 연구</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;font-family:'Noto Sans KR',sans-serif;color:#fff;min-height:100vh;overflow:hidden;user-select:none}
.scene{width:100vw;height:100vh;position:relative;display:flex;align-items:center;justify-content:center}

/* 김밥 컨테이너 */
.gimbap-container{position:relative;width:600px;height:400px}
.gimbap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);cursor:grab}
.gimbap.dragging{cursor:grabbing}

/* 김밥 본체 (롤 형태) */
.gimbap-body{
  width:500px;height:120px;
  background:linear-gradient(180deg,#1a1a1a 0%,#2a2a2a 50%,#1a1a1a 100%);
  border-radius:60px;
  position:relative;
  box-shadow:0 8px 30px rgba(0,0,0,0.6),inset 0 2px 10px rgba(255,255,255,0.05);
  overflow:hidden;
}
.gimbap-body::before{
  content:'';
  position:absolute;
  inset:4px;
  background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,0.02) 50%,transparent 100%);
  border-radius:56px;
}

/* 토핑 레이어 */
.topping-layer{
  position:absolute;
  left:20px;right:20px;
  top:50%;transform:translateY(-50%);
  height:80px;
  display:flex;align-items:center;justify-content:center;
  gap:2px;
  padding:0 30px;
}

/* 개별 토핑 */
.topping{
  position:absolute;
  cursor:pointer;
  transition:transform 0.15s, filter 0.15s;
  z-index:10;
}
.topping:hover{
  transform:scale(1.1);
  filter:brightness(1.2);
}
.topping.dragging{
  z-index:100;
  filter:brightness(1.3) drop-shadow(0 10px 20px rgba(0,0,0,0.5));
}
.topping.stuck{
  opacity:0.7;
  animation:wiggle 0.3s ease-in-out infinite;
}
.topping.released{
  transition:all 0.5s cubic-bezier(0.25,0.46,0.45,0.94);
}
@keyframes wiggle{
  0%,100%{transform:rotate(-3deg)}
  50%{transform:rotate(3deg)}
}

/* 토핑 스타일들 */
.topping-carrot{width:80px;height:12px;background:linear-gradient(90deg,#ff6b35,#ff8c42);border-radius:6px}
.topping-spinach{width:70px;height:16px;background:linear-gradient(90deg,#228b22,#32cd32);border-radius:4px;transform:rotate(-5deg)}
.topping-egg{width:60px;height:20px;background:linear-gradient(180deg,#ffd700,#ffb347);border-radius:10px}
.topping-danmuji{width:50px;height:14px;background:linear-gradient(90deg,#ffd700,#ffec8b);border-radius:7px}
.topping-ham{width:55px;height:15px;background:linear-gradient(180deg,#dc143c,#cd5c5c);border-radius:3px}
.topping-crab{width:70px;height:18px;background:linear-gradient(90deg,#ff6b6b,#ff8e8e);border-radius:4px}
.topping-cucumber{width:65px;height:14px;background:linear-gradient(180deg,#90ee90,#32cd32);border-radius:7px}
.topping-tuna{width:60px;height:18px;background:linear-gradient(180deg,#b8860b,#daa520);border-radius:6px;opacity:0.9}
.topping-cheese{width:50px;height:12px;background:linear-gradient(180deg,#fff68f,#ffd700);border-radius:4px}
.topping-sausage{width:55px;height:16px;background:linear-gradient(180deg,#8b4513,#cd853f);border-radius:8px}

/* 떨어진 토핑 */
.fallen-topping{
  position:fixed;
  pointer-events:none;
  z-index:200;
  transition:transform 0.3s, opacity 0.5s;
}

/* 메시지 */
.message{
  position:fixed;
  bottom:100px;left:50%;transform:translateX(-50%);
  font-size:1.2rem;
  font-weight:700;
  color:#fff;
  text-shadow:0 2px 10px rgba(0,0,0,0.8);
  opacity:0;
  transition:opacity 0.3s;
  text-align:center;
  z-index:300;
}
.message.show{opacity:1}

/* 진행 표시 */
.progress-info{
  position:fixed;
  top:30px;left:50%;transform:translateX(-50%);
  font-size:0.9rem;
  color:rgba(255,255,255,0.6);
  text-align:center;
}
.progress-info span{color:#4ade80;font-weight:700}

/* 타이틀 */
.title{
  position:fixed;
  top:60px;left:50%;transform:translateX(-50%);
  font-size:clamp(1.5rem,4vw,2.5rem);
  font-weight:900;
  text-align:center;
  opacity:0;
  animation:titleIn 1s ease-out 0.3s forwards;
}
@keyframes titleIn{
  0%{opacity:0;transform:translateX(-50%) translateY(-20px)}
  100%{opacity:1;transform:translateX(-50%) translateY(0)}
}

/* 자막 영역 */
.subtitle-area{
  position:fixed;
  bottom:40px;left:50%;transform:translateX(-50%);
  width:80%;
  max-width:600px;
  text-align:center;
  font-size:0.85rem;
  color:rgba(255,255,255,0.5);
  line-height:1.6;
}

/* 배경 파티클 */
.bg-particles{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
}
.particle{
  position:absolute;
  font-size:0.7rem;
  color:rgba(255,255,255,0.08);
  animation:float 20s linear infinite;
}
@keyframes float{
  0%{transform:translateY(100vh) rotate(0deg);opacity:0}
  10%{opacity:0.08}
  90%{opacity:0.08}
  100%{transform:translateY(-100px) rotate(360deg);opacity:0}
}
</style>
</head>
<body>

<div class="bg-particles" id="bgParticles"></div>

<div class="progress-info">
  제거한 토핑: <span id="removedCount">0</span>개 | 혼란: <span id="chaosLevel">0</span>%
</div>

<div class="title">김밥 해체실험<br><span style="font-size:0.4em;font-weight:400;opacity:0.6">토핑 분리 연구</span></div>

<div class="scene">
  <div class="gimbap-container" id="gimbapContainer">
    <div class="gimbap" id="gimbap">
      <div class="gimbap-body">
        <div class="topping-layer" id="toppingLayer"></div>
      </div>
    </div>
  </div>
</div>

<div class="message" id="message"></div>

<div class="subtitle-area" id="subtitle">
  드래그로 맛 없는 토핑을 제거하세요<br>
  어떤 토핑이 나올지는 운입니다
</div>

<script>
// 토핑 타입 정의
const TOPPING_TYPES = [
  { name: '단무지', class: 'topping-danmuji', desc: '아삭한 단무지', tasty: true },
  { name: '시금치', class: 'topping-spinach', desc: '영양 가득 시금치', tasty: true },
  { name: '달걀', class: 'topping-egg', desc: '노란 달걀말이', tasty: true },
  { name: '당근', class: 'topping-carrot', desc: '아삭한 당근', tasty: true },
  { name: '햄', class: 'topping-ham', desc: '고소한 햄', tasty: true },
  { name: '게맛살', class: 'topping-crab', desc: '달콤한 게맛살', tasty: true },
  { name: '오이', class: 'topping-cucumber', desc: '시원한 오이', tasty: false },
  { name: '참치', class: 'topping-tuna', desc: '비린 참치', tasty: false },
  { name: '치즈', class: 'topping-cheese', desc: '녹은 치즈', tasty: true },
  { name: '소시지', class: 'topping-sausage', desc: '의심스러운 소시지', tasty: false },
];

// 상태
let toppings = [];
let removedCount = 0;
let chaosLevel = 0;
let dragging = null;
let dragStartX = 0, dragStartY = 0;
let offsetX = 0, offsetY = 0;

const toppingLayer = document.getElementById('toppingLayer');
const messageEl = document.getElementById('message');
const removedCountEl = document.getElementById('removedCount');
const chaosLevelEl = document.getElementById('chaosLevel');
const subtitleEl = document.getElementById('subtitle');

// 배경 파티클 생성
function createBgParticles() {
  const container = document.getElementById('bgParticles');
  const words = ['김밥', '토핑', '당근', '단무지', '시금치', '햄', '달걀', '오이', '참치', '치즈'];
  for (let i = 0; i < 30; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.textContent = words[Math.floor(Math.random() * words.length)];
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDelay = Math.random() * 20 + 's';
    p.style.animationDuration = (15 + Math.random() * 10) + 's';
    container.appendChild(p);
  }
}

// 랜덤 토핑 생성
function createTopping(index, total) {
  const type = TOPPING_TYPES[Math.floor(Math.random() * TOPPING_TYPES.length)];
  const el = document.createElement('div');
  el.className = `topping ${type.class}`;
  el.dataset.type = JSON.stringify(type);
  el.dataset.index = index;
  
  // 랜덤 위치 (롤 내부)
  const angle = (index / total) * Math.PI * 2;
  const radius = 25 + Math.random() * 15;
  const x = Math.cos(angle) * radius;
  const y = Math.sin(angle) * radius * 0.4;
  const rotation = Math.random() * 40 - 20;
  
  el.style.transform = `translate(${x}px, ${y}px) rotate(${rotation}deg)`;
  el.style.zIndex = 10 + index;
  
  // 드래그 이벤트
  el.addEventListener('mousedown', startDrag);
  el.addEventListener('touchstart', startDrag, { passive: false });
  
  return el;
}

// 초기 김밥 생성
function initGimbap() {
  toppingLayer.innerHTML = '';
  toppings = [];
  
  const count = 8 + Math.floor(Math.random() * 5); // 8-12개
  for (let i = 0; i < count; i++) {
    const el = createTopping(i, count);
    toppingLayer.appendChild(el);
    toppings.push(el);
  }
}

// 드래그 시작
function startDrag(e) {
  e.preventDefault();
  const el = e.currentTarget;
  const type = JSON.parse(el.dataset.type);
  
  dragging = {
    el,
    type,
    startX: e.clientX || e.touches[0].clientX,
    startY: e.clientY || e.touches[0].clientY,
    originalTransform: el.style.transform,
    stuck: false,
    friends: []
  };
  
  el.classList.add('dragging');
  
  // 30% 확률로 다른 토핑이 딸려나옴
  if (Math.random() < 0.3) {
    const others = toppings.filter(t => t !== el && !t.classList.contains('fallen-topping'));
    const friendCount = Math.min(1 + Math.floor(Math.random() * 2), others.length);
    for (let i = 0; i < friendCount; i++) {
      const idx = Math.floor(Math.random() * others.length);
      const friend = others.splice(idx, 1)[0];
      dragging.friends.push(friend);
      friend.classList.add('stuck');
    }
    
    if (dragging.friends.length > 0) {
      showMessage(`앗! ${type.name}에서 ${dragging.friends.map(f => JSON.parse(f.dataset.type).name).join(', ')}이(가) 딸려나왔다!`);
    }
  }
  
  document.addEventListener('mousemove', onDrag);
  document.addEventListener('mouseup', endDrag);
  document.addEventListener('touchmove', onDrag, { passive: false });
  document.addEventListener('touchend', endDrag);
}

// 드래그 중
function onDrag(e) {
  if (!dragging) return;
  e.preventDefault();
  
  const x = e.clientX || e.touches[0].clientX;
  const y = e.clientY || e.touches[0].clientY;
  const dx = x - dragging.startX;
  const dy = y - dragging.startY;
  
  dragging.el.style.transform = `translate(${dx}px, ${dy}px) rotate(${Math.random() * 20 - 10}deg)`;
  
  // 딸려나온 토핑들도 함께 이동
  dragging.friends.forEach((friend, i) => {
    const offset = (i + 1) * 30;
    friend.style.transform = `translate(${dx + offset}px, ${dy + Math.sin(i) * 20}px) rotate(${Math.random() * 30 - 15}deg)`;
  });
}

// 드래그 종료
function endDrag(e) {
  if (!dragging) return;
  
  const x = e.clientX || e.changedTouches?.[0]?.clientX || 0;
  const y = e.clientY || e.changedTouches?.[0]?.clientY || 0;
  const gimbapRect = document.getElementById('gimbap').getBoundingClientRect();
  
  // 김밥 밖으로 드래그했는지 확인
  const isOutside = x < gimbapRect.left - 50 || x > gimbapRect.right + 50 ||
                    y < gimbapRect.top - 50 || y > gimbapRect.bottom + 50;
  
  if (isOutside) {
    // 토핑 제거 성공
    removeTopping(dragging.el);
    
    // 딸려나온 것들은 다시 넣어야 함
    if (dragging.friends.length > 0) {
      chaosLevel = Math.min(100, chaosLevel + dragging.friends.length * 15);
      chaosLevelEl.textContent = chaosLevel;
      
      // 역행 애니메이션
      dragging.friends.forEach((friend, i) => {
        setTimeout(() => {
          friend.classList.remove('stuck');
          friend.classList.add('released');
          
          const friendType = JSON.parse(friend.dataset.type);
          
          // 50% 확률로 다시 잘 들어감 vs 헤맴
          if (Math.random() < 0.5) {
            // 성공적으로 복귀
            friend.style.transform = `translate(${Math.random() * 50 - 25}px, ${Math.random() * 20 - 10}px) rotate(${Math.random() * 30 - 15}deg)`;
            showMessage(`${friendType.name}은(는) 다시 잘 들어갔다`);
          } else {
            // 헤매는 애니메이션
            let attempts = 0;
            const maxAttempts = 3;
            const tryInsert = () => {
              attempts++;
              friend.style.transform = `translate(${Math.random() * 80 - 40}px, ${Math.random() * 40 - 20}px) rotate(${Math.random() * 60 - 30}deg)`;
              
              if (attempts < maxAttempts) {
                setTimeout(tryInsert, 300);
              } else {
                showMessage(`${friendType.name}이(가) 겨우 자리를 잡았다...`);
                friend.style.transform = `translate(${Math.random() * 30 - 15}px, ${Math.random() * 15 - 7}px) rotate(${Math.random() * 20 - 10}deg)`;
              }
            };
            tryInsert();
          }
          
          setTimeout(() => {
            friend.classList.remove('released');
          }, 500);
        }, i * 200);
      });
    }
    
    // 맛 없는 토핑이면 칭찬
    if (!dragging.type.tasty) {
      showMessage(`잘했어요! ${dragging.type.name}은(는) 빼는 게 맞죠`);
      chaosLevel = Math.max(0, chaosLevel - 10);
    }
    
  } else {
    // 다시 원위치
    dragging.el.style.transform = dragging.originalTransform;
    dragging.el.classList.remove('dragging');
    
    dragging.friends.forEach(friend => {
      friend.classList.remove('stuck');
      friend.style.transform = '';
    });
  }
  
  document.removeEventListener('mousemove', onDrag);
  document.removeEventListener('mouseup', endDrag);
  document.removeEventListener('touchmove', onDrag);
  document.removeEventListener('touchend', endDrag);
  
  dragging = null;
}

// 토핑 제거
function removeTopping(el) {
  el.classList.remove('dragging');
  el.classList.add('fallen-topping');
  
  const rect = el.getBoundingClientRect();
  el.style.position = 'fixed';
  el.style.left = rect.left + 'px';
  el.style.top = rect.top + 'px';
  el.style.transform = '';
  
  // 떨어지는 애니메이션
  setTimeout(() => {
    el.style.transform = `translateY(${window.innerHeight}px) rotate(${Math.random() * 360}deg)`;
    el.style.opacity = '0';
  }, 50);
  
  setTimeout(() => el.remove(), 600);
  
  // 카운트 업데이트
  removedCount++;
  removedCountEl.textContent = removedCount;
  
  // 남은 토핑 업데이트
  toppings = toppings.filter(t => t !== el);
  
  // 모든 토핑을 제거했으면 새 김밥
  if (toppings.length === 0) {
    setTimeout(() => {
      showMessage('김밥이 다 해체되었습니다! 새 김밥이 나옵니다...');
      setTimeout(initGimbap, 1500);
    }, 500);
  }
  
  // 자막 업데이트
  updateSubtitle();
}

// 메시지 표시
function showMessage(text) {
  messageEl.textContent = text;
  messageEl.classList.add('show');
  setTimeout(() => messageEl.classList.remove('show'), 2500);
}

// 자막 업데이트
function updateSubtitle() {
  const msgs = [
    '드래그로 맛 없는 토핑을 제거하세요',
    '토핑을 빼다 보면 다른 게 딸려나올 수도 있어요',
    '빼고 싶지 않은 토핑은 조심스럽게 다시 넣어주세요',
    '혼란이 높으면 토핑들이 제멋대로 움직여요',
    '오이와 참치는 빼는 게 국룰이죠',
  ];
  
  if (chaosLevel > 50) {
    subtitleEl.innerHTML = '혼란이 가득합니다... 토핑들이 스스로 움직이고 있어요<br>차분하게 하나씩 제거하세요';
  } else {
    subtitleEl.innerHTML = msgs[Math.floor(Math.random() * msgs.length)] + '<br>어떤 토핑이 나올지는 운입니다';
  }
}

// 혼란 효과
function chaosEffect() {
  if (chaosLevel < 30) return;
  
  toppings.forEach(t => {
    if (Math.random() < chaosLevel / 200) {
      const dx = (Math.random() - 0.5) * chaosLevel * 0.3;
      const dy = (Math.random() - 0.5) * chaosLevel * 0.2;
      t.style.transform = `translate(${dx}px, ${dy}px) rotate(${Math.random() * 20 - 10}deg)`;
    }
  });
}

// 초기화
createBgParticles();
initGimbap();
setInterval(chaosEffect, 500);

// 시간 기반 자막 변화
let time = 0;
setInterval(() => {
  time++;
  if (time % 10 === 0) updateSubtitle();
}, 1000);
</script>

</body>
</html>
