<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>김밥 해부학 — 토핑 적출 실험</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#0d0d0d;
  font-family:'Noto Sans KR',sans-serif;
  color:#fff;
  min-height:100vh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}
canvas{display:block;cursor:crosshair}
.ui{position:fixed;top:24px;left:50%;transform:translateX(-50%);text-align:center;z-index:10;pointer-events:none}
.title{font-size:clamp(1.2rem,3vw,1.8rem);font-weight:900;letter-spacing:-0.02em;margin-bottom:6px}
.subtitle{font-size:0.75rem;color:rgba(255,255,255,0.4);letter-spacing:0.1em}
.status{
  position:fixed;bottom:30px;left:50%;transform:translateX(-50%);
  display:flex;gap:24px;font-size:0.8rem;color:rgba(255,255,255,0.5);
  background:rgba(0,0,0,0.6);padding:12px 24px;border-radius:30px;
  backdrop-filter:blur(10px);
}
.status span{color:#4ade80;font-weight:700}
.message{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  font-size:1.1rem;font-weight:700;color:#fff;
  text-shadow:0 2px 20px rgba(0,0,0,0.8);
  opacity:0;transition:opacity 0.4s;
  pointer-events:none;z-index:100;
  text-align:center;
  background:rgba(0,0,0,0.7);padding:16px 32px;border-radius:8px;
}
.message.show{opacity:1}
.hint{
  position:fixed;bottom:100px;left:50%;transform:translateX(-50%);
  font-size:0.7rem;color:rgba(255,255,255,0.3);
  text-align:center;
}
</style>
</head>
<body>

<div class="ui">
  <div class="title">김밥 해부학</div>
  <div class="subtitle">GIMBAP ANATOMY — 토핑 적출 실험</div>
</div>

<canvas id="canvas"></canvas>

<div class="status">
  <div>적출: <span id="removed">0</span></div>
  <div>남은 토핑: <span id="remaining">0</span></div>
  <div>딸림 사고: <span id="accidents">0</span></div>
</div>

<div class="hint" id="hint">토핑 단면을 클릭 → 밖으로 당겨서 적출하세요</div>

<div class="message" id="message"></div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const messageEl = document.getElementById('message');
const hintEl = document.getElementById('hint');

let W, H;
let toppings = [];
let dragging = null;
let mouseX = 0, mouseY = 0;
let removed = 0, accidents = 0;

// 김밥 기하학 (사선 뷰)
const GIMBAP = {
  cx: 0, cy: 0,
  length: 400,
  radius: 80,
  angle: Math.PI * 0.15, // 사선 각도
  tilt: 0.4, // 타원 찌그러짐
};

// 토핑 정의
const TOPPING_DEFS = [
  { name: '단무지', color: '#f7d358', darkColor: '#c9a82e', radius: 8, tasty: true },
  { name: '시금치', color: '#4caf50', darkColor: '#2e7d32', radius: 6, tasty: true },
  { name: '달걀', color: '#ffd54f', darkColor: '#f9a825', radius: 12, tasty: true },
  { name: '당근', color: '#ff7043', darkColor: '#d84315', radius: 7, tasty: true },
  { name: '햄', color: '#ef9a9a', darkColor: '#c62828', radius: 10, tasty: true },
  { name: '게맛살', color: '#ffccbc', darkColor: '#ff8a65', radius: 9, tasty: true },
  { name: '오이', color: '#a5d6a7', darkColor: '#66bb6a', radius: 8, tasty: false },
  { name: '우엉', color: '#8d6e63', darkColor: '#5d4037', radius: 5, tasty: false },
  { name: '어묵', color: '#d7ccc8', darkColor: '#a1887f', radius: 11, tasty: true },
  { name: '맛살', color: '#ffab91', darkColor: '#ff7043', radius: 8, tasty: false },
];

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W;
  canvas.height = H;
  GIMBAP.cx = W / 2;
  GIMBAP.cy = H / 2;
  GIMBAP.length = Math.min(W, H) * 0.5;
  GIMBAP.radius = Math.min(W, H) * 0.12;
}

function initToppings() {
  toppings = [];
  const count = 7 + Math.floor(Math.random() * 4);
  
  for (let i = 0; i < count; i++) {
    const def = TOPPING_DEFS[Math.floor(Math.random() * TOPPING_DEFS.length)];
    
    // 단면 내 랜덤 위치 (중심에서 떨어진 각도와 거리)
    const angle = Math.random() * Math.PI * 2;
    const dist = Math.random() * (GIMBAP.radius * 0.65);
    
    toppings.push({
      ...def,
      id: i,
      angle,
      dist,
      pullAmount: 0, // 당겨진 정도 (0~1 → 완전 적출)
      stuck: null,
      returning: false,
      wiggle: 0,
    });
  }
  
  document.getElementById('remaining').textContent = toppings.length;
}

// 김밥 본체 그리기 (3/4 사선 뷰)
function drawGimbapBody() {
  const { cx, cy, length, radius, angle, tilt } = GIMBAP;
  
  // 김밥 방향 벡터
  const dx = Math.cos(angle);
  const dy = Math.sin(angle);
  
  // 뒤쪽 단면 (먼 쪽)
  const backX = cx + dx * length * 0.5;
  const backY = cy + dy * length * 0.5;
  
  // 앞쪽 단면 (가까운 쪽)
  const frontX = cx - dx * length * 0.5;
  const frontY = cy - dy * length * 0.5;
  
  // --- 김 몸통 (원기둥) ---
  ctx.save();
  
  // 그림자
  ctx.shadowColor = 'rgba(0,0,0,0.5)';
  ctx.shadowBlur = 30;
  ctx.shadowOffsetX = 10;
  ctx.shadowOffsetY = 15;
  
  // 몸통 상단면
  ctx.beginPath();
  ctx.moveTo(frontX - dy * radius, frontY + dx * radius * tilt);
  ctx.lineTo(backX - dy * radius, backY + dx * radius * tilt);
  ctx.ellipse(backX, backY, radius, radius * tilt, angle, -Math.PI/2, Math.PI/2);
  ctx.lineTo(frontX + dy * radius, frontY - dx * radius * tilt);
  ctx.ellipse(frontX, frontY, radius, radius * tilt, angle, Math.PI/2, -Math.PI/2);
  ctx.closePath();
  
  // 김 텍스처 그라데이션
  const bodyGrad = ctx.createLinearGradient(
    cx - dy * radius, cy + dx * radius,
    cx + dy * radius, cy - dx * radius
  );
  bodyGrad.addColorStop(0, '#1a1f1a');
  bodyGrad.addColorStop(0.3, '#2a302a');
  bodyGrad.addColorStop(0.5, '#1f251f');
  bodyGrad.addColorStop(0.7, '#252b25');
  bodyGrad.addColorStop(1, '#151a15');
  ctx.fillStyle = bodyGrad;
  ctx.fill();
  
  ctx.shadowColor = 'transparent';
  
  // 김 얼룩 텍스처
  ctx.globalAlpha = 0.15;
  for (let i = 0; i < 80; i++) {
    const t = Math.random();
    const px = frontX + (backX - frontX) * t + (Math.random() - 0.5) * radius * 1.5 * dy;
    const py = frontY + (backY - frontY) * t + (Math.random() - 0.5) * radius * 1.5 * dx;
    ctx.beginPath();
    ctx.arc(px, py, 2 + Math.random() * 4, 0, Math.PI * 2);
    ctx.fillStyle = Math.random() > 0.5 ? '#3a4a3a' : '#0a0f0a';
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  
  ctx.restore();
  
  // --- 뒤쪽 단면 (흐릿하게) ---
  ctx.save();
  ctx.globalAlpha = 0.4;
  drawCrossSection(backX, backY, 0.9);
  ctx.restore();
  
  // --- 앞쪽 단면 (선명하게) ---
  drawCrossSection(frontX, frontY, 1);
  
  return { frontX, frontY, backX, backY, dx, dy };
}

// 단면 그리기
function drawCrossSection(cx, cy, scale) {
  const { radius, angle, tilt } = GIMBAP;
  const r = radius * scale;
  
  // 김 테두리
  ctx.beginPath();
  ctx.ellipse(cx, cy, r, r * tilt, angle, 0, Math.PI * 2);
  ctx.fillStyle = '#1a1a1a';
  ctx.fill();
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 2;
  ctx.stroke();
  
  // 밥 (내부)
  ctx.beginPath();
  ctx.ellipse(cx, cy, r * 0.92, r * 0.92 * tilt, angle, 0, Math.PI * 2);
  const riceGrad = ctx.createRadialGradient(cx, cy - r * 0.2, 0, cx, cy, r);
  riceGrad.addColorStop(0, '#fafafa');
  riceGrad.addColorStop(0.6, '#f5f5f5');
  riceGrad.addColorStop(1, '#e8e8e8');
  ctx.fillStyle = riceGrad;
  ctx.fill();
  
  // 밥알 텍스처
  ctx.fillStyle = 'rgba(180,180,180,0.25)';
  for (let i = 0; i < 60; i++) {
    const a = Math.random() * Math.PI * 2;
    const d = Math.random() * r * 0.85;
    const rx = cx + Math.cos(a + angle) * d;
    const ry = cy + Math.sin(a + angle) * d * tilt;
    ctx.beginPath();
    ctx.ellipse(rx, ry, 1.5 + Math.random() * 1.5, 0.8, Math.random() * Math.PI, 0, Math.PI * 2);
    ctx.fill();
  }
}

// 토핑 단면 위치 계산
function getToppingCrossSectionPos(t) {
  const { cx, cy, length, radius, angle, tilt } = GIMBAP;
  const dx = Math.cos(angle);
  const dy = Math.sin(angle);
  const frontX = cx - dx * length * 0.5;
  const frontY = cy - dy * length * 0.5;
  
  // 토핑 단면 위치 (앞쪽 단면 기준)
  const tx = frontX + Math.cos(t.angle + angle) * t.dist;
  const ty = frontY + Math.sin(t.angle + angle) * t.dist * tilt;
  
  return { x: tx, y: ty, dx, dy };
}

// 토핑 그리기 (단면 + 당겨진 몸통)
function drawTopping(t, isHovered = false) {
  const { radius, angle, tilt, length } = GIMBAP;
  const pos = getToppingCrossSectionPos(t);
  
  const pullDist = t.pullAmount * length * 0.8; // 당겨진 거리
  
  // 당겨진 토핑 몸통 (주르륵)
  if (pullDist > 5) {
    ctx.save();
    
    // 토핑 몸통 (원기둥 형태)
    const endX = pos.x - pos.dx * pullDist;
    const endY = pos.y - pos.dy * pullDist;
    
    // 그림자
    ctx.shadowColor = 'rgba(0,0,0,0.4)';
    ctx.shadowBlur = 15;
    ctx.shadowOffsetX = 3;
    ctx.shadowOffsetY = 5;
    
    // 원기둥 몸통
    const bodyWidth = t.radius * 2;
    const perpX = -pos.dy;
    const perpY = pos.dx * tilt;
    
    ctx.beginPath();
    ctx.moveTo(pos.x + perpX * bodyWidth * 0.5, pos.y + perpY * bodyWidth * 0.5);
    ctx.lineTo(endX + perpX * bodyWidth * 0.5, endY + perpY * bodyWidth * 0.5);
    ctx.lineTo(endX - perpX * bodyWidth * 0.5, endY - perpY * bodyWidth * 0.5);
    ctx.lineTo(pos.x - perpX * bodyWidth * 0.5, pos.y - perpY * bodyWidth * 0.5);
    ctx.closePath();
    
    const bodyGrad = ctx.createLinearGradient(
      pos.x + perpX * bodyWidth, pos.y,
      pos.x - perpX * bodyWidth, pos.y
    );
    bodyGrad.addColorStop(0, t.darkColor);
    bodyGrad.addColorStop(0.3, t.color);
    bodyGrad.addColorStop(0.7, t.color);
    bodyGrad.addColorStop(1, t.darkColor);
    ctx.fillStyle = bodyGrad;
    ctx.fill();
    
    // 끝 부분 (타원)
    ctx.beginPath();
    ctx.ellipse(endX, endY, t.radius, t.radius * tilt * 0.8, angle, 0, Math.PI * 2);
    ctx.fillStyle = t.color;
    ctx.fill();
    ctx.strokeStyle = t.darkColor;
    ctx.lineWidth = 1.5;
    ctx.stroke();
    
    ctx.restore();
  }
  
  // 단면 (김밥 안에 남아있는 부분)
  if (t.pullAmount < 1) {
    ctx.save();
    
    const wiggleX = Math.sin(t.wiggle) * 2;
    const wiggleY = Math.cos(t.wiggle * 0.7) * 1;
    
    ctx.beginPath();
    ctx.ellipse(
      pos.x + wiggleX,
      pos.y + wiggleY,
      t.radius * (isHovered ? 1.15 : 1),
      t.radius * tilt * (isHovered ? 1.15 : 1),
      angle, 0, Math.PI * 2
    );
    
    const grad = ctx.createRadialGradient(
      pos.x - t.radius * 0.3, pos.y - t.radius * 0.3, 0,
      pos.x, pos.y, t.radius
    );
    grad.addColorStop(0, '#fff');
    grad.addColorStop(0.3, t.color);
    grad.addColorStop(1, t.darkColor);
    ctx.fillStyle = grad;
    ctx.fill();
    
    if (isHovered) {
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    
    ctx.restore();
  }
}

// 딸려나온 토핑 그리기
function drawStuckTopping(main, stuck) {
  if (!stuck || main.pullAmount < 0.1) return;
  
  const { angle, tilt, length } = GIMBAP;
  const mainPos = getToppingCrossSectionPos(main);
  const stuckPos = getToppingCrossSectionPos(stuck);
  
  const pullDist = main.pullAmount * length * 0.6; // 메인보다 약간 덜 당겨짐
  
  ctx.save();
  ctx.globalAlpha = 0.85;
  
  if (pullDist > 5) {
    const endX = stuckPos.x - mainPos.dx * pullDist + Math.sin(Date.now() * 0.005) * 8;
    const endY = stuckPos.y - mainPos.dy * pullDist + Math.cos(Date.now() * 0.004) * 4;
    
    const bodyWidth = stuck.radius * 2;
    const perpX = -mainPos.dy;
    const perpY = mainPos.dx * tilt;
    
    ctx.beginPath();
    ctx.moveTo(stuckPos.x + perpX * bodyWidth * 0.5, stuckPos.y + perpY * bodyWidth * 0.5);
    ctx.lineTo(endX + perpX * bodyWidth * 0.5, endY + perpY * bodyWidth * 0.5);
    ctx.lineTo(endX - perpX * bodyWidth * 0.5, endY - perpY * bodyWidth * 0.5);
    ctx.lineTo(stuckPos.x - perpX * bodyWidth * 0.5, stuckPos.y - perpY * bodyWidth * 0.5);
    ctx.closePath();
    ctx.fillStyle = stuck.color;
    ctx.fill();
    
    ctx.beginPath();
    ctx.ellipse(endX, endY, stuck.radius * 0.9, stuck.radius * tilt * 0.7, angle, 0, Math.PI * 2);
    ctx.fillStyle = stuck.color;
    ctx.fill();
  }
  
  ctx.restore();
}

// 토핑 히트 테스트
function hitTestTopping(mx, my) {
  const { angle, tilt } = GIMBAP;
  
  for (let i = toppings.length - 1; i >= 0; i--) {
    const t = toppings[i];
    if (t.pullAmount >= 1) continue;
    
    const pos = getToppingCrossSectionPos(t);
    const dx = mx - pos.x;
    const dy = my - pos.y;
    
    // 타원 히트 테스트
    const dist = Math.sqrt((dx * dx) + (dy * dy) / (tilt * tilt));
    if (dist < t.radius * 1.5) return t;
  }
  return null;
}

// 메인 렌더링
function render() {
  ctx.clearRect(0, 0, W, H);
  
  // 배경
  const bg = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W, H) * 0.7);
  bg.addColorStop(0, '#1f1f1f');
  bg.addColorStop(1, '#0a0a0a');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);
  
  // 김밥 몸통
  const gimbapInfo = drawGimbapBody();
  
  // 토핑 (당겨진 것 먼저)
  const sortedToppings = [...toppings].sort((a, b) => a.pullAmount - b.pullAmount);
  
  for (const t of sortedToppings) {
    if (t === dragging) continue;
    
    // 위글 업데이트
    if (t.wiggle > 0) t.wiggle *= 0.92;
    
    // 되돌아가기 애니메이션
    if (t.returning) {
      t.pullAmount *= 0.85;
      if (t.pullAmount < 0.01) {
        t.pullAmount = 0;
        t.returning = false;
        t.stuck = null;
      }
    }
    
    drawTopping(t, hitTestTopping(mouseX, mouseY) === t);
    if (t.stuck) drawStuckTopping(t, t.stuck);
  }
  
  // 드래그 중인 토핑
  if (dragging) {
    drawTopping(dragging, true);
    if (dragging.stuck) drawStuckTopping(dragging, dragging.stuck);
  }
  
  requestAnimationFrame(render);
}

// 이벤트
function onPointerDown(e) {
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  
  const hit = hitTestTopping(x, y);
  if (hit && hit.pullAmount < 1) {
    dragging = hit;
    dragging.startPull = dragging.pullAmount;
    dragging.startMouse = { x, y };
    
    // 30% 확률로 딸려나옴
    if (Math.random() < 0.3 && !dragging.stuck) {
      const others = toppings.filter(t => t !== hit && t.pullAmount < 0.5);
      if (others.length > 0) {
        const stuck = others[Math.floor(Math.random() * others.length)];
        dragging.stuck = stuck;
        showMessage(`앗! ${stuck.name}이(가) 같이 딸려나왔어요!`);
        accidents++;
        document.getElementById('accidents').textContent = accidents;
      }
    }
    
    hintEl.style.opacity = '0';
  }
}

function onPointerMove(e) {
  const rect = canvas.getBoundingClientRect();
  mouseX = e.clientX - rect.left;
  mouseY = e.clientY - rect.top;
  
  if (dragging) {
    const { dx, dy } = getToppingCrossSectionPos(dragging);
    
    // 마우스 이동을 김밥 방향으로 투영
    const moveDx = mouseX - dragging.startMouse.x;
    const moveDy = mouseY - dragging.startMouse.y;
    const pullDir = -(moveDx * dx + moveDy * dy); // 당기는 방향 (음수 = 밖으로)
    
    dragging.pullAmount = Math.max(0, Math.min(1, dragging.startPull + pullDir / (GIMBAP.length * 0.6)));
    dragging.wiggle = Math.sin(Date.now() * 0.02) * 3 * dragging.pullAmount;
  }
}

function onPointerUp(e) {
  if (!dragging) return;
  
  if (dragging.pullAmount > 0.85) {
    // 적출 완료!
    const idx = toppings.indexOf(dragging);
    if (idx > -1) {
      toppings.splice(idx, 1);
      removed++;
      document.getElementById('removed').textContent = removed;
      document.getElementById('remaining').textContent = toppings.length;
      
      if (!dragging.tasty) {
        showMessage(`${dragging.name} 적출 완료! 👍`);
      } else {
        showMessage(`${dragging.name}... 맛있는 건데 😢`);
      }
    }
    
    // 딸려나온 토핑은 다시 넣기
    if (dragging.stuck) {
      dragging.stuck.returning = true;
      dragging.stuck.pullAmount = dragging.pullAmount * 0.7;
      showMessage(`${dragging.stuck.name}은(는) 다시 들어갑니다 🔄`, 2500);
    }
    
    if (toppings.length === 0) {
      setTimeout(() => {
        showMessage('모든 토핑 적출 완료! 새 김밥 준비 중... 🍙', 3000);
        setTimeout(initToppings, 2000);
      }, 500);
    }
  } else {
    // 덜 당겼으면 되돌아가기
    dragging.returning = true;
    if (dragging.stuck) {
      dragging.stuck.returning = true;
      dragging.stuck.pullAmount = dragging.pullAmount * 0.5;
    }
  }
  
  dragging = null;
}

function showMessage(text, duration = 2500) {
  messageEl.textContent = text;
  messageEl.classList.add('show');
  setTimeout(() => messageEl.classList.remove('show'), duration);
}

// 초기화
window.addEventListener('resize', () => { resize(); initToppings(); });
canvas.addEventListener('pointerdown', onPointerDown);
canvas.addEventListener('pointermove', onPointerMove);
canvas.addEventListener('pointerup', onPointerUp);
canvas.addEventListener('pointerleave', onPointerUp);

resize();
initToppings();
render();

document.body.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
</script>

</body>
</html>
