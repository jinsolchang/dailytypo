<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>김밥 해부학 — 토핑 적출 실험</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#1a1815;
  font-family:'Noto Sans KR',sans-serif;
  color:#fff;
  min-height:100vh;
  overflow:hidden;
}
canvas{display:block;cursor:crosshair}
.ui{position:fixed;top:24px;left:50%;transform:translateX(-50%);text-align:center;z-index:10;pointer-events:none}
.title{font-size:clamp(1.2rem,3vw,1.8rem);font-weight:900;margin-bottom:6px}
.subtitle{font-size:0.75rem;color:rgba(255,255,255,0.4);letter-spacing:0.1em}
.status{
  position:fixed;bottom:30px;left:50%;transform:translateX(-50%);
  display:flex;gap:24px;font-size:0.8rem;color:rgba(255,255,255,0.5);
  background:rgba(0,0,0,0.6);padding:12px 24px;border-radius:30px;
}
.status span{color:#4ade80;font-weight:700}
.message{
  position:fixed;top:42%;left:50%;transform:translate(-50%,-50%);
  font-size:1rem;font-weight:700;color:#fff;
  opacity:0;transition:opacity 0.4s;
  pointer-events:none;z-index:100;
  background:rgba(0,0,0,0.8);padding:14px 28px;border-radius:8px;
}
.message.show{opacity:1}
.hint{
  position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
  font-size:0.7rem;color:rgba(255,255,255,0.3);
}
</style>
</head>
<body>

<div class="ui">
  <div class="title">김밥 해부학</div>
  <div class="subtitle">GIMBAP ANATOMY — 토핑 적출</div>
</div>

<canvas id="canvas"></canvas>

<div class="status">
  <div>적출: <span id="removed">0</span></div>
  <div>남은 토핑: <span id="remaining">0</span></div>
</div>

<div class="hint" id="hint">단면의 토핑을 클릭 → 바깥으로 당겨서 적출</div>

<div class="message" id="message"></div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const messageEl = document.getElementById('message');

let W, H;
let toppings = [];
let dragging = null;
let mouseX = 0, mouseY = 0;
let removed = 0;

// 김밥 파라미터
let GB = {};

// 45도 방향 (우상단 → 좌하단)
const ANGLE = -Math.PI / 4;  // -45도
const DIR_X = Math.cos(ANGLE);
const DIR_Y = Math.sin(ANGLE);

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W;
  canvas.height = H;
  
  const size = Math.min(W, H) * 0.55;
  GB = {
    cx: W / 2,
    cy: H / 2,
    length: size,
    radius: size * 0.18,
    tilt: 0.4,  // 위에서 보는 정도 (타원 찌그러짐)
  };
}

// 토핑 정의
const TOPPING_DEFS = [
  { name: '단무지', color: '#f7d358', dark: '#c9a82e', r: 12 },
  { name: '시금치', color: '#4caf50', dark: '#2e7d32', r: 8 },
  { name: '달걀', color: '#ffd54f', dark: '#f9a825', r: 15 },
  { name: '당근', color: '#ff7043', dark: '#e64a19', r: 9 },
  { name: '햄', color: '#ef9a9a', dark: '#e57373', r: 13 },
  { name: '게맛살', color: '#ffccbc', dark: '#ffab91', r: 11 },
  { name: '오이', color: '#a5d6a7', dark: '#81c784', r: 10 },
  { name: '우엉', color: '#8d6e63', dark: '#6d4c41', r: 7 },
];

function initToppings() {
  toppings = [];
  const count = 6 + Math.floor(Math.random() * 3);
  
  for (let i = 0; i < count; i++) {
    const def = TOPPING_DEFS[Math.floor(Math.random() * TOPPING_DEFS.length)];
    const angle = (i / count) * Math.PI * 2 + Math.random() * 0.4;
    const dist = GB.radius * (0.25 + Math.random() * 0.45);
    
    toppings.push({
      ...def,
      id: i,
      angle,  // 단면 내 위치 각도
      dist,   // 단면 중심으로부터 거리
      pull: 0,
      returning: false,
      stuck: null,
    });
  }
  document.getElementById('remaining').textContent = toppings.length;
}

// 앞 단면 중심 (우상단)
function getFrontCenter() {
  return {
    x: GB.cx + DIR_X * GB.length * 0.45,
    y: GB.cy + DIR_Y * GB.length * 0.45
  };
}

// 뒤 단면 중심 (좌하단)
function getBackCenter() {
  return {
    x: GB.cx - DIR_X * GB.length * 0.45,
    y: GB.cy - DIR_Y * GB.length * 0.45
  };
}

// 토핑 단면 위치 (앞 단면 기준)
function getToppingPos(t) {
  const front = getFrontCenter();
  // 단면은 45도 기울어진 타원
  // 로컬 좌표를 월드로 변환
  const localX = Math.cos(t.angle) * t.dist;
  const localY = Math.sin(t.angle) * t.dist * GB.tilt;
  
  // 45도 회전
  const worldX = localX * Math.cos(ANGLE + Math.PI/2) - localY * Math.sin(ANGLE + Math.PI/2);
  const worldY = localX * Math.sin(ANGLE + Math.PI/2) + localY * Math.cos(ANGLE + Math.PI/2);
  
  return {
    x: front.x + worldX,
    y: front.y + worldY
  };
}

// 토핑 빠져나온 끝 위치
function getToppingEnd(t) {
  const pos = getToppingPos(t);
  return {
    x: pos.x - DIR_X * t.pull,
    y: pos.y - DIR_Y * t.pull
  };
}

// 타원 그리기 (45도 회전된)
function drawEllipse(cx, cy, rx, ry, fill, stroke) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(ANGLE + Math.PI/2);  // 타원 축을 김밥 방향에 수직으로
  ctx.beginPath();
  ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
  if (fill) {
    ctx.fillStyle = fill;
    ctx.fill();
  }
  if (stroke) {
    ctx.strokeStyle = stroke;
    ctx.lineWidth = 2;
    ctx.stroke();
  }
  ctx.restore();
}

// 김밥 몸통 그리기
function drawGimbapBody() {
  const front = getFrontCenter();
  const back = getBackCenter();
  const r = GB.radius;
  const ry = r * GB.tilt;
  
  ctx.save();
  
  // 그림자
  ctx.shadowColor = 'rgba(0,0,0,0.5)';
  ctx.shadowBlur = 50;
  ctx.shadowOffsetX = 15;
  ctx.shadowOffsetY = 25;
  
  // 수직 방향 (타원 장축 방향)
  const perpX = Math.cos(ANGLE + Math.PI/2);
  const perpY = Math.sin(ANGLE + Math.PI/2);
  
  // 몸통 (위쪽 면)
  ctx.beginPath();
  // 앞 단면 위쪽 호
  ctx.ellipse(front.x, front.y, r, ry, ANGLE + Math.PI/2, -Math.PI/2, Math.PI/2);
  // 뒤 단면으로 선
  ctx.lineTo(back.x + perpX * r, back.y + perpY * r);
  // 뒤 단면 아래쪽 호
  ctx.ellipse(back.x, back.y, r, ry, ANGLE + Math.PI/2, Math.PI/2, -Math.PI/2);
  // 앞 단면으로 돌아감
  ctx.closePath();
  
  // 김 텍스처
  const bodyGrad = ctx.createLinearGradient(
    GB.cx - perpX * r, GB.cy - perpY * r,
    GB.cx + perpX * r, GB.cy + perpY * r
  );
  bodyGrad.addColorStop(0, '#151a15');
  bodyGrad.addColorStop(0.3, '#252a25');
  bodyGrad.addColorStop(0.5, '#1f241f');
  bodyGrad.addColorStop(0.7, '#2a302a');
  bodyGrad.addColorStop(1, '#1a1f1a');
  ctx.fillStyle = bodyGrad;
  ctx.fill();
  
  ctx.shadowColor = 'transparent';
  
  // 김 텍스처 점들
  ctx.globalAlpha = 0.1;
  for (let i = 0; i < 80; i++) {
    const t = Math.random();
    const px = back.x + (front.x - back.x) * t + (Math.random() - 0.5) * r * 1.5 * perpX;
    const py = back.y + (front.y - back.y) * t + (Math.random() - 0.5) * r * 1.5 * perpY;
    ctx.beginPath();
    ctx.arc(px, py, 1 + Math.random() * 3, 0, Math.PI * 2);
    ctx.fillStyle = Math.random() > 0.5 ? '#3a4a3a' : '#0a0f0a';
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  
  // 뒤 단면 (어두움)
  drawEllipse(back.x, back.y, r, ry, '#0f0f0f', '#1a1a1a');
  
  ctx.restore();
}

// 앞 단면 그리기
function drawFrontSection() {
  const front = getFrontCenter();
  const r = GB.radius;
  const ry = r * GB.tilt;
  
  // 김 테두리
  drawEllipse(front.x, front.y, r + 4, (r + 4) * GB.tilt, '#1a1a1a', null);
  
  // 밥
  ctx.save();
  ctx.translate(front.x, front.y);
  ctx.rotate(ANGLE + Math.PI/2);
  ctx.beginPath();
  ctx.ellipse(0, 0, r, ry, 0, 0, Math.PI * 2);
  
  const riceGrad = ctx.createRadialGradient(-r*0.2, -ry*0.2, 0, 0, 0, r);
  riceGrad.addColorStop(0, '#ffffff');
  riceGrad.addColorStop(0.6, '#f8f8f8');
  riceGrad.addColorStop(1, '#eaeaea');
  ctx.fillStyle = riceGrad;
  ctx.fill();
  
  // 밥알
  ctx.fillStyle = 'rgba(200,200,200,0.3)';
  for (let i = 0; i < 40; i++) {
    const a = Math.random() * Math.PI * 2;
    const d = Math.random() * r * 0.85;
    const px = Math.cos(a) * d;
    const py = Math.sin(a) * d * GB.tilt;
    ctx.beginPath();
    ctx.ellipse(px, py, 1.5, 0.7, Math.random() * Math.PI, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

// 토핑 그리기
function drawTopping(t, hover = false) {
  const pos = getToppingPos(t);
  const end = getToppingEnd(t);
  const r = t.r * (hover ? 1.15 : 1);
  const ry = r * GB.tilt;
  
  // 빠져나온 몸통
  if (t.pull > 15) {
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.3)';
    ctx.shadowBlur = 12;
    ctx.shadowOffsetY = 6;
    
    const perpX = Math.cos(ANGLE + Math.PI/2);
    const perpY = Math.sin(ANGLE + Math.PI/2);
    
    // 원기둥 옆면
    ctx.beginPath();
    ctx.moveTo(pos.x + perpX * r, pos.y + perpY * ry);
    ctx.lineTo(end.x + perpX * r, end.y + perpY * ry);
    ctx.ellipse(end.x, end.y, r, ry, ANGLE + Math.PI/2, Math.PI/2, -Math.PI/2, true);
    ctx.lineTo(pos.x - perpX * r, pos.y - perpY * ry);
    ctx.closePath();
    
    const grad = ctx.createLinearGradient(
      pos.x - perpX * r, pos.y - perpY * r,
      pos.x + perpX * r, pos.y + perpY * r
    );
    grad.addColorStop(0, t.dark);
    grad.addColorStop(0.35, t.color);
    grad.addColorStop(0.65, t.color);
    grad.addColorStop(1, t.dark);
    ctx.fillStyle = grad;
    ctx.fill();
    
    // 끝 단면
    drawEllipse(end.x, end.y, r, ry, t.color, t.dark);
    
    // 하이라이트
    ctx.save();
    ctx.translate(end.x, end.y);
    ctx.rotate(ANGLE + Math.PI/2);
    ctx.beginPath();
    ctx.ellipse(-r*0.3, -ry*0.3, r*0.25, ry*0.2, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fill();
    ctx.restore();
    
    ctx.restore();
  }
  
  // 단면 토핑 (아직 안 빠진 부분)
  if (t.pull < GB.length * 0.9) {
    ctx.save();
    ctx.translate(pos.x, pos.y);
    ctx.rotate(ANGLE + Math.PI/2);
    ctx.beginPath();
    ctx.ellipse(0, 0, r, ry, 0, 0, Math.PI * 2);
    
    const grad = ctx.createRadialGradient(-r*0.25, -ry*0.25, 0, 0, 0, r);
    grad.addColorStop(0, '#fff');
    grad.addColorStop(0.35, t.color);
    grad.addColorStop(1, t.dark);
    ctx.fillStyle = grad;
    ctx.fill();
    
    if (hover) {
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2.5;
      ctx.stroke();
    }
    ctx.restore();
  }
}

// 딸려나온 토핑
function drawStuckTopping(main, stuck) {
  if (!stuck || main.pull < 40) return;
  
  const pos = getToppingPos(stuck);
  const pullAmt = main.pull * 0.55;
  const wobble = Math.sin(Date.now() * 0.008) * 8;
  const end = {
    x: pos.x - DIR_X * pullAmt + wobble * 0.5,
    y: pos.y - DIR_Y * pullAmt + wobble * 0.3
  };
  const r = stuck.r * 0.9;
  const ry = r * GB.tilt;
  const perpX = Math.cos(ANGLE + Math.PI/2);
  const perpY = Math.sin(ANGLE + Math.PI/2);
  
  ctx.save();
  ctx.globalAlpha = 0.8;
  
  // 몸통
  ctx.beginPath();
  ctx.moveTo(pos.x + perpX * r, pos.y + perpY * ry);
  ctx.lineTo(end.x + perpX * r, end.y + perpY * ry);
  ctx.ellipse(end.x, end.y, r, ry, ANGLE + Math.PI/2, Math.PI/2, -Math.PI/2, true);
  ctx.lineTo(pos.x - perpX * r, pos.y - perpY * ry);
  ctx.closePath();
  ctx.fillStyle = stuck.color;
  ctx.fill();
  
  drawEllipse(end.x, end.y, r, ry, stuck.color, null);
  
  ctx.restore();
}

// 히트 테스트
function hitTest(mx, my) {
  const front = getFrontCenter();
  
  for (let i = toppings.length - 1; i >= 0; i--) {
    const t = toppings[i];
    if (t.pull >= GB.length * 0.85) continue;
    
    const pos = getToppingPos(t);
    
    // 회전 고려한 거리 계산
    const dx = mx - pos.x;
    const dy = my - pos.y;
    
    // 역회전으로 로컬 좌표
    const localX = dx * Math.cos(-(ANGLE + Math.PI/2)) - dy * Math.sin(-(ANGLE + Math.PI/2));
    const localY = dx * Math.sin(-(ANGLE + Math.PI/2)) + dy * Math.cos(-(ANGLE + Math.PI/2));
    
    // 타원 히트
    const normDist = (localX * localX) / (t.r * t.r) + (localY * localY) / ((t.r * GB.tilt) * (t.r * GB.tilt));
    if (normDist < 2.5) return t;
  }
  return null;
}

// 렌더링
function render() {
  ctx.clearRect(0, 0, W, H);
  
  // 배경
  const bg = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W,H)*0.7);
  bg.addColorStop(0, '#2a2520');
  bg.addColorStop(1, '#1a1815');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);
  
  // 빠져나온 토핑 (김밥 뒤)
  for (const t of toppings) {
    if (t.pull > 15 && t !== dragging) {
      drawTopping(t);
      if (t.stuck) drawStuckTopping(t, t.stuck);
    }
  }
  
  // 김밥
  drawGimbapBody();
  drawFrontSection();
  
  // 단면 토핑
  const hovered = hitTest(mouseX, mouseY);
  for (const t of toppings) {
    if (t === dragging) continue;
    
    if (t.returning) {
      t.pull *= 0.85;
      if (t.pull < 8) {
        t.pull = 0;
        t.returning = false;
        t.stuck = null;
      }
    }
    
    if (t.pull <= 15) {
      drawTopping(t, t === hovered);
    }
  }
  
  // 드래그 중
  if (dragging) {
    drawTopping(dragging, true);
    if (dragging.stuck) drawStuckTopping(dragging, dragging.stuck);
  }
  
  requestAnimationFrame(render);
}

// 이벤트
canvas.addEventListener('pointerdown', e => {
  const rect = canvas.getBoundingClientRect();
  mouseX = e.clientX - rect.left;
  mouseY = e.clientY - rect.top;
  
  const hit = hitTest(mouseX, mouseY);
  if (hit) {
    dragging = hit;
    dragging.startMouse = { x: mouseX, y: mouseY };
    dragging.startPull = dragging.pull;
    
    if (Math.random() < 0.3 && !dragging.stuck) {
      const others = toppings.filter(t => t !== hit && t.pull < 40);
      if (others.length) {
        dragging.stuck = others[Math.floor(Math.random() * others.length)];
        showMessage(`${dragging.stuck.name}이(가) 딸려나왔어요!`);
      }
    }
    document.getElementById('hint').style.opacity = '0';
  }
});

canvas.addEventListener('pointermove', e => {
  const rect = canvas.getBoundingClientRect();
  mouseX = e.clientX - rect.left;
  mouseY = e.clientY - rect.top;
  
  if (dragging) {
    const dx = mouseX - dragging.startMouse.x;
    const dy = mouseY - dragging.startMouse.y;
    // 김밥 방향 반대로 당긴 거리
    const pullDist = -(dx * DIR_X + dy * DIR_Y);
    dragging.pull = Math.max(0, Math.min(GB.length, dragging.startPull + pullDist));
  }
});

canvas.addEventListener('pointerup', () => {
  if (!dragging) return;
  
  if (dragging.pull > GB.length * 0.75) {
    const idx = toppings.indexOf(dragging);
    if (idx > -1) {
      toppings.splice(idx, 1);
      removed++;
      document.getElementById('removed').textContent = removed;
      document.getElementById('remaining').textContent = toppings.length;
      showMessage(`${dragging.name} 적출!`);
    }
    
    if (dragging.stuck) {
      dragging.stuck.pull = dragging.pull * 0.5;
      dragging.stuck.returning = true;
    }
    
    if (toppings.length === 0) {
      setTimeout(() => {
        showMessage('새 김밥 준비 중... 🍙', 2500);
        setTimeout(initToppings, 2000);
      }, 500);
    }
  } else {
    dragging.returning = true;
    if (dragging.stuck) {
      dragging.stuck.returning = true;
      dragging.stuck.pull = dragging.pull * 0.4;
    }
  }
  dragging = null;
});

canvas.addEventListener('pointerleave', () => {
  if (dragging) {
    dragging.returning = true;
    dragging = null;
  }
});

function showMessage(text, dur = 2000) {
  messageEl.textContent = text;
  messageEl.classList.add('show');
  setTimeout(() => messageEl.classList.remove('show'), dur);
}

window.addEventListener('resize', () => { resize(); initToppings(); });
resize();
initToppings();
render();

document.body.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
</script>

</body>
</html>
