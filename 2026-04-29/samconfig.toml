#   AzureOpenAIEndpoint=$AZURE_OPENAI_ENDPOINT \
#   AzureOpenAIApiKey=$AZURE_OPENAI_API_KEY \
#   AzureOpenAIDeployment=$AZURE_OPENAI_DEPLOYMENT_GPT54 \
#   GeminiApiKey=$GEMINI_API_KEY_GENAI
