# SAM CLI 배포 설정 — x02 계정용
# 배포는 ./deploy.sh 로 (환경변수 자동 주입 + S3 업로드 + CloudFront invalidation 포함)

version = 0.1

[default.deploy.parameters]
stack_name = "ai-debate-arena"
resolve_s3 = true
s3_prefix = "ai-debate-arena"
region = "ap-northeast-2"
confirm_changeset = false
capabilities = "CAPABILITY_IAM"
