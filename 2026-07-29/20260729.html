<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>그날 오후 — 피아노 학원 가기 싫은 날</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Noto+Sans+KR:wght@400;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}

body {
  background:#0a0806;
  font-family:'Noto Serif KR', serif;
  color:#f0ead8;
  width:100vw;
  height:100vh;
  overflow:hidden;
  user-select:none;
}

/* 필름 그레인 오버레이 */
#grain {
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:1000;
  opacity:0.5;
}

/* 비네팅 */
#vignette {
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:999;
  background:radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.7) 100%);
}

/* 스캔라인 — crt-scanlines로 대체됨 */
#scanlines { display:none; }

/* 씬 컨테이너 */
.scene {
  position:absolute;
  inset:0;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:flex-end;
}
.scene.active { display:flex; }

/* 배경 이미지 영역 */
.bg-image {
  position:absolute;
  inset:0;
  overflow:hidden;
}
.bg-image img {
  width:100%;
  height:100%;
  object-fit:cover;
  filter:sepia(0.35) contrast(1.05) brightness(0.88) saturate(0.8);
}
/* 이미지 없을 때 폴백 배경 */
.bg-image .bg-fallback {
  width:100%;
  height:100%;
}

/* 캐릭터 */
.character-layer {
  position:absolute;
  bottom:160px; /* 대화창 위로 */
  left:50%;
  transform:translateX(-50%);
  display:flex;
  flex-direction:column;
  align-items:center;
  z-index:10;
  pointer-events:none;
}
.character-img {
  width:340px; /* 미연시처럼 크게 */
  height:auto;
  filter:drop-shadow(0 12px 40px rgba(0,0,0,0.7));
  transition:filter 0.3s, transform 0.3s;
}

/* 감정 상태 */
.character-img.shake {
  animation:charShake 0.5s ease;
}
@keyframes charShake {
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-6px) rotate(-2deg)}
  40%{transform:translateX(6px) rotate(2deg)}
  60%{transform:translateX(-4px)}
  80%{transform:translateX(4px)}
}

/* 대화창 — 미연시 스타일 */
#dialog-box {
  position:fixed;
  bottom:44px; /* 메뉴바 위 */
  left:0;
  right:0;
  z-index:200;
  padding:0 0 0;
  pointer-events:all;
  cursor:pointer;
}
.dialog-inner {
  background:rgba(20,10,40,0.82);
  border-top:1px solid rgba(200,180,255,0.18);
  padding:0;
  position:relative;
  box-shadow:0 -8px 60px rgba(0,0,0,0.6);
  min-height:130px;
}
.dialog-name-tag {
  display:inline-block;
  background:rgba(40,20,80,0.95);
  border:1px solid rgba(200,180,255,0.25);
  border-bottom:none;
  padding:5px 20px 4px;
  font-size:0.85rem;
  font-weight:700;
  color:#d8c8ff;
  letter-spacing:0.12em;
  font-family:'Noto Sans KR', sans-serif;
  position:relative;
  top:0;
  left:32px;
  margin-bottom:-1px;
  border-radius:3px 3px 0 0;
}
.dialog-name-tag:empty { display:none; }
.dialog-body {
  padding:18px 40px 22px;
}
.dialog-text {
  font-size:1.05rem;
  line-height:1.9;
  color:#f0ead8;
  min-height:3em;
  font-family:'Noto Serif KR', serif;
}
.dialog-cursor {
  display:inline-block;
  width:0;
  height:0;
  border-left:7px solid transparent;
  border-right:7px solid transparent;
  border-top:9px solid rgba(200,180,255,0.7);
  vertical-align:middle;
  margin-left:4px;
  animation:blink 0.8s step-end infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
.dialog-next { display:none; } /* 클릭 전체로 처리 */

/* 하단 메뉴바 */
#menubar {
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:44px;
  background:rgba(10,5,20,0.92);
  border-top:1px solid rgba(200,180,255,0.1);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:32px;
  z-index:300;
}
.menu-btn {
  font-size:0.6rem;
  color:rgba(200,180,255,0.35);
  letter-spacing:0.18em;
  cursor:pointer;
  font-family:'Noto Sans KR', sans-serif;
  transition:color 0.15s;
  background:none;
  border:none;
  padding:0;
}
.menu-btn:hover { color:rgba(200,180,255,0.8); }

/* 클릭 힌트 (화면의 오브젝트) */
.clickable {
  position:absolute;
  cursor:pointer;
  z-index:20;
  transition:filter 0.2s, transform 0.2s;
}
.clickable:hover {
  filter:brightness(1.3) drop-shadow(0 0 12px rgba(255,220,100,0.6));
  transform:scale(1.05);
}
.clickable-label {
  position:absolute;
  bottom:calc(100% + 6px);
  left:50%;
  transform:translateX(-50%);
  background:rgba(8,6,4,0.9);
  border:1px solid rgba(240,234,216,0.3);
  padding:3px 10px;
  font-size:0.65rem;
  white-space:nowrap;
  color:#c8a87a;
  letter-spacing:0.08em;
  border-radius:2px;
  opacity:0;
  transition:opacity 0.15s;
  pointer-events:none;
  font-family:'Noto Sans KR', sans-serif;
}
.clickable:hover .clickable-label { opacity:1; }

/* 선택지 */
#choices {
  position:fixed;
  bottom:240px; /* 대화창+메뉴바 위 */
  left:50%;
  transform:translateX(-50%);
  z-index:300;
  display:none;
  flex-direction:column;
  gap:8px;
  min-width:240px;
}
.choice-btn {
  background:rgba(8,6,4,0.95);
  border:1px solid rgba(240,234,216,0.3);
  color:#f0ead8;
  padding:12px 24px;
  font-size:0.9rem;
  font-family:'Noto Serif KR', serif;
  cursor:pointer;
  text-align:left;
  letter-spacing:0.03em;
  transition:all 0.15s;
  border-radius:2px;
  position:relative;
  overflow:hidden;
}
.choice-btn::before {
  content:'▶';
  margin-right:8px;
  opacity:0;
  transition:opacity 0.15s;
  font-size:0.6rem;
  color:#c8a87a;
}
.choice-btn:hover {
  background:rgba(200,168,122,0.15);
  border-color:rgba(200,168,122,0.6);
  padding-left:30px;
}
.choice-btn:hover::before { opacity:1; }

/* 타이틀 화면 */
#scene-title {
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:#0d0a0e;
  cursor:pointer;
  z-index:50;
  overflow:hidden;
}
/* 타이틀 배경 이미지 */
#scene-title .title-bg {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center bottom;
  filter:brightness(0.55) saturate(0.8);
  z-index:0;
}
/* 배경 위 어두운 그라데이션 — 하단(텍스트 영역) 강조 */
#scene-title::after {
  content:'';
  position:absolute;
  inset:0;
  background:
    radial-gradient(ellipse 80% 60% at 50% 50%, transparent 30%, rgba(13,10,14,0.55) 100%),
    linear-gradient(to bottom, rgba(13,10,14,0.3) 0%, transparent 40%, rgba(13,10,14,0.7) 100%);
  z-index:1;
  pointer-events:none;
}
.title-logo {
  opacity:0;
  text-align:center;
  transition:opacity 1.4s ease;
  position:relative;
  z-index:3;
}
.title-logo.show { opacity:1; }
.title-eyecatch {
  font-size:0.55rem;
  color:rgba(180,150,220,0.45);
  letter-spacing:0.55em;
  margin-bottom:24px;
  font-family:'Noto Sans KR', sans-serif;
}
.title-wrapper { position:relative; display:inline-block; }
.title-main {
  font-size:clamp(2.8rem, 8vw, 5rem);
  font-weight:900;
  letter-spacing:0.1em;
  color:#e8ddf8;
  line-height:1;
  margin-bottom:6px;
  text-shadow:
    2px 2px 0 rgba(120,80,200,0.55),
    4px 4px 0 rgba(80,40,160,0.28),
    0 0 50px rgba(180,140,255,0.2);
  font-family:'Noto Serif KR', serif;
}
.title-main-ghost {
  position:absolute;
  top:0; left:3px;
  font-size:clamp(2.8rem, 8vw, 5rem);
  font-weight:900;
  letter-spacing:0.1em;
  color:rgba(255,80,80,0.12);
  line-height:1;
  pointer-events:none;
  font-family:'Noto Serif KR', serif;
}
.title-deco {
  display:flex;
  align-items:center;
  gap:10px;
  margin:14px 0 10px;
  opacity:0.35;
}
.title-deco-line { width:50px; height:1px; background:rgba(180,150,220,0.7); }
.title-deco-diamond {
  width:5px; height:5px;
  background:rgba(200,170,255,0.8);
  transform:rotate(45deg);
}
.title-sub {
  font-size:0.68rem;
  color:rgba(180,150,220,0.5);
  letter-spacing:0.3em;
  font-family:'Noto Sans KR', sans-serif;
}
.title-press {
  margin-top:50px;
  font-size:0.6rem;
  color:rgba(220,200,255,0.0);
  letter-spacing:0.3em;
  font-family:'Noto Sans KR', sans-serif;
  transition:color 0.8s;
}
.title-press.show {
  color:rgba(220,200,255,0.42);
  animation:blink 1.4s ease-in-out infinite;
}
.title-year {
  position:absolute;
  bottom:22px;
  font-size:0.52rem;
  color:rgba(180,150,220,0.25);
  letter-spacing:0.2em;
  font-family:'Noto Sans KR', sans-serif;
  z-index:3;
}

/* ── CRT 효과 ── */
#crt-scanlines {
  position:fixed; inset:0;
  pointer-events:none; z-index:1001;
  background:repeating-linear-gradient(
    to bottom,
    transparent 0px, transparent 3px,
    rgba(0,0,0,0.15) 3px, rgba(0,0,0,0.15) 4px
  );
}
#crt-bend {
  position:fixed; inset:0;
  pointer-events:none; z-index:1002;
  background:radial-gradient(ellipse 110% 110% at 50% 50%, transparent 55%, rgba(0,0,0,0.65) 100%);
}
#crt-glitch { position:fixed; inset:0; pointer-events:none; z-index:1003; opacity:0; }

/* 오프닝 텍스트 */
#opening-overlay {
  position:fixed; inset:0; background:#000; z-index:800;
  display:flex; align-items:center; justify-content:center;
  pointer-events:none; opacity:0; transition:opacity 1s ease;
}
#opening-overlay.active { opacity:1; pointer-events:all; }
.opening-text {
  font-size:clamp(0.85rem,2.2vw,1.05rem);
  color:rgba(220,210,240,0.88);
  letter-spacing:0.08em; line-height:2.4; text-align:center;
  font-family:'Noto Serif KR', serif;
  opacity:0; transition:opacity 0.8s ease;
  max-width:560px; padding:0 32px;
}
.opening-text.show { opacity:1; }


/* GAME OVER 화면 */
#scene-gameover {
  background:#0a0806;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  cursor:default;
}
.gameover-label {
  font-size:0.7rem;
  letter-spacing:0.5em;
  color:rgba(200,168,122,0.5);
  margin-bottom:16px;
  font-family:'Noto Sans KR', sans-serif;
}
.gameover-main {
  font-size:clamp(1.8rem,5vw,3rem);
  font-weight:900;
  letter-spacing:0.1em;
  color:#f0ead8;
  margin-bottom:8px;
}
.gameover-ending {
  font-size:1rem;
  color:#c8a87a;
  letter-spacing:0.12em;
  margin-bottom:48px;
  font-style:italic;
}
.retry-btn {
  background:transparent;
  border:1px solid rgba(240,234,216,0.3);
  color:rgba(240,234,216,0.6);
  padding:10px 32px;
  font-size:0.8rem;
  letter-spacing:0.2em;
  cursor:pointer;
  font-family:'Noto Sans KR', sans-serif;
  transition:all 0.2s;
  border-radius:2px;
}
.retry-btn:hover {
  border-color:rgba(200,168,122,0.7);
  color:#c8a87a;
  background:rgba(200,168,122,0.08);
}

/* UFO */
#ufo-element {
  position:absolute;
  z-index:30;
  cursor:pointer;
  transition:transform 0.3s;
}
#ufo-element:hover {
  transform:scale(1.1) translateY(-4px);
  filter:drop-shadow(0 0 20px rgba(120,200,255,0.7));
}

/* UFO SVG */
.ufo-svg { width:120px; height:auto; }

/* 전환 오버레이 */
#transition-overlay {
  position:fixed;
  inset:0;
  background:#0a0806;
  z-index:900;
  opacity:0;
  pointer-events:none;
  transition:opacity 0.5s;
}
#transition-overlay.fade-in { opacity:1; pointer-events:all; }

/* 날짜 스탬프 */
.date-stamp {
  position:fixed;
  top:20px;
  left:20px;
  font-size:0.65rem;
  color:rgba(240,234,216,0.2);
  letter-spacing:0.12em;
  font-family:'Noto Sans KR', sans-serif;
  z-index:500;
}

/* 흑백 노이즈 캔버스 */
#noise-canvas {
  position:fixed;
  inset:0;
  z-index:1000;
  pointer-events:none;
  mix-blend-mode:overlay;
  opacity:0.35;
}

/* 이미지 placeholder 스타일 */
.img-placeholder {
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-size:0.7rem;
  color:rgba(240,234,216,0.2);
  letter-spacing:0.1em;
  font-family:'Noto Sans KR', sans-serif;
}
.img-placeholder .ph-icon { font-size:2rem; margin-bottom:8px; opacity:0.3; }

/* 캐릭터 placeholder */
.char-placeholder {
  width:160px;
  height:220px;
  background:rgba(240,234,216,0.05);
  border:2px dashed rgba(240,234,216,0.1);
  border-radius:4px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-size:0.6rem;
  color:rgba(240,234,216,0.2);
  letter-spacing:0.08em;
  font-family:'Noto Sans KR', sans-serif;
  gap:6px;
}

</style>
</head>
<body>

<canvas id="noise-canvas"></canvas>
<div id="vignette"></div>
<div id="scanlines"></div>
<!-- CRT 효과 레이어 -->
<div id="crt-scanlines"></div>
<div id="crt-bend"></div>
<canvas id="crt-glitch"></canvas>
<div class="date-stamp">1999.06 — 서울</div>

<!-- 전환 오버레이 -->
<div id="transition-overlay"></div>

<!-- 대화창 (공통) -->
<div id="dialog-box" style="display:none;" onclick="nextDialog()">
  <div class="dialog-inner">
    <div class="dialog-name-tag" id="dialog-name"></div>
    <div class="dialog-body">
      <div class="dialog-text" id="dialog-text"><span class="dialog-cursor"></span></div>
    </div>
  </div>
</div>

<!-- 하단 메뉴바 -->
<div id="menubar" style="display:none;">
  <button class="menu-btn" onclick="goToTitle()">TITLE</button>
  <button class="menu-btn" disabled style="cursor:default">SAVE</button>
  <button class="menu-btn" disabled style="cursor:default">LOAD</button>
  <button class="menu-btn" onclick="nextDialog()">SKIP</button>
  <button class="menu-btn" disabled style="cursor:default">AUTO</button>
  <button class="menu-btn" disabled style="cursor:default">LOG</button>
</div>

<!-- 선택지 -->
<div id="choices"></div>

<!-- 오프닝 오버레이 (검은 화면 텍스트) -->
<div id="opening-overlay">
  <div class="opening-text" id="opening-text"></div>
</div>

<!-- ═══════════════════════════════════════════
  씬 1: 타이틀
═══════════════════════════════════════════ -->
<div id="scene-title" class="scene active">
  <img class="title-bg" src="./title_bg.png" alt="">
  <div class="title-logo" id="title-logo">
    <div class="title-eyecatch">V I S U A L &nbsp; N O V E L</div>
    <div class="title-wrapper">
      <div class="title-main-ghost" aria-hidden="true">그날 오후</div>
      <div class="title-main">그날 오후</div>
    </div>
    <div class="title-deco">
      <div class="title-deco-line"></div>
      <div class="title-deco-diamond"></div>
      <div class="title-deco-line"></div>
    </div>
    <div class="title-sub">피아노 학원 가기 싫은 날</div>
    <div class="title-press" id="title-press">─ &nbsp; CLICK TO START &nbsp; ─</div>
  </div>
  <div class="title-year">1999 · EPISODE 1 · © 그날오후제작위원회</div>
</div>

<!-- ═══════════════════════════════════════════
  씬 2: 놀이터
═══════════════════════════════════════════ -->
<div id="scene-playground" class="scene">
  <div class="bg-image" id="bg-playground">
    <img src="./playground.png" alt="놀이터" style="width:100%;height:100%;object-fit:cover;filter:sepia(0.3) contrast(1.05) brightness(0.9) saturate(0.85);">
  </div>

  <!-- 캐릭터 -->
  <div class="character-layer" id="char-playground">
    <img id="char-img" class="character-img" src="./char_normal.png" alt="주인공" style="width:340px;height:auto;filter:drop-shadow(0 12px 40px rgba(0,0,0,0.6));">
  </div>

  <!-- 클릭 오브젝트들 (대화창+메뉴바 높이 ~230px 위로 기준) -->
  <div class="clickable" id="obj-junglegym" style="left:6%; top:20%; width:20%; height:45%;" onclick="clickObject('junglegym')">
    <div class="clickable-label">정글짐</div>
  </div>

  <div class="clickable" id="obj-slide" style="right:6%; top:22%; width:16%; height:42%;" onclick="clickObject('slide')">
    <div class="clickable-label">미끄럼틀</div>
  </div>

  <div class="clickable" id="obj-seesaw" style="left:30%; bottom:240px; width:32%; height:70px;" onclick="clickObject('seesaw')">
    <div class="clickable-label">시소 ▶ 클릭</div>
  </div>

  <div class="clickable" id="obj-sandbox" style="right:24%; bottom:240px; width:14%; height:55px;" onclick="clickObject('sandbox')">
    <div class="clickable-label">모래밭</div>
  </div>
</div>

<!-- ═══════════════════════════════════════════
  씬 3: 하늘
═══════════════════════════════════════════ -->
<div id="scene-sky" class="scene">
  <div class="bg-image" id="bg-sky">
    <img src="./sky.png" alt="하늘" style="width:100%;height:100%;object-fit:cover;filter:sepia(0.2) contrast(1.02) brightness(0.95) saturate(0.9);">
  </div>

  <!-- UFO -->
  <div id="ufo-element" style="right:12%; top:8%; cursor:pointer;" onclick="clickUFO()">
    <img id="ufo-img" src="./ufo.png" alt="UFO" style="width:180px;height:auto;filter:drop-shadow(0 0 18px rgba(127,212,248,0.6));">
  </div>

  <!-- 캐릭터 (누운 모습) -->
  <div class="character-layer" id="char-sky" style="bottom:200px; left:30%; transform:none;">
    <img id="char-lying-img" src="./char_lying.png" alt="주인공 누운 모습" style="width:320px;height:auto;filter:drop-shadow(0 6px 24px rgba(0,0,0,0.5));">
  </div>
</div>

<!-- ═══════════════════════════════════════════
  씬 4: 엘리베이터 앞
═══════════════════════════════════════════ -->
<div id="scene-elevator" class="scene">
  <div class="bg-image" id="bg-elevator">
    <img src="./elevator.png" alt="엘리베이터" style="width:100%;height:100%;object-fit:cover;filter:sepia(0.25) contrast(1.04) brightness(0.85) saturate(0.8);">
  </div>

  <!-- 캐릭터 (서있는 모습) -->
  <div class="character-layer" id="char-elevator" style="bottom:190px; left:28%; transform:none;">
    <img id="char-elevator-img" src="./char_scared.png" alt="주인공" style="width:300px;height:auto;filter:drop-shadow(0 8px 30px rgba(0,0,0,0.7));">
  </div>

  <!-- 엘리베이터 버튼 클릭 오브젝트 -->
  <div class="clickable" id="obj-elevator-btn" style="right:18%; top:38%; width:8%; height:12%;" onclick="clickElevatorBtn()">
    <div class="clickable-label">▲▼ 버튼</div>
  </div>
</div>

<!-- ═══════════════════════════════════════════
  씬 5: 현관문
═══════════════════════════════════════════ -->
<div id="scene-door" class="scene">
  <div class="bg-image" id="bg-door">
    <img src="./door.png" alt="현관문" style="width:100%;height:100%;object-fit:cover;filter:sepia(0.3) contrast(1.05) brightness(0.82) saturate(0.75);">
  </div>

  <!-- 현관문 클릭 오브젝트 -->
  <div class="clickable" id="obj-door" style="left:50%; top:20%; transform:translateX(-50%); width:22%; height:62%;" onclick="clickDoor()">
    <div class="clickable-label">현관문 열기</div>
  </div>
</div>

<!-- ═══════════════════════════════════════════
  씬 6: 게임 오버
═══════════════════════════════════════════ -->
<div id="scene-gameover" class="scene">
  <div class="gameover-label">G A M E  O V E R</div>
  <div class="gameover-main" id="go-title">ENDING 1</div>
  <div class="gameover-ending" id="go-subtitle">어렸을 적 기억.</div>
  <button class="retry-btn" onclick="retryGame()">[ RETRY ]</button>
</div>


<script>
// ═══════════════════════════════════════════
//  게임 상태
// ═══════════════════════════════════════════
const state = {
  currentScene: 'title',
  dialogQueue: [],
  dialogIdx: 0,
  dialogCallback: null,
  endingOneVisited: false,   // 엔딩1 경험 여부
  ufoPhase: 0,               // 0: 아직, 1: UFO 클릭 가능
  seesawClicked: false,
  ufoClicked: false,
};

// ═══════════════════════════════════════════
//  필름 노이즈 효과
// ═══════════════════════════════════════════
const noiseCanvas = document.getElementById('noise-canvas');
const nCtx = noiseCanvas.getContext('2d');

function resizeNoise() {
  noiseCanvas.width = window.innerWidth;
  noiseCanvas.height = window.innerHeight;
}
resizeNoise();
window.addEventListener('resize', resizeNoise);

function drawNoise() {
  const w = noiseCanvas.width;
  const h = noiseCanvas.height;
  const imageData = nCtx.createImageData(w, h);
  const data = imageData.data;
  for (let i = 0; i < data.length; i += 4) {
    const v = Math.random() * 255;
    data[i] = v;
    data[i+1] = v;
    data[i+2] = v;
    data[i+3] = Math.random() * 30;
  }
  nCtx.putImageData(imageData, 0, 0);
  requestAnimationFrame(drawNoise);
}
drawNoise();

// ═══════════════════════════════════════════
//  CRT 글리치 효과
// ═══════════════════════════════════════════
const glitchCanvas = document.getElementById('crt-glitch');
const gCtx = glitchCanvas.getContext('2d');

function resizeGlitch() {
  glitchCanvas.width = window.innerWidth;
  glitchCanvas.height = window.innerHeight;
}
resizeGlitch();
window.addEventListener('resize', resizeGlitch);

// 불규칙 글리치 라인 — 가끔씩 수평 밴드가 어긋남
let glitchTimer = 0;
function runGlitch() {
  const now = Date.now();
  // 3~8초마다 한 번씩 짧게 글리치
  if (now - glitchTimer > (3000 + Math.random() * 5000)) {
    glitchTimer = now;
    doGlitch();
  }
  requestAnimationFrame(runGlitch);
}

function doGlitch() {
  const w = glitchCanvas.width;
  const h = glitchCanvas.height;
  glitchCanvas.style.opacity = '1';
  gCtx.clearRect(0, 0, w, h);

  // 2~5개의 수평 밴드 어긋남
  const bands = 2 + Math.floor(Math.random() * 4);
  for (let i = 0; i < bands; i++) {
    const y = Math.random() * h;
    const bh = 1 + Math.random() * 6;
    const shift = (Math.random() - 0.5) * 20;
    // 희미한 수평 라인
    gCtx.fillStyle = `rgba(${180+Math.random()*75|0},${180+Math.random()*75|0},${200+Math.random()*55|0},${0.06 + Math.random()*0.1})`;
    gCtx.fillRect(0, y, w, bh);
    // 색수차 어긋남
    gCtx.fillStyle = `rgba(255,0,0,0.04)`;
    gCtx.fillRect(shift, y, w, bh);
    gCtx.fillStyle = `rgba(0,200,255,0.04)`;
    gCtx.fillRect(-shift, y, w, bh);
  }

  // 전체 화면 순간 밝기 흔들림
  gCtx.fillStyle = 'rgba(255,255,255,0.015)';
  gCtx.fillRect(0, 0, w, h);

  // 40~120ms 후 사라짐
  setTimeout(() => {
    gCtx.clearRect(0, 0, w, h);
    glitchCanvas.style.opacity = '0';
  }, 40 + Math.random() * 80);
}

runGlitch();


//  캐릭터 표정 교체
// ═══════════════════════════════════════════
const CHAR_IMGS = {
  normal:  './char_normal.png',
  sleepy:  './char_normal.png',   // 기본 이미지 재사용
  shocked: './char_shocked.png',
  scared:  './char_scared.png',
  awkward: './char_awkward.png',
};

function setCharEmotion(imgId, emotion) {
  const el = document.getElementById(imgId);
  if (!el) return;
  const src = CHAR_IMGS[emotion] || CHAR_IMGS.normal;
  if (el.src !== src) el.src = src;
}
let typewriterTimer = null;
let isTyping = false;

function showDialog(name, text, callback) {
  const box = document.getElementById('dialog-box');
  const nameEl = document.getElementById('dialog-name');
  const textEl = document.getElementById('dialog-text');
  box.style.display = 'block';
  nameEl.textContent = name || '';
  textEl.innerHTML = '';
  isTyping = true;
  state.dialogCallback = null;

  if (typewriterTimer) clearInterval(typewriterTimer);
  let i = 0;
  typewriterTimer = setInterval(() => {
    if (i < text.length) {
      textEl.innerHTML = text.slice(0, i+1) + '<span class="dialog-cursor"></span>';
      i++;
    } else {
      textEl.innerHTML = text + '<span class="dialog-cursor"></span>';
      clearInterval(typewriterTimer);
      isTyping = false;
      state.dialogCallback = callback || null;
    }
  }, 45);
}

function nextDialog() {
  if (isTyping) {
    // 타이핑 중이면 즉시 완성
    if (typewriterTimer) clearInterval(typewriterTimer);
    const textEl = document.getElementById('dialog-text');
    const fullText = textEl.textContent.replace(/[▌]/g, '');
    textEl.innerHTML = fullText + '<span class="dialog-cursor"></span>';
    isTyping = false;
    return;
  }
  if (state.dialogCallback) {
    const cb = state.dialogCallback;
    state.dialogCallback = null;
    cb();
  }
}

function hideDialog() {
  document.getElementById('dialog-box').style.display = 'none';
  if (typewriterTimer) clearInterval(typewriterTimer);
  isTyping = false;
  state.dialogCallback = null;
}

function showChoices(options) {
  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = opt.text;
    btn.onclick = () => {
      choicesEl.style.display = 'none';
      opt.action();
    };
    choicesEl.appendChild(btn);
  });
  choicesEl.style.display = 'flex';
  hideDialog();
}

function hideChoices() {
  document.getElementById('choices').style.display = 'none';
}

// ═══════════════════════════════════════════
//  씬 전환
// ═══════════════════════════════════════════
function goToScene(sceneId, callback) {
  const overlay = document.getElementById('transition-overlay');
  overlay.classList.add('fade-in');
  setTimeout(() => {
    document.querySelectorAll('.scene').forEach(s => s.classList.remove('active'));
    document.getElementById(sceneId).classList.add('active');
    state.currentScene = sceneId;
    hideDialog();
    hideChoices();
    // 타이틀·게임오버에선 메뉴바 숨김
    const menubar = document.getElementById('menubar');
    if (menubar) menubar.style.display = (sceneId === 'scene-title' || sceneId === 'scene-gameover') ? 'none' : 'flex';
    setTimeout(() => {
      overlay.classList.remove('fade-in');
      if (callback) callback();
    }, 300);
  }, 500);
}

// ═══════════════════════════════════════════
//  게임 시작
// ═══════════════════════════════════════════
// ═══════════════════════════════════════════
//  타이틀 초기화 & 오프닝
// ═══════════════════════════════════════════

// 타이틀 로고 페이드인
window.addEventListener('load', () => {
  setTimeout(() => {
    document.getElementById('title-logo').classList.add('show');
  }, 600);
  setTimeout(() => {
    document.getElementById('title-press').classList.add('show');
  }, 1800);
  // 타이틀 클릭 리스너 (body 전체로 잡아서 z-index 무관하게)
  document.getElementById('scene-title').addEventListener('click', onTitleClick);
});

let titleReady = false;
function onTitleClick() {
  if (titleReady) return;
  titleReady = true;
  document.getElementById('scene-title').removeEventListener('click', onTitleClick);
  runOpeningSequence();
}

// 오프닝 시퀀스: 검은 화면에 텍스트 몇 줄 → 게임 시작
const OPENING_LINES = [
  '1999년 6월.',
  '피아노 학원 가는 게 세상에서 제일 싫었다.',
  '오늘은 어떻게든 버텨봐야지.',
];

function runOpeningSequence() {
  const overlay = document.getElementById('opening-overlay');
  const textEl = document.getElementById('opening-text');
  overlay.classList.add('active');

  let i = 0;
  function showNext() {
    if (i >= OPENING_LINES.length) {
      // 마지막 줄 잠깐 보여주고 게임 시작
      setTimeout(() => {
        textEl.classList.remove('show');
        setTimeout(() => {
          overlay.classList.remove('active');
          startGame();
        }, 900);
      }, 1400);
      return;
    }
    textEl.classList.remove('show');
    setTimeout(() => {
      textEl.textContent = OPENING_LINES[i];
      textEl.classList.add('show');
      i++;
      setTimeout(showNext, 2000);
    }, 600);
  }
  setTimeout(showNext, 400);
}

function startGame() {
  goToScene('scene-playground', () => {
    setCharEmotion('char-img', 'sleepy');
    setTimeout(() => {
      showDialog('', '오늘도 피아노 학원 가는 날이었다.', () => {
        showDialog('', '학원은 3시 30분. 아직 두 시간이나 남았다.', () => {
          showDialog('주인공', '...놀이터나 가야겠다.', () => {
            showDialog('', '무엇을 할까?', null);
          });
        });
      });
    }, 600);
  });
}

// ═══════════════════════════════════════════
//  오브젝트 클릭 핸들러
// ═══════════════════════════════════════════
function clickObject(id) {
  if (state.currentScene !== 'scene-playground') return;
  hideChoices();

  if (id === 'junglegym') {
    setCharEmotion('char-img', 'normal');
    showDialog('주인공', '정글짐이다. 혼자 놀기엔 너무 높다.', null);
  }
  else if (id === 'slide') {
    setCharEmotion('char-img', 'normal');
    showDialog('주인공', '미끄럼틀. 근데 혼자 타면 어딘가 허전한 거 있잖아.', null);
  }
  else if (id === 'sandbox') {
    setCharEmotion('char-img', 'normal');
    showDialog('주인공', '모래밭. 개미 집이나 있겠지. ...그냥 지나치자.', null);
  }
  else if (id === 'seesaw') {
    if (!state.seesawClicked) {
      state.seesawClicked = true;
      setCharEmotion('char-img', 'sleepy');
      showDialog('주인공', '시소다. 혼자서는 탈 수도 없고.', () => {
        showDialog('주인공', '...근데 그냥 여기 누우면 어떨까.', () => {
          showChoices([
            { text: '누워본다.', action: chooseLieDown },
            { text: '그냥 앉아있는다.', action: chooseSit },
            { text: '집에 간다.', action: chooseGoHome },
          ]);
        });
      });
    } else {
      showDialog('', '이미 누워버렸다...', null);
    }
  }
}

function chooseSit() {
  setCharEmotion('char-img', 'sleepy');
  showDialog('주인공', '앉아있으니 더 졸리다. 그냥 누울까...', () => {
    showChoices([
      { text: '역시 눕는다.', action: chooseLieDown },
      { text: '아니, 버틴다.', action: () => {
        showDialog('주인공', '...3분 뒤 나는 누워있었다.', chooseLieDown);
      }},
    ]);
  });
}

function chooseGoHome() {
  showDialog('주인공', '집에 가서 뭐 해. 피아노 연습해야 한다고 엄마가 기다리잖아.', () => {
    showChoices([
      { text: '역시 시소에 눕는다.', action: chooseLieDown },
    ]);
  });
}

function chooseLieDown() {
  hideChoices();
  setCharEmotion('char-img', 'sleepy');
  showDialog('주인공', '...시소 판자가 생각보다 따뜻했다.', () => {
    showDialog('주인공', '하늘이 참 파랗다.', () => {
      goToScene('scene-sky', () => {
        
        setTimeout(() => {
          showDialog('', '시소에 누워서 하늘을 봤다.', () => {
            showDialog('주인공', '아파트 위로 구름이 흘러가고 있었다.', () => {
              showDialog('주인공', '피아노 학원... 빠지면 안 되는데.', () => {
                showDialog('', '그때였다.', () => {
                  // UFO 등장 강조
                  const ufoEl = document.getElementById('ufo-element');
                  ufoEl.style.animation = 'none';
                  ufoEl.style.filter = 'drop-shadow(0 0 30px rgba(127,212,248,0.9))';
                  state.ufoPhase = 1;
                  showDialog('', '저... 저게 뭐지?', () => {
                    showDialog('주인공', '...UFO다!!', () => {
                      setCharEmotion('char-lying-img', 'shocked');
                      
                      document.getElementById('char-lying-img').style.filter = 'drop-shadow(0 0 8px rgba(255,200,100,0.4))';
                      showDialog('', 'UFO를 클릭해보세요.', null);
                    });
                  });
                });
              });
            });
          });
        }, 600);
      });
    });
  });
}

function clickUFO() {
  if (state.ufoPhase !== 1) return;
  state.ufoPhase = 2;
  state.ufoClicked = true;

  // 엔딩 분기: 엔딩1을 이미 봤으면 엔딩2 (UFO→비행기)
  if (state.endingOneVisited) {
    // 엔딩2: UFO가 비행기로 바뀜
    ufoToBiplane();
  } else {
    // 엔딩1: UFO가 아파트 뒤로 사라짐
    ufoDisappear();
  }
}

function ufoDisappear() {
  const ufoEl = document.getElementById('ufo-element');
  hideDialog();
  // UFO가 아파트 뒤로 날아감
  ufoEl.style.transition = 'all 1.8s cubic-bezier(0.4, 0, 0.2, 1)';
  ufoEl.style.transform = 'translate(30vw, 20vh) scale(0.3)';
  ufoEl.style.opacity = '0';

  setCharEmotion('char-lying-img', 'shocked');
  

  showDialog('주인공', '아파트 뒤로... 사라졌어.', () => {
    showDialog('주인공', '나만 본 거야? 아무도 없는데.', () => {
      showDialog('주인공', '...집에 가야겠다.', () => {
        // 엘리베이터 씬으로
        goToScene('scene-elevator', () => {
          setCharEmotion('char-elevator-img', 'scared');
          setTimeout(() => {
            showDialog('', '우리 집은 5층이었다.', () => {
              showDialog('나레이션', '엘리베이터를 누르면 외계인이 날 기다리다 잡아갈 것 같았다.', () => {
                showDialog('나레이션', '계단으로 가도 외계인이 날 기다릴 것만 같았다.', () => {
                  showDialog('나레이션', '어른이 올 때까지 기다렸다 엘리베이터를 타고 5층에 내렸다.', () => {
                    goToScene('scene-door', () => {
                      setTimeout(() => {
                        showDialog('', '502호. 우리 집이다.', () => {
                          showDialog('나레이션', '근데 막상 문 앞에 서니까...', () => {
                            hideDialog();
                            // 문 클릭 안내
                            document.getElementById('obj-door').querySelector('.clickable-label').textContent = '현관문 열기 ▶';
                          });
                        });
                      }, 500);
                    });
                  });
                });
              });
            });
          }, 600);
        });
      });
    });
  });
}

function clickElevatorBtn() {
  // 엘리베이터 버튼은 클릭 안 해도 됨 (자동 진행)
}

function clickDoor() {
  if (state.currentScene !== 'scene-door') return;
  showDialog('주인공', '우리 집에 이미 외계인이 들어와있으면 어떡하지?', () => {
    showDialog('', '...', () => {
      showDialog('', '...문을 열지 못하고 5분을 서 있었다.', () => {
        state.endingOneVisited = true;
        goToGameOver(1);
      });
    });
  });
}

function ufoToBiplane() {
  const ufoEl = document.getElementById('ufo-element');
  hideDialog();

  // 페이드 아웃 후 비행기로 교체
  ufoEl.style.transition = 'opacity 0.8s';
  ufoEl.style.opacity = '0';

  setTimeout(() => {
    // SVG를 비행기로 교체
    ufoEl.innerHTML = `
    <svg width="120" height="60" viewBox="0 0 160 60" xmlns="http://www.w3.org/2000/svg">
      <!-- 비행기 몸통 -->
      <ellipse cx="80" cy="32" rx="55" ry="10" fill="#d4c8a8"/>
      <!-- 기수 -->
      <path d="M135,32 Q155,32 155,32 L135,24 Z" fill="#c0b498"/>
      <!-- 날개 -->
      <path d="M75,32 L40,15 L60,32 Z" fill="#b8ac90"/>
      <path d="M75,32 L40,49 L60,32 Z" fill="#a8a080"/>
      <!-- 수직 꼬리날개 -->
      <path d="M30,32 L25,18 L38,32 Z" fill="#c0b498"/>
      <!-- 수평 꼬리날개 -->
      <path d="M30,32 L10,26 L30,32 Z" fill="#b8ac90"/>
      <path d="M30,32 L10,38 L30,32 Z" fill="#a8a080"/>
      <!-- 창문 -->
      <circle cx="95" cy="29" r="5" fill="rgba(180,220,255,0.6)"/>
      <circle cx="108" cy="29" r="5" fill="rgba(180,220,255,0.6)"/>
      <!-- 연기 -->
      <circle cx="148" cy="30" r="6" fill="rgba(220,220,220,0.5)"/>
      <circle cx="155" cy="28" r="4" fill="rgba(220,220,220,0.4)"/>
    </svg>`;

    ufoEl.style.opacity = '0';
    ufoEl.style.transition = 'opacity 0.8s, transform 2.5s ease-in-out';
    setTimeout(() => {
      ufoEl.style.opacity = '1';
    }, 100);

    setCharEmotion('char-lying-img', 'awkward');
    

    showDialog('주인공', '...아.', () => {
      showDialog('주인공', '비행기였네.', () => {
        showDialog('주인공', '멋쩍다...', () => {
          // 비행기가 날아가며
          ufoEl.style.transform = 'translate(-60vw, -5vh) scale(0.6)';
          setTimeout(() => {
            goToGameOver(2);
          }, 2000);
        });
      });
    });
  }, 800);
}

function goToGameOver(ending) {
  goToScene('scene-gameover', () => {
    if (ending === 1) {
      document.getElementById('go-title').textContent = 'ENDING 1';
      document.getElementById('go-subtitle').textContent = '어렸을 적 기억.';
    } else {
      document.getElementById('go-title').textContent = 'ENDING 2';
      document.getElementById('go-subtitle').textContent = '이곳엔 공항이 없어.';
    }
  });
}

function goToTitle() {
  titleReady = false;
  goToScene('scene-title', () => {
    document.getElementById('title-logo').classList.add('show');
    document.getElementById('title-press').classList.add('show');
    document.getElementById('scene-title').addEventListener('click', onTitleClick);
  });
}

function retryGame() {
  // 상태 리셋
  const wasEnding1 = state.endingOneVisited;
  Object.assign(state, {
    currentScene: 'title',
    dialogQueue: [],
    dialogIdx: 0,
    dialogCallback: null,
    ufoPhase: 0,
    seesawClicked: false,
    ufoClicked: false,
    endingOneVisited: wasEnding1, // 엔딩1 경험 여부는 유지
  });
  // UFO 원위치 (img src 복원)
  const ufoEl = document.getElementById('ufo-element');
  ufoEl.style.transition = 'none';
  ufoEl.style.transform = '';
  ufoEl.style.opacity = '1';
  ufoEl.style.filter = '';
  ufoEl.innerHTML = '<img id="ufo-img" src="./ufo.png" alt="UFO" style="width:180px;height:auto;filter:drop-shadow(0 0 18px rgba(127,212,248,0.6));">';

  goToScene('scene-playground', () => {
    setCharEmotion('char-img', 'sleepy');
    setTimeout(() => {
      showDialog('', '다시, 그날 오후.', () => {
        showDialog('', '무엇을 할까?', null);
        state.seesawClicked = false;
      });
    }, 600);  });
}

// 키보드 입력 (엔터/스페이스로 다음)
window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'Enter') {
    e.preventDefault();
    nextDialog();
  }
});

// 창 리사이즈 — 이미지 배경은 CSS object-fit으로 처리되므로 별도 작업 불필요
window.addEventListener('resize', resizeNoise);

</script>
</body>
