<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>5/8 — 손글씨 타이핑</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1a1a;font-family:'Helvetica Neue',sans-serif;color:#eee}
.wrap{display:flex;width:100%;height:100%}
.panel{width:240px;min-width:240px;padding:16px 14px;overflow-y:auto;background:#111;border-right:1px solid #333;display:flex;flex-direction:column;gap:14px}
.panel h3{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#888;margin-bottom:4px}
.panel label{font-size:11px;color:#aaa;display:block;margin-bottom:3px}
.panel select,.panel input[type=range]{width:100%;font-size:11px}
.panel input[type=range]{accent-color:#fff}
.panel .val{font-size:10px;color:#666;margin-top:2px}
.panel .group{display:flex;flex-direction:column;gap:4px}
.panel .row{display:flex;align-items:center;gap:8px}
.panel .row label{margin:0;white-space:nowrap}
.panel input[type=color]{width:28px;height:22px;border:1px solid #444;background:none;cursor:pointer}
.panel button{font-size:11px;padding:6px 10px;background:#333;color:#ccc;border:1px solid #555;border-radius:3px;cursor:pointer}
.panel button:hover{background:#444;color:#fff}
.canvas-area{flex:1;position:relative;overflow:hidden;cursor:none}
#style1-view{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#fff;cursor:none}
#style1-view canvas{display:block;cursor:none}
#style2-view{position:absolute;inset:0;background:#fff;padding:24px;cursor:none;display:none;overflow:hidden}
#style2-view .typing-area{position:relative;width:100%;height:100%;filter:url(#roughEdge)}
#style2-view .L{
  display:inline-block;font-weight:900;color:transparent;
  -webkit-text-stroke:1.4px rgba(0,0,0,.85);
  background:radial-gradient(circle 1px at center, rgba(0,0,0,.8) 0.6px, transparent 0.6px);
  background-size:3.8px 3.8px;
  -webkit-background-clip:text;background-clip:text;
  line-height:1.3;white-space:pre;vertical-align:top;
}
#style2-view .cursor-blink{display:none}
#style3-view{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#fff;cursor:none}
#style3-view canvas{cursor:none}
.style-tabs{display:flex;gap:0;margin-bottom:8px}
.style-tabs button{flex:1;font-size:10px;padding:5px 0;border:1px solid #444;background:#222;color:#888;cursor:pointer}
.style-tabs button.active{background:#444;color:#fff;border-color:#666}
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <div class="style-tabs">
      <button id="tab1" class="active">1 — 선</button>
      <button id="tab2">2 — 외곽점</button>
      <button id="tab3">3 — 폰트선</button>
    </div>

    <h3>공통</h3>
    <!-- 폰트 (공통) -->
    <div class="group">
      <label>폰트</label>
      <button id="btn-load-fonts-global" style="font-size:10px;padding:3px 8px;margin-bottom:4px">로컬 폰트 불러오기</button>
      <select id="p-font-global" style="width:100%;font-size:11px;display:none"></select>
      <div class="val" id="v-font-status">미로드</div>
    </div>
    <!-- 반전 -->
    <div class="row">
      <button id="btn-invert" style="font-size:10px;padding:4px 10px;width:100%">⬛ / ⬜ 반전</button>
    </div>
    <!-- 글자 크기 -->
    <div class="group">
      <label>글자 크기</label>
      <input type="range" id="p-scale" min="20" max="200" value="44" step="2">
      <div class="val" id="v-scale">44</div>
    </div>
    <!-- 굵기 -->
    <div class="group">
      <label>굵기</label>
      <input type="range" id="p-thick" min="1" max="5" value="1" step="1">
      <div class="val" id="v-thick">1</div>
    </div>
    <!-- 끊김 -->
    <div class="group">
      <label>끊김</label>
      <input type="range" id="p-break" min="0" max="30" value="2" step="1">
      <div class="val" id="v-break">2%</div>
    </div>
    <!-- 떨림 -->
    <div class="group">
      <label>떨림</label>
      <input type="range" id="p-jitter" min="0" max="5" value="1" step="1">
      <div class="val" id="v-jitter">1</div>
    </div>
    <!-- 흔들림 -->
    <div class="row" style="margin-top:4px">
      <label style="font-size:11px;color:#aaa;cursor:pointer"><input type="checkbox" id="p-shake" checked> 흔들림 애니메이션</label>
    </div>
    <div class="group" id="shake-params" style="margin-top:4px">
      <label>흔들림 강도</label>
      <input type="range" id="p-shake-amt" min="0.1" max="1" value="0.4" step="0.05">
      <div class="val" id="v-shake-amt">0.4</div>
    </div>

    <!-- 스타일2 고유 파라미터 -->
    <div id="s2-params" style="display:none">
      <div class="group">
        <label>외곽선 굵기</label>
        <input type="range" id="p2-stroke" min="0.5" max="4" value="1.4" step="0.1">
        <div class="val" id="v2-stroke">1.4</div>
      </div>
      <div class="group">
        <label>점 간격</label>
        <input type="range" id="p2-dotgap" min="2" max="8" value="3.8" step="0.2">
        <div class="val" id="v2-dotgap">3.8</div>
      </div>
      <div class="group">
        <label>점 크기</label>
        <input type="range" id="p2-dotsize" min="0.3" max="2" value="0.6" step="0.1">
        <div class="val" id="v2-dotsize">0.6</div>
      </div>
      <div class="group">
        <label>거친 정도</label>
        <input type="range" id="p2-rough" min="0" max="15" value="6" step="1">
        <div class="val" id="v2-rough">6</div>
      </div>
    </div>

    <button id="btn-clear">지우기</button>
    <button id="btn-export">SVG 내보내기</button>
    <button id="btn-export-anim">움직이는 SVG</button>
  </div>

  <div class="canvas-area">
    <div id="style1-view"><canvas id="c"></canvas></div>
    <div id="style2-view">
      <svg style="position:absolute;width:0;height:0"><defs>
        <filter id="roughEdge">
          <feTurbulence type="turbulence" baseFrequency="0.04" numOctaves="3" seed="2" result="noise">
            <animate attributeName="seed" values="1;5;3;8;2;6;4;7;1" dur="4s" repeatCount="indefinite"/>
          </feTurbulence>
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G" id="dispMap"/>
        </filter>
      </defs></svg>
      <div class="typing-area" id="typing-area"><span class="cursor-blink" id="s2-cursor"></span></div>
    </div>
    <div id="style3-view"><canvas id="c3" style="cursor:none"></canvas></div>
  </div>
</div>

const VERTICAL_JUNG=[0,1,2,3,4,5,6,7,20],HORIZONTAL_JUNG=[8,12,13,17,18];
const COMPLEX_JUNG=[9,10,11,14,15,16,19];
function isVV(i){return VERTICAL_JUNG.includes(i)}
function isHV(i){return HORIZONTAL_JUNG.includes(i)}
function isCX(i){return COMPLEX_JUNG.includes(i)}
function decompose(ch){const c=ch.charCodeAt(0);if(c<0xAC00||c>0xD7A3)return null;const o=c-0xAC00;return{cho:Math.floor(o/(21*28)),jung:Math.floor((o%(21*28))/28),jong:o%28};}

// ===== 레이아웃 함수 (절대 변경 금지) =====
function getLayout(jung,hasJ){
  const v=isVV(jung),h=isHV(jung),cx=isCX(jung);let cb,jb,jgb;
  if(cx){
    if(hasJ){cb={x:0.00,y:0.00,w:0.50,h:0.35};jb={x:0.00,y:0.25,w:1.00,h:0.50};jgb={x:0.10,y:0.77,w:0.80,h:0.23};}
    else{cb={x:0.00,y:0.00,w:0.50,h:0.40};jb={x:0.00,y:0.30,w:1.00,h:0.70};}
  }else if(v){if(hasJ){cb={x:0,y:0,w:.55,h:.55};jb={x:.58,y:0,w:.42,h:.55};jgb={x:.05,y:.6,w:.9,h:.4};}else{cb={x:0,y:.05,w:.55,h:.9};jb={x:.58,y:.05,w:.42,h:.9};}}
  else if(h){if(hasJ){cb={x:.15,y:0,w:.7,h:.4};jb={x:.0,y:.42,w:1,h:.3};jgb={x:.15,y:.73,w:.7,h:.27};}else{cb={x:.15,y:0,w:.7,h:.45};jb={x:.0,y:.47,w:1,h:.5};}}
  else{if(hasJ){cb={x:.1,y:0,w:.8,h:.4};jb={x:0,y:.38,w:1,h:.3};jgb={x:.1,y:.7,w:.8,h:.3};}else{cb={x:.1,y:0,w:.8,h:.5};jb={x:0,y:.45,w:1,h:.5};}}
  return{cb,jb,jgb};
}

// ===== 스타일1 렌더링 함수 (절대 변경 금지) =====
function rand(n){return(Math.random()*2-1)*n}

function plotLine(x0,y0,x1,y1){
  x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);
  const dx=Math.abs(x1-x0),sx=x0<x1?1:-1,dy=-Math.abs(y1-y0),sy=y0<y1?1:-1;
  let err=dx+dy,safety=0;
  while(safety++<5000){
    if(thick===1)ctx.fillRect(x0,y0,1,1);else ctx.fillRect(x0-Math.floor(thick/2),y0-Math.floor(thick/2),thick,thick);
    if(x0===x1&&y0===y1)break;const e2=2*err;if(e2>=dy){err+=dy;x0+=sx;}if(e2<=dx){err+=dx;y0+=sy;}
  }
}

function buildSegs(stroke,ox,oy,w,h){
  if(stroke.length<2){if(stroke.length===1)return[[[ox+stroke[0][0]*w+rand(jitter),oy+stroke[0][1]*h+rand(jitter)]]];return[];}
  const abs=stroke.map(p=>[ox+p[0]*w,oy+p[1]*h]);const dense=[abs[0].slice()];
  for(let i=0;i<abs.length-1;i++){const dx=abs[i+1][0]-abs[i][0],dy=abs[i+1][1]-abs[i][1],L=Math.sqrt(dx*dx+dy*dy),step=4+Math.random()*3,n=Math.max(1,Math.ceil(L/step));for(let k=1;k<=n;k++){const t=k/n;dense.push([abs[i][0]+dx*t+rand(jitter),abs[i][1]+dy*t+rand(jitter)]);}}
  if(breakFreq===0)return[dense];
  const segs=[];let cur=[dense[0]],bu=0;const mb=Math.max(1,Math.floor(dense.length/10));
  for(let i=1;i<dense.length;i++){if(i>2&&i<dense.length-2&&bu<mb&&Math.random()*100<breakFreq){segs.push(cur);bu++;const dx=dense[i][0]-dense[i-1][0],dy=dense[i][1]-dense[i-1][1],L=Math.sqrt(dx*dx+dy*dy)||1,sk=1+Math.random()*1.5;cur=[[dense[i][0]+(dx/L)*sk,dense[i][1]+(dy/L)*sk]];}else cur.push(dense[i]);}
  if(cur.length)segs.push(cur);return segs;
}

function renderSegs(segs){
  ctx.fillStyle=fg();
  segs.forEach(seg=>{if(seg.length===1){const p=seg[0];if(thick===1)ctx.fillRect(Math.round(p[0]),Math.round(p[1]),1,1);else ctx.fillRect(Math.round(p[0]-thick/2),Math.round(p[1]-thick/2),thick,thick);}else{for(let i=0;i<seg.length-1;i++)plotLine(seg[i][0],seg[i][1],seg[i+1][0],seg[i+1][1]);}});
}

function animSegs(segs){
  const tp=segs.reduce((a,s)=>a+s.length,0);
  strokeQueue.push({segs,si:0,pi:0,tp,dp:0,start:performance.now(),dur:Math.max(80,Math.min(250,tp*4))});
  if(!rafId)rafId=requestAnimationFrame(tick);
}

function tick(now){
  if(!strokeQueue.length){rafId=null;return;}
  const j=strokeQueue[0],el=now-j.start,tgt=Math.min(j.tp,Math.floor((el/j.dur)*j.tp));
  ctx.fillStyle=fg();
  while(j.dp<tgt&&j.si<j.segs.length){const seg=j.segs[j.si];if(j.pi===0){const p=seg[0];if(thick===1)ctx.fillRect(Math.round(p[0]),Math.round(p[1]),1,1);else ctx.fillRect(Math.round(p[0]-thick/2),Math.round(p[1]-thick/2),thick,thick);j.pi=1;j.dp++;}else if(j.pi<seg.length){plotLine(seg[j.pi-1][0],seg[j.pi-1][1],seg[j.pi][0],seg[j.pi][1]);j.pi++;j.dp++;}else{j.si++;j.pi=0;}}
  if(j.dp>=j.tp)strokeQueue.shift();
  rafId=requestAnimationFrame(tick);
}

// ===== 스타일1 한글 렌더링 =====
function s1drawHangul(ch,sx,sy,w,h,anim){
  const d=decompose(ch);if(!d)return false;
  const cs=JAMO[CHOSEONG[d.cho]],js=JAMO[JUNGSEONG[d.jung]],jgs=d.jong>0?(JAMO[JONGSEONG[d.jong]]||null):null;
  if(!cs||!js)return false;
  const{cb,jb,jgb}=getLayout(d.jung,!!jgs);
  function dj(strokes,box){strokes.forEach(s=>{const m=s.map(p=>[box.x+p[0]*box.w,box.y+p[1]*box.h]);const sg=buildSegs(m,sx,sy,w,h);if(anim)animSegs(sg);else renderSegs(sg);});}
  dj(cs,cb);dj(js,jb);if(jgs&&jgb)dj(jgs,jgb);return true;
}

function s3plotLine(x0,y0,x1,y1){
  x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);
  const dx=Math.abs(x1-x0),sx=x0<x1?1:-1,dy=-Math.abs(y1-y0),sy=y0<y1?1:-1;
  let err=dx+dy,safety=0;
  while(safety++<5000){
    if(thick===1)ctx3.fillRect(x0,y0,1,1);else ctx3.fillRect(x0-Math.floor(thick/2),y0-Math.floor(thick/2),thick,thick);
    if(x0===x1&&y0===y1)break;const e2=2*err;if(e2>=dy){err+=dy;x0+=sx;}if(e2<=dx){err+=dx;y0+=sy;}
  }
}

function s3buildSegs(points){
  if(points.length<2){if(points.length===1)return[[[points[0][0]+rand(jitter),points[0][1]+rand(jitter)]]];return[];}
  const dense=[points[0].slice()];
  for(let i=0;i<points.length-1;i++){
    const dx=points[i+1][0]-points[i][0],dy=points[i+1][1]-points[i][1];
    const L=Math.sqrt(dx*dx+dy*dy);
    const step=3+Math.random()*2;
    const n=Math.max(1,Math.ceil(L/step));
    for(let k=1;k<=n;k++){const t=k/n;dense.push([points[i][0]+dx*t+rand(jitter),points[i][1]+dy*t+rand(jitter)]);}
  }
  if(breakFreq===0)return[dense];
  const segs=[];let cur=[dense[0]],bu=0;const mb=Math.max(1,Math.floor(dense.length/10));
  for(let i=1;i<dense.length;i++){
    if(i>2&&i<dense.length-2&&bu<mb&&Math.random()*100<breakFreq){segs.push(cur);bu++;const dx=dense[i][0]-dense[i-1][0],dy=dense[i][1]-dense[i-1][1],L=Math.sqrt(dx*dx+dy*dy)||1,sk=1+Math.random()*1.5;cur=[[dense[i][0]+(dx/L)*sk,dense[i][1]+(dy/L)*sk]];}
    else cur.push(dense[i]);
  }
  if(cur.length)segs.push(cur);return segs;
}

function s3renderSegs(segs){
  ctx3.fillStyle=fg();
  segs.forEach(seg=>{
    if(seg.length===1){const p=seg[0];if(thick===1)ctx3.fillRect(Math.round(p[0]),Math.round(p[1]),1,1);else ctx3.fillRect(Math.round(p[0]-thick/2),Math.round(p[1]-thick/2),thick,thick);}
    else{for(let i=0;i<seg.length-1;i++)s3plotLine(seg[i][0],seg[i][1],seg[i+1][0],seg[i+1][1]);}
  });
}

// opentype path → 점 배열 (절대 변경 금지)
function pathToStrokes(path){
  const strokes=[];let current=[];
  const cmds=path.commands;
  for(const cmd of cmds){
    if(cmd.type==='M'){if(current.length>1)strokes.push(current);current=[[cmd.x,cmd.y]];}
    else if(cmd.type==='L'){current.push([cmd.x,cmd.y]);}
    else if(cmd.type==='Q'){
      const prev=current[current.length-1]||[0,0];const steps=8;
      for(let i=1;i<=steps;i++){const t=i/steps,mt=1-t;current.push([mt*mt*prev[0]+2*mt*t*cmd.x1+t*t*cmd.x,mt*mt*prev[1]+2*mt*t*cmd.y1+t*t*cmd.y]);}
    }else if(cmd.type==='C'){
      const prev=current[current.length-1]||[0,0];const steps=12;
      for(let i=1;i<=steps;i++){const t=i/steps,t2=t*t,t3=t2*t,mt=1-t,mt2=mt*mt,mt3=mt2*mt;current.push([mt3*prev[0]+3*mt2*t*cmd.x1+3*mt*t2*cmd.x2+t3*cmd.x,mt3*prev[1]+3*mt2*t*cmd.y1+3*mt*t2*cmd.y2+t3*cmd.y]);}
    }else if(cmd.type==='Z'){if(current.length>1&&current[0]){current.push(current[0].slice());strokes.push(current);}current=[];}
  }
  if(current.length>1)strokes.push(current);
  return strokes;
}

// ===== 통합 redraw =====
function redraw(){
  if(drawStyle===1) s1redraw();
  else if(drawStyle===2) s2redraw();
  else s3redrawCanvas();
}

// 스타일1 redraw
function s1redraw(){
  ctx.fillStyle=bg();ctx.fillRect(0,0,W,H);
  cursor={x:24,y:24};
  strokeQueue=[];if(rafId){cancelAnimationFrame(rafId);rafId=null;}
  for(const ch of allChars) s1drawImmediate(ch);
}

// 스타일1 즉시 그리기
function s1drawImmediate(ch){
  if(ch==='__CMP__'&&composingChar) ch=composingChar;
  if(ch==='__CMP__') return;
  if(ch==='\n'){cursor.x=24;cursor.y+=scale+Math.round(scale*.15);return;}
  let st=G[ch]||G[ch.toUpperCase()];const code=ch.charCodeAt(0),isH=code>=0xAC00&&code<=0xD7A3,isK=!!st;
  const w=Math.round(scale*(isK?.6:.85)),h=scale,sp=Math.round(scale*.2);
  if(cursor.x+w>W-24){cursor.x=24;cursor.y+=scale+Math.round(scale*.15);}
  if(cursor.y+h>H-24)return;
  const sx=cursor.x,sy=cursor.y;
  if(isH)s1drawHangul(ch,sx,sy,w,h,false);
  else if(st)st.forEach(s=>{renderSegs(buildSegs(s,sx,sy,w,h));});
  else{const fb=[[[.1,.2],[.9,.2],[.9,.9],[.1,.9],[.1,.2]]];fb.forEach(s=>{renderSegs(buildSegs(s,sx,sy,w,h));});}
  cursor.x+=w+sp;
}

// 스타일1 애니메이션 그리기
function s1drawChar(ch){
  if(ch==='\n'){cursor.x=24;cursor.y+=scale+Math.round(scale*.15);allChars.push(ch);return;}
  let st=G[ch]||G[ch.toUpperCase()];const code=ch.charCodeAt(0),isH=code>=0xAC00&&code<=0xD7A3,isK=!!st;
  const w=Math.round(scale*(isK?.6:.85)),h=scale,sp=Math.round(scale*.2);
  if(cursor.x+w>W-24){cursor.x=24;cursor.y+=scale+Math.round(scale*.15);}
  if(cursor.y+h>H-24)return;
  const sx=cursor.x,sy=cursor.y;
  if(isH)s1drawHangul(ch,sx,sy,w,h,true);
  else if(st)st.forEach(s=>{animSegs(buildSegs(s,sx,sy,w,h));});
  else{const fb=[[[.1,.2],[.9,.2],[.9,.9],[.1,.9],[.1,.2]]];fb.forEach(s=>{animSegs(buildSegs(s,sx,sy,w,h));});}
  cursor.x+=w+sp;allChars.push(ch);
}

// ===== 스타일2 렌더링 =====
function s2redraw(){
  typingArea.innerHTML='';
  typingArea.appendChild(s2Cursor);
  for(const ch of allChars){
    if(ch==='__CMP__') continue;
    if(ch==='\n'){
      const br=document.createElement('br');
      typingArea.insertBefore(br,s2Cursor);
    }else{
      const span=document.createElement('span');
      span.className='L';
      span.textContent=ch;
      span.style.fontSize=scale+'px';
      span.style.fontFamily=s2fontFamily;
      const fgc=s2fg();
      span.style.webkitTextStroke=s2strokeW+'px '+fgc;
      span.style.backgroundImage=`radial-gradient(circle ${s2dotSize}px at center, ${fgc} ${s2dotSize}px, transparent ${s2dotSize}px)`;
      span.style.backgroundSize=s2dotGap+'px '+s2dotGap+'px';
      span.style.webkitBackgroundClip='text';
      span.style.backgroundClip='text';
      typingArea.insertBefore(span,s2Cursor);
    }
  }
}

// ===== 스타일3 렌더링 =====
function s3drawCharAt(ch,ox,oy){
  if(!s3font)return 0;
  const glyph=s3font.charToGlyph(ch);
  if(!glyph||glyph.index===0)return Math.round(scale*0.3);
  const sc=scale/s3font.unitsPerEm;
  const path=glyph.getPath(ox,oy,scale);
  const strokes=pathToStrokes(path);
  strokes.forEach(pts=>{s3renderSegs(s3buildSegs(pts));});
  return Math.round(glyph.advanceWidth*sc);
}

function s3redrawCanvas(){
  ctx3.fillStyle=bg();ctx3.fillRect(0,0,W3,H3);
  if(!s3font){
    ctx3.fillStyle='#999';ctx3.font='14px sans-serif';ctx3.textAlign='center';
    ctx3.fillText('폰트를 먼저 로드하세요 (상단 "로컬 폰트 불러오기" 클릭)',W3/2,H3/2);
    ctx3.textAlign='left';
    return;
  }
  cursor={x:24,y:24+scale};
  for(const ch of allChars){
    if(ch==='__CMP__'&&composingChar){
      const adv=s3drawCharAt(composingChar,cursor.x,cursor.y);
      cursor.x+=adv+Math.round(scale*0.05);
      if(cursor.x>W3-24){cursor.x=24;cursor.y+=scale+Math.round(scale*0.15);}
      continue;
    }
    if(ch==='__CMP__') continue;
    if(ch==='\n'){cursor.x=24;cursor.y+=scale+Math.round(scale*0.15);continue;}
    if(ch===' '){cursor.x+=Math.round(scale*0.3);continue;}
    const adv=s3drawCharAt(ch,cursor.x,cursor.y);
    cursor.x+=adv+Math.round(scale*0.05);
    if(cursor.x>W3-24){cursor.x=24;cursor.y+=scale+Math.round(scale*0.15);}
  }
}

const pShake=document.getElementById('p-shake');

pShake.addEventListener('change',()=>{
  shakeOn=pShake.checked;
  shakeParams.style.display=shakeOn?'flex':'none';
  if(shakeOn){if(drawStyle===1)startShake();if(drawStyle===3)s3startShake();}
  else{stopShake();s3stopShake();}

function startShake(){
  if(shakeRafId)return;
  let lastTime=0;
  const interval=120;
  function shakeLoop(now){
    if(!shakeOn||drawStyle!==1){shakeRafId=null;return;}
    if(now-lastTime<interval){shakeRafId=requestAnimationFrame(shakeLoop);return;}
    lastTime=now;
    ctx.fillStyle=bg();ctx.fillRect(0,0,W,H);
    let cur={x:24,y:24};
    for(let ci=0;ci<allChars.length;ci++){
      let ch=allChars[ci];
      if(ch==='__CMP__')ch=composingChar||'';
      if(!ch)continue;
      if(ch==='\n'){cur.x=24;cur.y+=scale+Math.round(scale*.15);continue;}
      let st=G[ch]||G[ch.toUpperCase()];
      const code=ch.charCodeAt(0),isH=code>=0xAC00&&code<=0xD7A3,isK=!!st;
      const w=Math.round(scale*(isK?.6:.85)),h=scale,sp=Math.round(scale*.2);
      if(cur.x+w>W-24){cur.x=24;cur.y+=scale+Math.round(scale*.15);}
      if(cur.y+h>H-24)continue;
      const ox=cur.x+rand(shakeAmt),oy=cur.y+rand(shakeAmt);
      if(isH){
        const d=decompose(ch);
        if(d){
          const cs=JAMO[CHOSEONG[d.cho]],js=JAMO[JUNGSEONG[d.jung]],jgs=d.jong>0?(JAMO[JONGSEONG[d.jong]]||null):null;
          if(cs&&js){
            const{cb,jb,jgb}=getLayout(d.jung,!!jgs);
            const dj=(strokes,box)=>{strokes.forEach(s=>{const m=s.map(p=>[box.x+p[0]*box.w,box.y+p[1]*box.h]);renderSegs(buildSegs(m,ox,oy,w,h));});};
            dj(cs,cb);dj(js,jb);if(jgs&&jgb)dj(jgs,jgb);
          }
        }
      }else if(st){st.forEach(s=>{renderSegs(buildSegs(s,ox,oy,w,h));});}
      cur.x+=w+sp;
    }
    shakeRafId=requestAnimationFrame(shakeLoop);
  }
  shakeRafId=requestAnimationFrame(shakeLoop);
}
function stopShake(){if(shakeRafId){cancelAnimationFrame(shakeRafId);shakeRafId=null;}if(drawStyle===1)s1redraw();}

function s3startShake(){
  if(s3shakeRafId)return;
  let last=0;
  function loop(now){
    if(!shakeOn||drawStyle!==3){s3shakeRafId=null;return;}
    if(now-last<120){s3shakeRafId=requestAnimationFrame(loop);return;}
    last=now;
    const origJ=jitter;
    jitter=origJ+shakeAmt;
    s3redrawCanvas();
    jitter=origJ;
    s3shakeRafId=requestAnimationFrame(loop);
  }
  s3shakeRafId=requestAnimationFrame(loop);
}
function s3stopShake(){if(s3shakeRafId){cancelAnimationFrame(s3shakeRafId);s3shakeRafId=null;}if(drawStyle===3)s3redrawCanvas();}

function exportSvgStyle1(){
  const paths=[];
  let cur={x:24,y:24};
  for(const ch of allChars){
    if(ch==='__CMP__')continue;
    if(ch==='\n'){cur.x=24;cur.y+=scale+Math.round(scale*.15);continue;}
    let st=G[ch]||G[ch.toUpperCase()];
    const code=ch.charCodeAt(0),isH=code>=0xAC00&&code<=0xD7A3,isK=!!st;
    const w=Math.round(scale*(isK?.6:.85)),h=scale,sp=Math.round(scale*.2);
    if(cur.x+w>W-24){cur.x=24;cur.y+=scale+Math.round(scale*.15);}
    if(cur.y+h>H-24)continue;
    const ox=cur.x,oy=cur.y;
    let charStrokes=[];
    if(isH){
      const d=decompose(ch);
      if(d){
        const cs=JAMO[CHOSEONG[d.cho]],js=JAMO[JUNGSEONG[d.jung]],jgs=d.jong>0?(JAMO[JONGSEONG[d.jong]]||null):null;
        if(cs&&js){
          const{cb,jb,jgb}=getLayout(d.jung,!!jgs);
          const mapJ=(strokes,box)=>strokes.map(s=>s.map(p=>[box.x+p[0]*box.w,box.y+p[1]*box.h]));
          charStrokes=[...mapJ(cs,cb),...mapJ(js,jb)];
          if(jgs&&jgb)charStrokes.push(...mapJ(jgs,jgb));
        }
      }
    }else if(st)charStrokes=st;
    charStrokes.forEach(s=>{
      const segs=buildSegs(s,ox,oy,w,h);
      segs.forEach(seg=>{
        if(seg.length<2)return;
        let d='M'+seg[0][0].toFixed(1)+','+seg[0][1].toFixed(1);
        for(let i=1;i<seg.length;i++)d+=' L'+seg[i][0].toFixed(1)+','+seg[i][1].toFixed(1);
        paths.push(d);
      });
    });
    cur.x+=w+sp;
  }
  const svg=`<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">\n<rect width="${W}" height="${H}" fill="${bg()}"/>\n${paths.map(d=>`<path d="${d}" fill="none" stroke="${fg()}" stroke-width="${thick}" stroke-linecap="round" stroke-linejoin="round"/>`).join('\n')}\n</svg>`;
  downloadSvg(svg,'style1');
}

async function exportSvgStyle2(){
  let otFont=s3font;
  if(!otFont){
    if(!cachedFonts){alert('폰트를 먼저 로드하세요');return;}
    let fontName=s2fontFamily.replace(/"/g,'');
    const match=cachedFonts.find(f=>f.family===fontName);
    if(!match){alert('폰트 "'+fontName+'" 데이터를 가져올 수 없습니다.');return;}
    try{
      const blob=await match.blob();
      const buf=await blob.arrayBuffer();
      otFont=opentype.parse(buf);
    }catch(e){alert('폰트 파싱 실패');return;}
  }
  const w2=800,h2=600;
  const paths=[];
  let cx=32,cy=32+scale;
  const fgc=inverted?'rgba(255,255,255,0.85)':'rgba(0,0,0,0.85)';
  for(const ch of allChars){
    if(ch==='__CMP__')continue;
    if(ch==='\n'){cx=32;cy+=scale*1.4;continue;}
    if(ch===' '){cx+=scale*0.3;continue;}
    const glyph=otFont.charToGlyph(ch);
    if(!glyph||glyph.index===0){cx+=scale*0.3;continue;}
    const sc=scale/otFont.unitsPerEm;
    const path=glyph.getPath(cx,cy,scale);
    // path를 점으로 샘플링 + jitter 적용 (스타일3과 동일)
    const strokes=pathToStrokes(path);
    strokes.forEach(pts=>{
      const segs=s3buildSegs(pts);
      segs.forEach(seg=>{
        if(seg.length<2)return;
        let d='M'+seg[0][0].toFixed(1)+','+seg[0][1].toFixed(1);
        for(let i=1;i<seg.length;i++)d+=' L'+seg[i][0].toFixed(1)+','+seg[i][1].toFixed(1);
        paths.push(d);
      });
    });
    cx+=Math.round(glyph.advanceWidth*sc);
    if(cx>w2-32){cx=32;cy+=scale*1.4;}
  }
  const svg=`<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w2} ${h2}" width="${w2}" height="${h2}">\n<rect width="${w2}" height="${h2}" fill="${bg()}"/>\n${paths.map(d=>`<path d="${d}" fill="none" stroke="${fgc}" stroke-width="${s2strokeW}" stroke-linecap="round" stroke-linejoin="round"/>`).join('\n')}\n</svg>`;
  downloadSvg(svg,'style2');
}

function exportSvgStyle3(){
  if(!s3font){alert('폰트를 먼저 로드하세요');return;}
  const paths=[];
  let cx=24,cy=24+scale;
  for(const ch of allChars){
    if(ch==='__CMP__')continue;
    if(ch==='\n'){cx=24;cy+=scale+Math.round(scale*0.15);continue;}
    if(ch===' '){cx+=Math.round(scale*0.3);continue;}
    const glyph=s3font.charToGlyph(ch);
    if(!glyph||glyph.index===0){cx+=Math.round(scale*0.3);continue;}
    const sc=scale/s3font.unitsPerEm;
    const path=glyph.getPath(cx,cy,scale);
    const strokes=pathToStrokes(path);
    strokes.forEach(pts=>{
      const segs=s3buildSegs(pts);
      segs.forEach(seg=>{
        if(seg.length<2)return;
        let d='M'+seg[0][0].toFixed(1)+','+seg[0][1].toFixed(1);
        for(let i=1;i<seg.length;i++)d+=' L'+seg[i][0].toFixed(1)+','+seg[i][1].toFixed(1);
        paths.push(d);
      });
    });
    cx+=Math.round(glyph.advanceWidth*sc)+Math.round(scale*0.05);
    if(cx>W3-24){cx=24;cy+=scale+Math.round(scale*0.15);}
  }
  const svg=`<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W3} ${H3}" width="${W3}" height="${H3}">\n<rect width="${W3}" height="${H3}" fill="${bg()}"/>\n${paths.map(d=>`<path d="${d}" fill="none" stroke="${fg()}" stroke-width="${thick}" stroke-linecap="round" stroke-linejoin="round"/>`).join('\n')}\n</svg>`;
  downloadSvg(svg,'style3');
}

function downloadSvg(svg,prefix){
  const blob=new Blob([svg],{type:'image/svg+xml'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=prefix+'-'+Date.now()+'.svg';a.click();
  URL.revokeObjectURL(url);
}

function exportAnimSvgStyle1(){
  // 30프레임: 각 획을 30번 다른 jitter로 생성 → animate d
  const frames=30;
  const charData=[];
  let cur={x:24,y:24};
  for(const ch of allChars){
    if(ch==='__CMP__')continue;
    if(ch==='\n'){cur.x=24;cur.y+=scale+Math.round(scale*.15);continue;}
    let st=G[ch]||G[ch.toUpperCase()];
    const code=ch.charCodeAt(0),isH=code>=0xAC00&&code<=0xD7A3,isK=!!st;
    const w=Math.round(scale*(isK?.6:.85)),h=scale,sp=Math.round(scale*.2);
    if(cur.x+w>W-24){cur.x=24;cur.y+=scale+Math.round(scale*.15);}
    if(cur.y+h>H-24)continue;
    const ox=cur.x,oy=cur.y;
    let charStrokes=[];
    if(isH){
      const d=decompose(ch);
      if(d){
        const cs=JAMO[CHOSEONG[d.cho]],js=JAMO[JUNGSEONG[d.jung]],jgs=d.jong>0?(JAMO[JONGSEONG[d.jong]]||null):null;
        if(cs&&js){
          const{cb,jb,jgb}=getLayout(d.jung,!!jgs);
          const mapJ=(strokes,box)=>strokes.map(s=>s.map(p=>[box.x+p[0]*box.w,box.y+p[1]*box.h]));
          charStrokes=[...mapJ(cs,cb),...mapJ(js,jb)];
          if(jgs&&jgb)charStrokes.push(...mapJ(jgs,jgb));
        }
      }
    }else if(st)charStrokes=st;
    charStrokes.forEach(s=>{charData.push({stroke:s,ox,oy,w,h});});
    cur.x+=w+sp;
  }
  // 각 획에 대해 30프레임 d 생성
  const elements=charData.map(({stroke,ox,oy,w,h})=>{
    const dVals=[];
    for(let f=0;f<frames;f++){
      const segs=buildSegs(stroke,ox,oy,w,h);
      let d='';
      segs.forEach(seg=>{if(seg.length<2)return;d+='M'+seg[0][0].toFixed(1)+','+seg[0][1].toFixed(1);for(let i=1;i<seg.length;i++)d+=' L'+seg[i][0].toFixed(1)+','+seg[i][1].toFixed(1);});
      dVals.push(d);
    }
    dVals.push(dVals[0]);
    const dur=(2.4+Math.random()*1.6).toFixed(1);
    return `<path d="${dVals[0]}" fill="none" stroke="${fg()}" stroke-width="${thick}" stroke-linecap="round" stroke-linejoin="round"><animate attributeName="d" values="${dVals.join(';')}" dur="${dur}s" repeatCount="indefinite"/></path>`;
  });
  const svg=`<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">\n<rect width="${W}" height="${H}" fill="${bg()}"/>\n${elements.join('\n')}\n</svg>`;
  downloadSvg(svg,'style1-anim');
}

function exportAnimSvgStyle2(){
  let otFont=s3font;
  if(!otFont){alert('폰트를 먼저 로드하세요');return;}
  const frames=30;
  const w2=800,h2=600;
  const fgc=inverted?'rgba(255,255,255,0.85)':'rgba(0,0,0,0.85)';
  const strokeData=[];
  let cx=32,cy=32+scale;
  for(const ch of allChars){
    if(ch==='__CMP__')continue;
    if(ch==='\n'){cx=32;cy+=scale*1.4;continue;}
    if(ch===' '){cx+=scale*0.3;continue;}
    const glyph=otFont.charToGlyph(ch);
    if(!glyph||glyph.index===0){cx+=scale*0.3;continue;}
    const sc=scale/otFont.unitsPerEm;
    const path=glyph.getPath(cx,cy,scale);
    const strokes=pathToStrokes(path);
    strokes.forEach(pts=>{strokeData.push(pts);});
    cx+=Math.round(glyph.advanceWidth*sc);
    if(cx>w2-32){cx=32;cy+=scale*1.4;}
  }
  const elements=strokeData.map(pts=>{
    const dVals=[];
    for(let f=0;f<frames;f++){
      const segs=s3buildSegs(pts);
      let d='';
      segs.forEach(seg=>{if(seg.length<2)return;d+='M'+seg[0][0].toFixed(1)+','+seg[0][1].toFixed(1);for(let i=1;i<seg.length;i++)d+=' L'+seg[i][0].toFixed(1)+','+seg[i][1].toFixed(1);});
      dVals.push(d);
    }
    dVals.push(dVals[0]);
    const dur=(2.4+Math.random()*1.6).toFixed(1);
    return `<path d="${dVals[0]}" fill="none" stroke="${fgc}" stroke-width="${s2strokeW}" stroke-linecap="round" stroke-linejoin="round"><animate attributeName="d" values="${dVals.join(';')}" dur="${dur}s" repeatCount="indefinite"/></path>`;
  });
  const svg=`<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w2} ${h2}" width="${w2}" height="${h2}">\n<rect width="${w2}" height="${h2}" fill="${bg()}"/>\n${elements.join('\n')}\n</svg>`;
  downloadSvg(svg,'style2-anim');
}

// ===== 폰트 로딩 =====
const btnLoadFonts=document.getElementById('btn-load-fonts-global');
const fontSelect=document.getElementById('p-font-global');
const fontStatus=document.getElementById('v-font-status');
let cachedFonts=null; // queryLocalFonts 결과 캐시

btnLoadFonts.addEventListener('click',async()=>{
  if(!('queryLocalFonts' in window)){
    fontStatus.textContent='미지원 브라우저';
    return;
  }
  try{
    cachedFonts=await window.queryLocalFonts();
    const families=[...new Set(cachedFonts.map(f=>f.family))].sort();
    fontSelect.innerHTML='';
    families.forEach(f=>{
      const opt=document.createElement('option');
      opt.value=f;opt.textContent=f;
      if(f==='BAEMIN WORK')opt.selected=true;
      fontSelect.appendChild(opt);
    });
    fontSelect.style.display='block';
    btnLoadFonts.style.display='none';
    fontStatus.textContent=families.length+'개 폰트';
    const defaultFont=families.includes('BAEMIN WORK')?'BAEMIN WORK':families[0];
    fontSelect.value=defaultFont;
    await applyFont(defaultFont);
  }catch(e){
    fontStatus.textContent='접근 거부: '+e.message;
  }
});

fontSelect.addEventListener('change',()=>{
  applyFont(fontSelect.value);
});

async function applyFont(fontName){
  s2fontFamily='"'+fontName+'"';
  if(drawStyle===2) s2updateStyle();
  // 캐시된 폰트에서 찾기
  if(!cachedFonts)return;
  const match=cachedFonts.find(f=>f.family===fontName);
  if(match){
    try{
      const blob=await match.blob();
      const buf=await blob.arrayBuffer();
      s3font=opentype.parse(buf);
      fontStatus.textContent='✓ '+fontName;
      if(drawStyle===3) s3redrawCanvas();
    }catch(e){fontStatus.textContent='✗ 파싱 실패';}
  }
}

// ===== 초기화 =====
function init(){
  s1resize();
  // s3resize는 탭3 전환 시 호출 (display:none이면 크기 0)
  // 흔들림 애니메이션 기본 시작
  if(shakeOn) startShake();
  input.focus();
}

window.addEventListener('resize',()=>{
  if(drawStyle===1) s1resize();
  else if(drawStyle===3) s3resize();
});

// 캔버스 영역 클릭 시에만 input에 포커스
document.querySelector('.canvas-area').addEventListener('click',e=>{
  if(isComposing&&composingChar&&e.target.closest('.panel')){
    const idx=allChars.lastIndexOf('__CMP__');
    if(idx>=0)allChars[idx]=composingChar;
    isComposing=false;composingChar='';input.value='';
    redraw();
  }
  input.focus();
});

init();

})();
