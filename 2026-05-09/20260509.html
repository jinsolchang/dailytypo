<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>산쵸 궁디 팡팡</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #fff;
}

.cat-img {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 300px;
  z-index: 2;
}

.cat-img.flipped {
  transform: translate(-50%, -50%) scaleX(-1);
}

.bg-img {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 900px;
  z-index: 1;
}

.wiggle {
  animation: wiggle 0.3s ease;
}

@keyframes wiggle {
  0%, 100% { rotate: 0deg; }
  25% { rotate: -3deg; }
  75% { rotate: 3deg; }
}
</style>
</head>
<body>
<div id="start-overlay" style="position:fixed;inset:0;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;z-index:100;cursor:pointer">
  <div style="text-align:center;color:#fff;font-family:-apple-system,sans-serif">
    <div style="font-size:48px;margin-bottom:16px">🐱</div>
    <div style="font-size:18px;font-weight:700;margin-bottom:8px">고양이 궁디 팡팡</div>
    <div style="font-size:13px;color:#aaa;margin-bottom:24px">화면을 두드려서 고양이를 놀래키세요</div>
    <div style="font-size:12px;color:#666;border:1px solid #444;display:inline-block;padding:8px 20px;border-radius:20px">탭하여 시작</div>
  </div>
</div>
<img id="catBack" class="cat-img" src="front.webp" alt="">
<img id="catLook" class="cat-img" src="back.webp" alt="" style="display:none;">
<img class="bg-img" src="bg.webp" alt="">

<script>
const catBack = document.getElementById('catBack');
const catLook = document.getElementById('catLook');

let analyser = null;
let isListening = false;
let flipped = false;
let hasBeenHit = false;
let silenceTimer = null;
let prevAvg = 0;
let lastHitTime = 0;
const HIT_DEBOUNCE = 100;
const SILENCE_TIMEOUT = 1700;
const SPIKE_THRESHOLD = 25;

async function startMic() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    source.connect(analyser);
    isListening = true;
    listenLoop();
  } catch (e) {}
}

function listenLoop() {
  if (!isListening) return;

  const data = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteFrequencyData(data);

  // 두드리는 소리 대역만 분석 (200Hz ~ 500Hz)
  // fftSize=256, sampleRate=44100 → 각 bin ≈ 172Hz
  // bin 1 ≈ 172Hz, bin 3 ≈ 516Hz
  const startBin = 1, endBin = 3;
  let sum = 0;
  for (let i = startBin; i <= endBin; i++) sum += data[i];
  const avg = sum / (endBin - startBin + 1);
  const spike = avg - prevAvg;
  prevAvg = avg;

  const now = Date.now();
  if (now < muteUntil) { requestAnimationFrame(listenLoop); return; }
  if (spike > SPIKE_THRESHOLD && now - lastHitTime > HIT_DEBOUNCE) {
    lastHitTime = now;
    onHit();
  }

  requestAnimationFrame(listenLoop);
}

function onHit() {
  hasBeenHit = true;

  if (silenceTimer) {
    clearTimeout(silenceTimer);
    silenceTimer = null;
  }

  catBack.style.display = 'block';
  catLook.style.display = 'none';

  flipped = !flipped;
  catBack.classList.toggle('flipped', flipped);

  catBack.classList.remove('wiggle');
  void catBack.offsetWidth;
  catBack.classList.add('wiggle');

  silenceTimer = setTimeout(() => {
    if (hasBeenHit) onSilence();
  }, SILENCE_TIMEOUT);
}

let muteUntil = 0; // 야옹 재생 중 마이크 무시

function onSilence() {
  catBack.style.display = 'none';
  catLook.style.display = 'block';
  catBack.classList.remove('flipped');
  flipped = false;
  howlSound.currentTime = 0;
  howlSound.play();
  muteUntil = Date.now() + 500; // 0.5초간 마이크 무시 (피드백 방지)
}

const howlSound = new Audio('howl.mp3');

// iOS 오디오 unlock: 첫 터치 시 무음 재생으로 잠금 해제
document.getElementById('start-overlay').addEventListener('click', function() {
  this.style.display = 'none';
  // iOS AudioContext unlock (소리 없이)
  const unlockCtx = new (window.AudioContext || window.webkitAudioContext)();
  unlockCtx.resume().then(() => unlockCtx.close()).catch(()=>{});
  startMic();
});

</script>
</body>
</html>
