<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>산쵸 궁디 팡팡</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #fff;
}

.cat-img {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 300px;
  z-index: 2;
}

.cat-img.flipped {
  transform: translate(-50%, -50%) scaleX(-1);
}

.bg-img {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 900px;
  z-index: 1;
}

.wiggle {
  animation: wiggle 0.3s ease;
}

@keyframes wiggle {
  0%, 100% { rotate: 0deg; }
  25% { rotate: -3deg; }
  75% { rotate: 3deg; }
}
</style>
</head>
<body>
<img id="catBack" class="cat-img" src="front.webp" alt="">
<img id="catLook" class="cat-img" src="back.webp" alt="" style="display:none;">
<img class="bg-img" src="bg.webp" alt="">

<script>
const catBack = document.getElementById('catBack');
const catLook = document.getElementById('catLook');

let analyser = null;
let isListening = false;
let flipped = false;
let hasBeenHit = false;
let silenceTimer = null;
let prevAvg = 0;
let lastHitTime = 0;
const HIT_DEBOUNCE = 100;
const SILENCE_TIMEOUT = 1700;
const SPIKE_THRESHOLD = 12;

async function startMic() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    source.connect(analyser);
    isListening = true;
    listenLoop();
  } catch (e) {}
}

function listenLoop() {
  if (!isListening) return;

  const data = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteFrequencyData(data);

  let sum = 0;
  for (let i = 0; i < data.length; i++) sum += data[i];
  const avg = sum / data.length;
  const spike = avg - prevAvg;
  prevAvg = avg;

  const now = Date.now();
  if (spike > SPIKE_THRESHOLD && now - lastHitTime > HIT_DEBOUNCE) {
    lastHitTime = now;
    onHit();
  }

  requestAnimationFrame(listenLoop);
}

function onHit() {
  hasBeenHit = true;

  if (silenceTimer) {
    clearTimeout(silenceTimer);
    silenceTimer = null;
  }

  catBack.style.display = 'block';
  catLook.style.display = 'none';

  flipped = !flipped;
  catBack.classList.toggle('flipped', flipped);

  catBack.classList.remove('wiggle');
  void catBack.offsetWidth;
  catBack.classList.add('wiggle');

  silenceTimer = setTimeout(() => {
    if (hasBeenHit) onSilence();
  }, SILENCE_TIMEOUT);
}

function onSilence() {
  catBack.style.display = 'none';
  catLook.style.display = 'block';
  catBack.classList.remove('flipped');
  flipped = false;
  howlSound.currentTime = 0;
  howlSound.play();
}

const howlSound = new Audio('howl.mp3');

// iOS 오디오 unlock: 첫 터치 시 무음 재생으로 잠금 해제
document.addEventListener('touchstart', function unlockAudio() {
  howlSound.play().then(() => { howlSound.pause(); howlSound.currentTime = 0; }).catch(()=>{});
  document.removeEventListener('touchstart', unlockAudio);
}, { once: true });

startMic();
</script>
</body>
</html>
