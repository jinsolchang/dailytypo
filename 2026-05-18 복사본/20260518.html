<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MICHAEL — 마이클</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Noto+Serif+KR:wght@700;900&family=Noto+Serif+SC:wght@700;900&family=Noto+Serif+JP:wght@700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#050305;font-family:'Noto Serif KR',serif}
.bg{width:100%;height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#0a0608,#12090e 40%,#080406)}
.poster{position:relative;aspect-ratio:4/5;height:min(92vh,calc(90vw*5/4));max-width:90vw;max-height:92vh;background:radial-gradient(ellipse at 50% 35%,#2a1810,#1a0f08 40%,#0d0604);border-radius:4px;box-shadow:0 0 60px rgba(0,0,0,.9),0 0 120px rgba(0,0,0,.6)}
.poster::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,.5));pointer-events:none;z-index:5;border-radius:4px}
canvas#dust{position:absolute;inset:0;z-index:2;width:100%;height:100%;pointer-events:none}
.credits{position:absolute;z-index:15;top:5%;left:0;right:0;text-align:center}
.credits .a{font-size:clamp(.5rem,1.1vw,.75rem);color:rgba(255,255,255,.6);letter-spacing:.25em;margin-bottom:.4em}
.credits .b{font-size:clamp(.6rem,1.3vw,.9rem);font-weight:700;color:rgba(255,255,255,.8);letter-spacing:.18em}
.tbox{position:absolute;z-index:20;top:12%;left:0;right:0;text-align:center;transform:rotate(-5deg);padding:0 5%}
.ttl{font-family:'Great Vibes',cursive;font-size:clamp(3rem,10vw,7rem);font-weight:400;color:#d4af55;text-shadow:0 0 15px rgba(212,175,85,.5),0 0 30px rgba(212,175,85,.2),0 2px 4px rgba(0,0,0,.5);display:inline-block;padding:0 .3em;line-height:1.4;transition:opacity .4s ease,transform .4s ease}
.ttl.hide{opacity:0;transform:translateY(-10px)}
.ttl.kr{font-family:'Noto Serif KR',serif;font-weight:900;font-size:clamp(2.5rem,8vw,5.5rem)}
.ttl.sc{font-family:'Noto Serif SC',serif;font-weight:900;font-size:clamp(2.5rem,8vw,5.5rem)}
.ttl.jp{font-family:'Noto Serif JP',serif;font-weight:900;font-size:clamp(2.5rem,8vw,5.5rem)}
.figs{position:absolute;z-index:10;bottom:14%;left:50%;transform:translateX(-50%);width:88%;height:55%}
.f{position:absolute;bottom:0;cursor:pointer;filter:drop-shadow(0 8px 20px rgba(0,0,0,.8));transition:filter .3s}
.f:hover{filter:drop-shadow(0 0 25px rgba(212,175,85,.4)) drop-shadow(0 8px 20px rgba(0,0,0,.8))}
.f img{height:100%;width:auto;display:block}
.f1{left:3%;height:62%;z-index:1;animation:bob1 3s ease-in-out infinite alternate}
.f2{left:20%;height:75%;z-index:2;animation:bob2 3.4s ease-in-out infinite alternate}
.f3{left:36%;height:88%;z-index:4;animation:bob3 3.8s ease-in-out infinite alternate}
.f4{left:60%;height:70%;z-index:3;animation:bob4 3.2s ease-in-out infinite alternate}
@keyframes bob1{to{transform:translateY(-3px)}}
@keyframes bob2{to{transform:translateY(-4px)}}
@keyframes bob3{to{transform:translateY(-5px)}}
@keyframes bob4{to{transform:translateY(-4px)}}
.f.d1{animation:lean 1.4s ease-in-out 2 forwards!important}
.f.d2{animation:spin 1.2s ease-in-out 2 forwards!important}
.f.d3{animation:mwalk 1.6s ease-in-out 2 forwards!important}
.f.d4{animation:kick 1.3s ease-in-out 2 forwards!important}
@keyframes lean{0%,100%{transform:rotate(0) translateY(0)}15%{transform:rotate(-15deg) translateY(-5px)}30%{transform:rotate(10deg) translateY(-8px)}45%{transform:rotate(-12deg) translateY(-3px)}60%{transform:rotate(8deg) translateY(-6px)}75%{transform:rotate(-10deg) translateY(-4px)}90%{transform:rotate(5deg) translateY(-2px)}}
@keyframes spin{0%{transform:rotateY(0) scale(1)}25%{transform:rotateY(90deg) scale(.85)}50%{transform:rotateY(180deg) scale(1)}75%{transform:rotateY(270deg) scale(.85)}100%{transform:rotateY(360deg) scale(1)}}
@keyframes mwalk{0%,100%{transform:translateX(0)}25%{transform:translateX(-20px)}50%{transform:translateX(-40px)}75%{transform:translateX(-20px)}}
@keyframes kick{0%,100%{transform:translateY(0) rotate(0)}20%{transform:translateY(-20px) rotate(5deg)}40%{transform:translateY(-5px) rotate(-3deg)}60%{transform:translateY(-25px) rotate(4deg)}80%{transform:translateY(-8px) rotate(-2deg)}}
.f.dancing::after{content:'';position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);width:80%;height:20px;background:radial-gradient(ellipse,rgba(212,175,85,.5),transparent 70%);border-radius:50%;animation:pulse .3s ease-in-out infinite alternate}
@keyframes pulse{to{opacity:.3}}
.bot{position:absolute;z-index:15;bottom:5%;left:0;right:0;text-align:center}
.bot .tg{font-size:clamp(.55rem,1.2vw,.8rem);color:rgba(255,255,255,.7);letter-spacing:.18em;margin-bottom:.4em}
.bot .dt{font-size:clamp(.5rem,1.1vw,.75rem);color:rgba(255,255,255,.5);letter-spacing:.1em}
.logos{position:absolute;z-index:15;bottom:1.5%;left:0;right:0;display:flex;justify-content:center;gap:3em}
.logos span{font-size:clamp(.3rem,.65vw,.4rem);color:rgba(255,255,255,.2);letter-spacing:.1em}
</style>
</head>
<body>
<div class="bg">
<div class="poster" id="poster">
<canvas id="dust"></canvas>
<div class="credits"><div class="a">보헤미안 랩소디 제작진</div><div class="b">트레이닝 데이 감독</div></div>
<div class="tbox"><span class="ttl" id="ttl">Michael</span></div>
<div class="figs">
<div class="f f1" data-d="d1"><img src="assets/michael_1.png"></div>
<div class="f f2" data-d="d2"><img src="assets/michael_2.png"></div>
<div class="f f3" data-d="d3"><img src="assets/michael_3.png"></div>
<div class="f f4" data-d="d4"><img src="assets/michael_4.png"></div>
</div>
<div class="bot"><div class="tg">전설이 된 황제, 그 위대한 시작</div><div class="dt">2026년 5월 13일 대개봉</div></div>
<div class="logos"><span>LIONSGATE</span><span>COLUMBIA PICTURES</span></div>
</div>
</div>
<script>
var ttl=document.getElementById('ttl');
var list=[{t:'Michael',c:''},{t:'마이클',c:'kr'},{t:'迈克尔',c:'sc'},{t:'マイケル',c:'jp'},{t:'Miguel',c:''}];
var i=0;
setInterval(function(){
  ttl.classList.add('hide');
  setTimeout(function(){
    i=(i+1)%list.length;
    ttl.textContent=list[i].t;
    ttl.className='ttl'+(list[i].c?' '+list[i].c:'');
  },400);
},3000);

document.querySelectorAll('.f').forEach(function(el){
  el.addEventListener('click',function(){
    if(el.classList.contains('dancing'))return;
    var d=el.getAttribute('data-d');
    el.classList.add('dancing',d);
    el.addEventListener('animationend',function handler(){
      el.classList.remove('dancing',d);
      el.removeEventListener('animationend',handler);
    });
  });
});

var c=document.getElementById('dust'),ctx=c.getContext('2d');
function rs(){var r=document.getElementById('poster').getBoundingClientRect();c.width=r.width*2;c.height=r.height*2;}
rs();window.addEventListener('resize',rs);
var p=[];for(var j=0;j<60;j++)p.push({x:Math.random(),y:Math.random(),s:Math.random()*1.5+.3,vy:-(Math.random()*.0003+.0001),vx:(Math.random()-.5)*.0001,a:Math.random()*.4+.1,t:Math.random()*6.28,ts:Math.random()*.02+.005});
(function loop(){
  ctx.clearRect(0,0,c.width,c.height);
  for(var j=0;j<p.length;j++){var q=p[j];q.y+=q.vy;q.x+=q.vx;q.t+=q.ts;
  if(q.y<0){q.y=1;q.x=Math.random();}
  ctx.beginPath();ctx.arc(q.x*c.width,q.y*c.height,q.s,0,6.28);
  ctx.fillStyle='rgba(212,185,120,'+(q.a*(.6+.4*Math.sin(q.t)))+')';ctx.fill();}
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
