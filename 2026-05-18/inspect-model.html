<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
</head>
<body style="margin:0;background:#222;color:#fff;font-family:monospace;padding:20px">
<h2>GLB Material Inspector</h2>
<model-viewer id="viewer" src="assets/baemin-clock.glb" style="width:400px;height:400px;background:#333"></model-viewer>
<pre id="output" style="margin-top:20px;font-size:13px;max-height:60vh;overflow:auto"></pre>
<script type="module">
const viewer = document.getElementById('viewer');
const output = document.getElementById('output');

viewer.addEventListener('load', () => {
  const model = viewer.model;
  let text = `=== Materials (${model.materials.length}) ===\n\n`;
  
  model.materials.forEach((mat, i) => {
    text += `[${i}] "${mat.name}"\n`;
    if (mat.pbrMetallicRoughness) {
      const pbr = mat.pbrMetallicRoughness;
      if (pbr.baseColorTexture) {
        text += `    baseColorTexture: yes\n`;
      }
      if (pbr.baseColorFactor) {
        const c = pbr.baseColorFactor;
        text += `    baseColorFactor: [${c.map(v=>v.toFixed(3)).join(', ')}]\n`;
      }
    }
    text += `\n`;
  });

  text += `\n=== Meshes ===\n\n`;
  // traverse scene graph
  function traverse(node, depth=0) {
    const indent = '  '.repeat(depth);
    text += `${indent}Node: "${node.name || '(unnamed)'}"\n`;
    if (node.mesh) {
      node.mesh.primitives.forEach((prim, pi) => {
        const matName = prim.material ? prim.material.name : '(none)';
        text += `${indent}  primitive[${pi}] → material: "${matName}"\n`;
      });
    }
    if (node.children) {
      node.children.forEach(child => traverse(child, depth+1));
    }
  }
  
  // model-viewer exposes materials but not full scene graph easily
  // Let's just list materials for now
  output.textContent = text;
});
</script>
</body>
</html>
