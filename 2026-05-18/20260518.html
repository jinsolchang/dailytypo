<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>배민시계</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
  @font-face {
    font-family: 'BAEMINWORK';
    src: url('assets/BAEMINWORK.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
  }
</style>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: 'Noto Sans KR', sans-serif;
  }
  body {
    background: radial-gradient(ellipse 80% 60% at 50% 55%, #1a3a38 0%, #0a1a19 50%, #050d0c 100%);
  }
  #canvas3d {
    width: 100vw;
    height: 100vh;
    display: block;
  }
</style>
</head>
<body>
<canvas id="canvas3d"></canvas>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// --- Scene setup ---
const canvas = document.getElementById('canvas3d');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.6;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 100);
camera.position.set(0, 0, 3);

// --- Lighting (대비 강조) ---
const ambientLight = new THREE.AmbientLight(0xffffff, 0.25);
scene.add(ambientLight);

// 메인 키라이트 (위에서 앞으로)
const dirLight = new THREE.DirectionalLight(0xffffff, 3.2);
dirLight.position.set(1, 3, 4);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 1024;
dirLight.shadow.mapSize.height = 1024;
dirLight.shadow.camera.near = 0.5;
dirLight.shadow.camera.far = 20;
dirLight.shadow.camera.left = -3;
dirLight.shadow.camera.right = 3;
dirLight.shadow.camera.top = 3;
dirLight.shadow.camera.bottom = -3;
dirLight.shadow.bias = -0.001;
dirLight.shadow.radius = 4;
scene.add(dirLight);

// 림라이트 (뒤에서 윤곽)
const rimLight = new THREE.DirectionalLight(0x6DD3CE, 1.4);
rimLight.position.set(-2, 1, -3);
scene.add(rimLight);

// 약한 필라이트
const fillLight = new THREE.DirectionalLight(0xffffff, 0.2);
fillLight.position.set(-3, 0, 2);
scene.add(fillLight);

// --- Controls ---
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enablePan = false;
controls.minDistance = 1.5;
controls.maxDistance = 8;
controls.target.set(0, 0, 0);

// 정면 복귀 타이머
let resetTimer = null;
let isResetting = false;
// 시작 카메라 위치 저장 (GLB 로드 후 설정됨)
let startCameraPos = null;

controls.addEventListener('start', () => {
  clearTimeout(resetTimer);
  isResetting = false;
});
controls.addEventListener('end', () => {
  resetTimer = setTimeout(resetCamera, 4000);
});

function resetCamera() {
  if (!startCameraPos) return;
  isResetting = true;
  const startPos = camera.position.clone();
  const endPos = startCameraPos.clone();
  const startTime = performance.now();
  const duration = 1200;

  function animateReset(now) {
    if (!isResetting) return;
    const t = Math.min((now - startTime) / duration, 1);
    const ease = 1 - Math.pow(1 - t, 3);
    camera.position.lerpVectors(startPos, endPos, ease);
    camera.lookAt(controls.target);
    controls.update();
    if (t < 1) requestAnimationFrame(animateReset);
    else isResetting = false;
  }
  requestAnimationFrame(animateReset);
}

// --- Canvas 텍스처 (디스플레이 콘텐츠) ---
const displaySize = 512;
const displayCanvas = document.createElement('canvas');
displayCanvas.width = displaySize;
displayCanvas.height = displaySize;
const ctx = displayCanvas.getContext('2d');

const displayTexture = new THREE.CanvasTexture(displayCanvas);
displayTexture.colorSpace = THREE.SRGBColorSpace;

// 화면 데이터
let currentScreen = 0;
const totalScreens = 4;
let lastSwitch = 0;
const switchInterval = 4000;

// 실시간 날씨 데이터
let weatherData = { temp: '--', emoji: '🌤️', desc: '날씨 로딩 중...' };

async function fetchWeather() {
  try {
    // 서울 좌표
    const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.978&current=temperature_2m,weather_code&timezone=Asia/Seoul');
    const data = await res.json();
    const temp = Math.round(data.current.temperature_2m);
    const code = data.current.weather_code;
    
    // 날씨 코드 → 이모지 + 설명
    let emoji = '🌤️', desc = '맑음';
    if (code === 0) { emoji = '☀️'; desc = '맑음 · 산책하기 좋은 날'; }
    else if (code <= 3) { emoji = '⛅'; desc = '구름 조금 · 가벼운 하루'; }
    else if (code <= 48) { emoji = '🌫️'; desc = '안개 · 조심히 다니세요'; }
    else if (code <= 57) { emoji = '🌦️'; desc = '이슬비 · 우산 챙기세요'; }
    else if (code <= 67) { emoji = '🌧️'; desc = '비 · 따뜻한 국물 어때요?'; }
    else if (code <= 77) { emoji = '🌨️'; desc = '눈 · 미끄럼 주의'; }
    else if (code <= 82) { emoji = '🌧️'; desc = '소나기 · 잠깐 기다려요'; }
    else if (code <= 86) { emoji = '❄️'; desc = '폭설 · 집이 최고'; }
    else { emoji = '⛈️'; desc = '뇌우 · 실내에 계세요'; }
    
    // 온도별 한마디 추가
    if (temp >= 30) desc = '폭염 · 시원한 거 시키세요';
    else if (temp >= 25) desc += '';
    else if (temp <= 0) desc = '영하 · 따뜻하게 입으세요';
    
    weatherData = { temp: `${temp}°`, emoji, desc };
  } catch(e) {
    weatherData = { temp: '24°', emoji: '☀️', desc: '날씨 정보 없음' };
  }
}
fetchWeather();
setInterval(fetchWeather, 600000); // 10분마다 갱신

function getGreeting() {
  const h = new Date().getHours();
  if (h < 6) return '아직 이른 새벽이에요';
  if (h < 11) return '좋은 아침이에요';
  if (h < 14) return '점심 뭐 먹을까요?';
  if (h < 18) return '좋은 오후예요';
  if (h < 22) return '오늘 하루 수고했어요';
  return '굿나잇 🌙';
}

function getMenu() {
  const h = new Date().getHours();
  const menus = {
    morning: [{ emoji: '🥐', name: '크루아상', desc: '바삭한 아침의 시작' }, { emoji: '☕', name: '아메리카노', desc: '눈 뜨는 한 잔' }],
    lunch: [{ emoji: '🍜', name: '김치찌개', desc: '뜨끈한 국물이 땡기는 날' }, { emoji: '🍝', name: '크림파스타', desc: '부드러운 점심 한 끼' }],
    dinner: [{ emoji: '🍕', name: '피자', desc: '치즈가 쭉~ 늘어나는' }, { emoji: '🍗', name: '치킨', desc: '오늘은 치킨이지' }],
    night: [{ emoji: '🍜', name: '라면', desc: '야식의 정석' }, { emoji: '🍺', name: '맥주+치킨', desc: '고생했으니까' }]
  };
  let pool;
  if (h < 10) pool = menus.morning;
  else if (h < 15) pool = menus.lunch;
  else if (h < 20) pool = menus.dinner;
  else pool = menus.night;
  return pool[Math.floor(Math.random() * pool.length)];
}

const menuPick = getMenu();

function drawDisplay(time) {
  const cx = displaySize / 2;
  const cy = displaySize / 2;
  const r = displaySize / 2;

  // 배경: 원형 클리핑
  ctx.clearRect(0, 0, displaySize, displaySize);
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.clip();

  // 검은 배경
  ctx.fillStyle = '#111';
  ctx.fillRect(0, 0, displaySize, displaySize);

  // 화면 전환
  if (time - lastSwitch > switchInterval) {
    currentScreen = (currentScreen + 1) % totalScreens;
    lastSwitch = time;
  }

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  if (currentScreen === 0) {
    // 시간 화면
    const now = new Date();
    const timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    const days = ['일','월','화','수','목','금','토'];
    const dateStr = `${now.getMonth()+1}월 ${now.getDate()}일 ${days[now.getDay()]}요일`;

    ctx.fillStyle = '#6DD3CE';
    ctx.font = '700 34px Pretendard, sans-serif';
    ctx.fillText(getGreeting(), cx, cy - 80);

    ctx.fillStyle = '#fff';
    ctx.font = '96px BAEMINWORK, sans-serif';
    ctx.fillText(timeStr, cx, cy + 15);

    // 구분선
    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cx - 80, cy + 60);
    ctx.lineTo(cx + 80, cy + 60);
    ctx.stroke();

    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.font = '400 26px Pretendard, sans-serif';
    ctx.fillText(dateStr, cx, cy + 100);

  } else if (currentScreen === 1) {
    // 메뉴 추천
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.font = '400 26px Pretendard, sans-serif';
    ctx.fillText('오늘의 추천', cx, cy - 110);

    ctx.font = '80px serif';
    ctx.fillText(menuPick.emoji, cx, cy - 30);

    ctx.fillStyle = '#fff';
    ctx.font = '52px BAEMINWORK, sans-serif';
    ctx.fillText(menuPick.name, cx, cy + 60);

    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.font = '400 24px Pretendard, sans-serif';
    ctx.fillText(menuPick.desc, cx, cy + 110);

  } else if (currentScreen === 2) {
    // 날씨 (실시간)
    ctx.font = '100px serif';
    ctx.fillText(weatherData.emoji, cx, cy - 50);

    ctx.fillStyle = '#fff';
    ctx.font = '76px BAEMINWORK, sans-serif';
    ctx.fillText(weatherData.temp, cx, cy + 50);

    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.font = '400 26px Pretendard, sans-serif';
    ctx.fillText(weatherData.desc, cx, cy + 110);

  } else if (currentScreen === 3) {
    // 한마디
    ctx.fillStyle = '#fff';
    ctx.font = '38px BAEMINWORK, sans-serif';
    ctx.fillText('"배달이 빠른 건', cx, cy - 40);
    ctx.fillText('당연한 게 아닙니다"', cx, cy + 10);

    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.font = '400 24px Pretendard, sans-serif';
    ctx.fillText('— 배민시계', cx, cy + 80);
  }

  // 인디케이터 dots
  const dotY = cy + r * 0.78;
  const dotGap = 14;
  const startX = cx - (totalScreens - 1) * dotGap / 2;
  for (let i = 0; i < totalScreens; i++) {
    ctx.beginPath();
    ctx.arc(startX + i * dotGap, dotY, i === currentScreen ? 5 : 3, 0, Math.PI * 2);
    ctx.fillStyle = i === currentScreen ? '#6DD3CE' : 'rgba(255,255,255,0.25)';
    ctx.fill();
  }

  ctx.restore();
  displayTexture.needsUpdate = true;
}

// --- GLB 로드 + 디스플레이 plane 부착 ---
let clockModel = null;

const loader = new GLTFLoader();
loader.load('assets/baemin-clock.glb', (gltf) => {
  clockModel = gltf.scene;
  
  // 재질 조정: 매트 + 까슬까슬 느낌 (normalMap으로 미세 텍스처)
  clockModel.traverse((child) => {
    if (child.isMesh && child.material) {
      child.material.roughness = 0.95;
      child.material.metalness = 0.0;
      child.material.envMapIntensity = 0.2;
      child.castShadow = true;
      // 까슬까슬한 느낌을 위해 bumpMap 생성
      const bumpCanvas = document.createElement('canvas');
      bumpCanvas.width = 256;
      bumpCanvas.height = 256;
      const bCtx = bumpCanvas.getContext('2d');
      const imgData = bCtx.createImageData(256, 256);
      for (let i = 0; i < imgData.data.length; i += 4) {
        const noise = Math.random() * 50 + 205;
        imgData.data[i] = noise;
        imgData.data[i+1] = noise;
        imgData.data[i+2] = noise;
        imgData.data[i+3] = 255;
      }
      bCtx.putImageData(imgData, 0, 0);
      const bumpTexture = new THREE.CanvasTexture(bumpCanvas);
      bumpTexture.wrapS = THREE.RepeatWrapping;
      bumpTexture.wrapT = THREE.RepeatWrapping;
      bumpTexture.repeat.set(12, 12);
      child.material.bumpMap = bumpTexture;
      child.material.bumpScale = 0.025;
      child.material.needsUpdate = true;
    }
  });
  
  // 모델 중심 맞추기
  const box = new THREE.Box3().setFromObject(clockModel);
  const center = box.getCenter(new THREE.Vector3());
  clockModel.position.sub(center);
  
  // 50% 축소
  clockModel.scale.setScalar(0.5);
  
  scene.add(clockModel);

  // 바닥 그림자 받는 plane
  const shadowGeo = new THREE.PlaneGeometry(6, 6);
  const shadowMat = new THREE.ShadowMaterial({ opacity: 0.4 });
  const shadowPlane = new THREE.Mesh(shadowGeo, shadowMat);
  shadowPlane.rotation.x = -Math.PI / 2;
  // 모델 아래에 배치
  const modelBottom = box.min.y * 0.5; // 0.5 scale 적용
  shadowPlane.position.y = modelBottom - center.y * 0.5 - 0.05;
  shadowPlane.receiveShadow = true;
  scene.add(shadowPlane);

  // 디스플레이 plane 추가 (원형)
  // position 좌표를 모델 로컬 좌표에서 가져옴 (아까 클릭으로 얻은 값)
  // 모델이 center 보정 + 0.5 스케일 적용됨
  const displayGeometry = new THREE.CircleGeometry(0.47, 64);
  const displayMaterial = new THREE.MeshBasicMaterial({
    map: displayTexture,
    transparent: false,
  });
  const displayMesh = new THREE.Mesh(displayGeometry, displayMaterial);

  // 위치: 원래 좌표(0.0152, -0.2926, 0.4418)에서 center 보정 후 0.5 스케일
  // center 보정은 clockModel.position.sub(center)로 이미 적용됨
  // displayMesh는 clockModel의 child로 넣으면 로컬 좌표 그대로 사용 가능
  displayMesh.position.set(0.0152, -0.2926, 0.445); // z를 살짝 앞으로
  displayMesh.name = 'display';
  displayMeshRef = displayMesh;

  clockModel.add(displayMesh);

  // 카메라 위치 조정
  const size = box.getSize(new THREE.Vector3()).length() * 0.5;
  camera.position.set(0, 0, size * 1.8);
  controls.update();
  // 시작 위치 저장
  startCameraPos = camera.position.clone();
});

// --- Animation loop ---
// 폰트 로드 후 시작
document.fonts.ready.then(() => {
  function animate(time) {
    requestAnimationFrame(animate);
    drawDisplay(time);
    controls.update();
    renderer.render(scene, camera);
  }
  animate(0);
});

// --- 디스플레이 클릭 인터랙션 ---
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let displayMeshRef = null;

canvas.addEventListener('click', (event) => {
  if (!displayMeshRef) return;
  
  const rect = canvas.getBoundingClientRect();
  pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
  
  raycaster.setFromCamera(pointer, camera);
  const intersects = raycaster.intersectObject(displayMeshRef);
  
  if (intersects.length > 0) {
    // 다음 화면으로
    currentScreen = (currentScreen + 1) % totalScreens;
    lastSwitch = performance.now();
  }
});

// --- Resize ---
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
