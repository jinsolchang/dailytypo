<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한글 획순 연습기</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Noto Sans KR', sans-serif;
  background: #1a1a2e;
  color: #eee;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 2rem 1rem;
}
h1 {
  font-size: 2rem;
  font-weight: 900;
  margin-bottom: 0.5rem;
  background: linear-gradient(135deg, #667eea, #764ba2);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.subtitle {
  color: #888;
  margin-bottom: 2rem;
  font-size: 0.9rem;
}
.input-area {
  display: flex;
  gap: 0.5rem;
  margin-bottom: 2rem;
  width: 100%;
  max-width: 600px;
}
input[type="text"] {
  flex: 1;
  padding: 0.8rem 1.2rem;
  font-size: 1.2rem;
  border: 2px solid #333;
  border-radius: 12px;
  background: #16213e;
  color: #fff;
  font-family: 'Noto Sans KR', sans-serif;
  outline: none;
  transition: border-color 0.3s;
}
input[type="text"]:focus {
  border-color: #667eea;
}
button {
  padding: 0.8rem 1.5rem;
  font-size: 1rem;
  border: none;
  border-radius: 12px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: #fff;
  cursor: pointer;
  font-weight: 700;
  transition: transform 0.2s, opacity 0.2s;
}
button:hover { transform: scale(1.05); }
button:active { transform: scale(0.95); }
.controls {
  display: flex;
  gap: 0.5rem;
  margin-bottom: 1.5rem;
  flex-wrap: wrap;
  justify-content: center;
}
.controls button {
  padding: 0.5rem 1rem;
  font-size: 0.85rem;
  background: #2a2a4a;
  border: 1px solid #444;
}
.controls button.active {
  background: linear-gradient(135deg, #667eea, #764ba2);
  border-color: transparent;
}
.display-area {
  width: 100%;
  max-width: 900px;
  display: flex;
  flex-wrap: wrap;
  gap: 1rem;
  justify-content: center;
  margin-bottom: 2rem;
}
.char-box {
  width: 140px;
  height: 180px;
  background: #16213e;
  border-radius: 12px;
  border: 2px solid #333;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  transition: border-color 0.3s;
}
.char-box.active {
  border-color: #667eea;
  box-shadow: 0 0 20px rgba(102, 126, 234, 0.3);
}
.char-box .full-char {
  font-size: 3rem;
  font-weight: 900;
  opacity: 0.15;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}
.char-box .jamo-display {
  width: 100%;
  height: 130px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
.char-box .jamo-display svg {
  width: 80px;
  height: 80px;
}
.char-box .label {
  font-size: 0.75rem;
  color: #888;
  padding: 0.3rem;
}
.jamo-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  justify-content: center;
  width: 100%;
  max-width: 900px;
  margin-bottom: 2rem;
}
.jamo-cell {
  width: 80px;
  height: 80px;
  background: #16213e;
  border-radius: 8px;
  border: 1px solid #333;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s;
}
.jamo-cell:hover {
  border-color: #667eea;
  transform: scale(1.1);
}
.jamo-cell svg {
  width: 60px;
  height: 60px;
}
.jamo-cell .jamo-label {
  position: absolute;
  bottom: 2px;
  font-size: 0.6rem;
  color: #666;
}
/* SVG 스타일 오버라이드 */
.jamo-display .jamo path, .jamo-cell .jamo path { fill: #fff !important; }
.jamo-display .stroke-number path { fill: #667eea !important; }
.jamo-display path.order-arrow { fill: #764ba2 !important; }
.jamo-cell .jamo path { fill: #ccc !important; }
.jamo-cell .stroke-number path { fill: #667eea !important; opacity: 0.7; }
.jamo-cell path.order-arrow { fill: #764ba2 !important; opacity: 0.5; }

/* Animation */
.char-box .jamo-display svg {
  opacity: 0;
  transform: scale(0.8);
  transition: opacity 0.4s, transform 0.4s;
}
.char-box .jamo-display svg.visible {
  opacity: 1;
  transform: scale(1);
}
.char-box .full-char.revealed {
  opacity: 1;
  transition: opacity 0.5s;
}

/* Sentence mode */
.sentence-display {
  width: 100%;
  max-width: 900px;
  text-align: center;
  margin-bottom: 2rem;
}
.sentence-chars {
  display: flex;
  flex-wrap: wrap;
  gap: 0.3rem;
  justify-content: center;
  font-size: 3rem;
  font-weight: 900;
  line-height: 1.4;
}
.sentence-chars .s-char {
  opacity: 0.2;
  transition: opacity 0.5s;
  cursor: pointer;
  padding: 0 0.1rem;
}
.sentence-chars .s-char.written {
  opacity: 1;
  color: #667eea;
}
.sentence-chars .s-char.current {
  opacity: 0.6;
  color: #764ba2;
  text-decoration: underline;
}

.speed-control {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin-bottom: 1rem;
  color: #888;
  font-size: 0.85rem;
}
.speed-control input[type="range"] {
  width: 120px;
  accent-color: #667eea;
}

.info {
  color: #666;
  font-size: 0.8rem;
  text-align: center;
  margin-top: auto;
  padding-top: 2rem;
}
.info a { color: #667eea; text-decoration: none; }
</style>
</head>
<body>

<h1>한글 획순 연습기</h1>
<p class="subtitle">완성형 한글의 자모 분해와 획순을 학습합니다</p>

<div class="input-area">
  <input type="text" id="textInput" placeholder="한글 단어나 문장을 입력하세요" value="안녕하세요">
  <button onclick="startWriting()">쓰기</button>
</div>

<div class="controls">
  <button id="btn-auto" class="active" onclick="setMode('auto')">자동 재생</button>
  <button id="btn-step" onclick="setMode('step')">단계별</button>
  <button id="btn-grid" onclick="setMode('grid')">자모표</button>
  <button onclick="nextStep()" id="nextBtn" style="display:none">다음 획 →</button>
</div>

<div class="speed-control">
  <span>속도:</span>
  <input type="range" id="speedSlider" min="1" max="10" value="5">
  <span id="speedLabel">보통</span>
</div>

<div class="sentence-display" id="sentenceDisplay" style="display:none">
  <div class="sentence-chars" id="sentenceChars"></div>
</div>

<div class="display-area" id="displayArea"></div>

<div class="jamo-grid" id="jamoGrid" style="display:none"></div>

<div class="info">
  <p>획순 데이터: <a href="https://github.com/MagisterAdamus/hangeul-stroke-order" target="_blank">MagisterAdamus/hangeul-stroke-order</a> (CC BY-SA 4.0)</p>
</div>

.5 2.5s1.1193 2.5 2.5 2.5h20.906v9.8105l21.299-12.311-1.998-1.1543z\"/>\n  <path id=\"arrow-4\" class=\"order-arrow\" d=\"m399.96 115.48c-1.391 5.6e-4 -2.5181 1.1286-2.5176 2.5195v286.85h-9.8848l12.402 21.457 1.1641-2.0117 11.238-19.445h-9.8828v-286.85c5.2e-4 -1.3917-1.1278-2.52-2.5195-2.5195z\"/>\n  <path id=\"arrow-5\" class=\"order-arrow\" d=\"m479.96 101.48c-1.391 5.6e-4 -2.5181 1.1286-2.5176 2.5195v334.85h-9.8848l12.402 21.457 1.1641-2.0117 11.238-19.445h-9.8828v-334.85c5.2e-4 -1.3917-1.1278-2.52-2.5195-2.5195z\"/>\n </g>\n</svg>"};

// 한글 유니코드 분해
const CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const JUNG = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
const JONG = ['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];

// 쌍자음/복합자음 → 기본 자모 분해
const DOUBLE_MAP = {
  'ㄲ': ['ㄱ','ㄱ'], 'ㄸ': ['ㄷ','ㄷ'], 'ㅃ': ['ㅂ','ㅂ'], 'ㅆ': ['ㅅ','ㅅ'], 'ㅉ': ['ㅈ','ㅈ'],
  'ㄳ': ['ㄱ','ㅅ'], 'ㄵ': ['ㄴ','ㅈ'], 'ㄶ': ['ㄴ','ㅎ'], 'ㄺ': ['ㄹ','ㄱ'], 'ㄻ': ['ㄹ','ㅁ'],
  'ㄼ': ['ㄹ','ㅂ'], 'ㄽ': ['ㄹ','ㅅ'], 'ㄾ': ['ㄹ','ㅌ'], 'ㄿ': ['ㄹ','ㅍ'], 'ㅀ': ['ㄹ','ㅎ'], 'ㅄ': ['ㅂ','ㅅ']
};

function decomposeHangul(char) {
  const code = char.charCodeAt(0);
  if (code < 0xAC00 || code > 0xD7A3) return null;
  const offset = code - 0xAC00;
  const cho = Math.floor(offset / (21 * 28));
  const jung = Math.floor((offset % (21 * 28)) / 28);
  const jong = offset % 28;
  const result = [];
  const choChar = CHO[cho];
  if (DOUBLE_MAP[choChar]) result.push(...DOUBLE_MAP[choChar]);
  else result.push(choChar);
  result.push(JUNG[jung]);
  if (jong > 0) {
    const jongChar = JONG[jong];
    if (DOUBLE_MAP[jongChar]) result.push(...DOUBLE_MAP[jongChar]);
    else result.push(jongChar);
  }
  return result;
}

let mode = 'auto';
let animTimer = null;
let currentQueue = [];
let queueIndex = 0;

function setMode(m) {
  mode = m;
  document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + m).classList.add('active');
  document.getElementById('nextBtn').style.display = m === 'step' ? 'inline-block' : 'none';
  document.getElementById('jamoGrid').style.display = m === 'grid' ? 'flex' : 'none';
  document.getElementById('displayArea').style.display = m === 'grid' ? 'none' : 'flex';
  document.getElementById('sentenceDisplay').style.display = m === 'grid' ? 'none' : 'block';
  if (m === 'grid') showJamoGrid();
}

function showJamoGrid() {
  const grid = document.getElementById('jamoGrid');
  grid.innerHTML = '';
  const consonants = ['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ','ㅅ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  const vowels = ['ㅏ','ㅑ','ㅓ','ㅕ','ㅗ','ㅛ','ㅜ','ㅠ','ㅡ','ㅣ','ㅐ','ㅒ','ㅔ','ㅖ','ㅚ','ㅟ','ㅢ','ㅘ','ㅝ','ㅙ','ㅞ'];
  
  [...consonants, ...vowels].forEach(j => {
    if (!JAMO_SVGS[j]) return;
    const cell = document.createElement('div');
    cell.className = 'jamo-cell';
    cell.innerHTML = JAMO_SVGS[j];
    cell.onclick = () => showSingleJamo(j);
    grid.appendChild(cell);
  });
}

function showSingleJamo(j) {
  const area = document.getElementById('displayArea');
  area.style.display = 'flex';
  document.getElementById('jamoGrid').style.display = 'flex';
  area.innerHTML = '';
  const box = createCharBox(j, j);
  area.appendChild(box);
  setTimeout(() => box.querySelector('svg')?.classList.add('visible'), 100);
}

function createCharBox(char, jamo) {
  const box = document.createElement('div');
  box.className = 'char-box';
  const jamoDiv = document.createElement('div');
  jamoDiv.className = 'jamo-display';
  if (JAMO_SVGS[jamo]) {
    jamoDiv.innerHTML = JAMO_SVGS[jamo];
  } else {
    jamoDiv.innerHTML = `<span style="font-size:2.5rem;opacity:0.5">${jamo}</span>`;
  }
  const label = document.createElement('div');
  label.className = 'label';
  label.textContent = jamo;
  box.appendChild(jamoDiv);
  box.appendChild(label);
  return box;
}

function startWriting() {
  if (animTimer) { clearTimeout(animTimer); animTimer = null; }
  const text = document.getElementById('textInput').value.trim();
  if (!text) return;
  
  const area = document.getElementById('displayArea');
  const sentenceChars = document.getElementById('sentenceChars');
  const sentenceDisplay = document.getElementById('sentenceDisplay');
  area.innerHTML = '';
  sentenceChars.innerHTML = '';
  sentenceDisplay.style.display = 'block';
  
  // 문장 표시
  [...text].forEach((ch, i) => {
    const span = document.createElement('span');
    span.className = 's-char';
    span.textContent = ch;
    span.dataset.index = i;
    span.onclick = () => jumpToChar(i);
    sentenceChars.appendChild(span);
  });
  
  // 자모 큐 만들기
  currentQueue = [];
  [...text].forEach((ch, charIdx) => {
    const jamos = decomposeHangul(ch);
    if (jamos) {
      jamos.forEach(j => currentQueue.push({ char: ch, charIdx, jamo: j }));
    }
  });
  
  queueIndex = 0;
  if (mode === 'auto') autoPlay();
  else if (mode === 'step') showCurrentStep();
}

function getSpeed() {
  const v = parseInt(document.getElementById('speedSlider').value);
  const labels = ['','매우 느림','느림','조금 느림','약간 느림','보통','약간 빠름','조금 빠름','빠름','매우 빠름','즉시'];
  document.getElementById('speedLabel').textContent = labels[v] || '';
  return 1200 - (v - 1) * 120; // 1200ms ~ 120ms
}

function autoPlay() {
  if (queueIndex >= currentQueue.length) {
    // 완료 - 모든 글자 표시
    document.querySelectorAll('.s-char').forEach(s => s.classList.add('written'));
    return;
  }
  showCurrentStep();
  const delay = getSpeed();
  animTimer = setTimeout(() => {
    queueIndex++;
    autoPlay();
  }, delay);
}

function nextStep() {
  if (queueIndex >= currentQueue.length) return;
  queueIndex++;
  if (queueIndex < currentQueue.length) showCurrentStep();
}

function showCurrentStep() {
  if (queueIndex >= currentQueue.length) return;
  const item = currentQueue[queueIndex];
  const area = document.getElementById('displayArea');
  
  // 현재 글자의 자모들만 표시
  const charJamos = currentQueue.filter(q => q.charIdx === item.charIdx);
  const currentJamoIdx = charJamos.findIndex((q, i) => 
    currentQueue.indexOf(q) === queueIndex
  );
  
  // display area 업데이트 - 현재 글자의 자모들
  area.innerHTML = '';
  charJamos.forEach((q, i) => {
    const box = createCharBox(q.char, q.jamo);
    if (currentQueue.indexOf(q) <= queueIndex) {
      box.classList.add('active');
    }
    area.appendChild(box);
    const svg = box.querySelector('svg');
    if (svg && currentQueue.indexOf(q) <= queueIndex) {
      setTimeout(() => svg.classList.add('visible'), i * 50);
    }
  });
  
  // 문장 내 진행 상태 업데이트
  document.querySelectorAll('.s-char').forEach(s => {
    const idx = parseInt(s.dataset.index);
    s.classList.remove('current', 'written');
    if (idx < item.charIdx) s.classList.add('written');
    else if (idx === item.charIdx) s.classList.add('current');
  });
}

function jumpToChar(charIdx) {
  const firstOfChar = currentQueue.findIndex(q => q.charIdx === charIdx);
  if (firstOfChar >= 0) {
    if (animTimer) { clearTimeout(animTimer); animTimer = null; }
    queueIndex = firstOfChar;
    if (mode === 'auto') autoPlay();
    else showCurrentStep();
  }
}

// 속도 슬라이더
document.getElementById('speedSlider').addEventListener('input', getSpeed);

// 엔터키
document.getElementById('textInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') startWriting();
});

// 초기 실행
startWriting();
</script>
