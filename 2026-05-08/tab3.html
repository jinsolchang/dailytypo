<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Pathways — Seoul</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&family=Black+Han+Sans&family=JetBrains+Mono:wght@300;400&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .poster {
            width: 700px;
            height: 100vh;
            max-height: 100vh;
            background: #1a1a22;
            position: relative;
            overflow: hidden;
            cursor: crosshair;
        }

        canvas#map {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        canvas#routes {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .overlay {
            position: absolute;
            inset: 0;
            z-index: 3;
            display: flex;
            flex-direction: column;
            padding: 2.5rem;
            pointer-events: none;
        }

        .top-row {
            display: flex;
            justify-content: space-between;
        }

        .label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.5rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.25);
        }

        .title-area {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 1.5rem 2.5rem;
            z-index: 4;
            pointer-events: auto;
        }

        .title {
            font-family: 'Black Han Sans', sans-serif;
            font-size: 7rem;
            font-weight: 400;
            line-height: 1;
            color: #fff;
            letter-spacing: -0.02em;
            position: relative;
        }

        .title .char {
            display: inline-block;
            transition: transform 0.3s cubic-bezier(0.2, 0, 0, 1), color 0.3s;
        }

        .title .char:hover {
            transform: translateY(-8px) scale(1.1);
            color: #2ecc40;
        }

        .desc {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.55rem;
            font-weight: 300;
            color: rgba(255,255,255,0.3);
            margin-top: 1rem;
            line-height: 1.8;
        }

        .data-row {
            display: flex;
            gap: 2.5rem;
            margin-top: 1.8rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(255,255,255,0.06);
        }

        .data-value {
            font-family: 'Black Han Sans', sans-serif;
            font-size: 1.5rem;
            font-weight: 400;
            color: #fff;
        }

        .data-unit {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.45rem;
            color: rgba(255,255,255,0.2);
            letter-spacing: 0.1em;
            margin-top: 0.1rem;
        }

        .bottom-row {
            display: flex;
            justify-content: space-between;
            margin-top: 1.2rem;
        }

        .edition {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.4rem;
            color: rgba(255,255,255,0.12);
        }
    </style>
</head>
<body>
    <div class="poster" id="poster">
        <canvas id="map"></canvas>
        <canvas id="routes"></canvas>
        <div class="overlay">
            <div class="top-row">
                <span class="label">37.5665°N 126.9780°E</span>
                <span class="label">2026.05.07</span>
            </div>
        </div>
        <div class="title-area">
            <h1 class="title" id="title">Delivery<br>Hero</h1>
            <div class="bottom-row">
                <span class="label">Seoul Metropolitan</span>
            </div>
        </div>
    </div>

    <script>
        // --- Interactive title ---
        const titleEl = document.getElementById('title');
        const lines = titleEl.innerHTML.split('<br>');
        titleEl.innerHTML = lines.map(line =>
            line.split('').map(c => c === ' ' ? ' ' : `<span class="char">${c}</span>`).join('')
        ).join('<br>');

        const chars = document.querySelectorAll('.title .char');
        const titleColors = ['#2ecc40', '#4da6ff', '#ff69b4', '#ffe14d'];
        chars.forEach((ch, i) => {
            ch.addEventListener('mouseenter', () => {
                ch.style.color = titleColors[i % titleColors.length];
            });
            ch.addEventListener('mouseleave', () => {
                ch.style.color = '#fff';
            });
        });

        // --- Map background ---
        const mapCanvas = document.getElementById('map');
        const mctx = mapCanvas.getContext('2d');
        const W = 700, H = 990;
        mapCanvas.width = W * 2;
        mapCanvas.height = H * 2;
        mctx.scale(2, 2);

        // Draw fake city map
        function drawMap() {
            mctx.clearRect(0, 0, W, H);

            // Major roads
            mctx.strokeStyle = 'rgba(255,255,255,0.04)';
            mctx.lineWidth = 3;
            // Horizontal arteries
            const hRoads = [H * 0.12, H * 0.25, H * 0.38, H * 0.5, H * 0.62];
            hRoads.forEach(y => {
                mctx.beginPath();
                mctx.moveTo(0, y + Math.sin(y * 0.01) * 15);
                mctx.bezierCurveTo(W * 0.3, y - 10, W * 0.7, y + 10, W, y + Math.cos(y * 0.02) * 10);
                mctx.stroke();
            });
            // Vertical arteries
            const vRoads = [W * 0.15, W * 0.3, W * 0.5, W * 0.7, W * 0.85];
            vRoads.forEach(x => {
                mctx.beginPath();
                mctx.moveTo(x + Math.sin(x * 0.01) * 10, 0);
                mctx.bezierCurveTo(x - 8, H * 0.3, x + 8, H * 0.5, x + Math.cos(x * 0.02) * 10, H * 0.7);
                mctx.stroke();
            });

            // Minor roads (grid)
            mctx.strokeStyle = 'rgba(255,255,255,0.018)';
            mctx.lineWidth = 1;
            for (let y = 20; y < H * 0.7; y += 28) {
                mctx.beginPath();
                mctx.moveTo(0, y);
                mctx.lineTo(W, y);
                mctx.stroke();
            }
            for (let x = 20; x < W; x += 32) {
                mctx.beginPath();
                mctx.moveTo(x, 0);
                mctx.lineTo(x, H * 0.7);
                mctx.stroke();
            }

            // City blocks (filled rectangles)
            mctx.fillStyle = 'rgba(255,255,255,0.012)';
            for (let y = 30; y < H * 0.68; y += 56) {
                for (let x = 30; x < W - 30; x += 64) {
                    if (Math.random() > 0.2) {
                        const bw = 40 + Math.random() * 15;
                        const bh = 35 + Math.random() * 12;
                        mctx.fillRect(x, y, bw, bh);
                    }
                }
            }

            // River (curved)
            mctx.strokeStyle = 'rgba(100, 160, 255, 0.04)';
            mctx.lineWidth = 12;
            mctx.beginPath();
            mctx.moveTo(0, H * 0.42);
            mctx.bezierCurveTo(W * 0.25, H * 0.4, W * 0.5, H * 0.44, W, H * 0.41);
            mctx.stroke();
        }
        drawMap();

        // --- Routes ---
        const routeCanvas = document.getElementById('routes');
        const ctx = routeCanvas.getContext('2d');
        routeCanvas.width = W * 2;
        routeCanvas.height = H * 2;
        ctx.scale(2, 2);

        let mx = -999, my = -999;
        const poster = document.getElementById('poster');
        poster.addEventListener('mousemove', e => {
            const r = poster.getBoundingClientRect();
            mx = ((e.clientX - r.left) / r.width) * W;
            my = ((e.clientY - r.top) / r.height) * H;
        });
        poster.addEventListener('mouseleave', () => { mx = -999; my = -999; });

        const colors = ['#2ecc40', '#4da6ff', '#ff69b4', '#ffe14d'];

        function generatePath() {
            const points = [];
            const side = Math.floor(Math.random() * 4);
            let x, y;
            if (side === 0) { x = -5; y = 30 + Math.random() * H * 0.55; }
            else if (side === 1) { x = W + 5; y = 30 + Math.random() * H * 0.55; }
            else if (side === 2) { x = 30 + Math.random() * (W - 60); y = -5; }
            else { x = 30 + Math.random() * (W - 60); y = H * 0.75; }

            let angle = Math.atan2(H * 0.3 - y, W * 0.5 - x) + (Math.random() - 0.5) * 2;
            const totalPoints = 100 + Math.floor(Math.random() * 150);

            for (let i = 0; i < totalPoints; i++) {
                points.push({ x, y });
                const step = 3.5 + Math.random() * 2;
                angle += (Math.random() - 0.5) * 0.5;
                if (Math.random() < 0.06) {
                    angle += (Math.random() > 0.5 ? 1 : -1) * (0.8 + Math.random() * 0.8);
                }
                x += Math.cos(angle) * step;
                y += Math.sin(angle) * step;
                if (x < -20) angle = 0;
                if (x > W + 20) angle = Math.PI;
                if (y < -20) angle = Math.PI * 0.5;
                if (y > H * 0.85) angle = -Math.PI * 0.5;
            }
            return points;
        }

        class Route {
            constructor(colorIdx) {
                this.color = colors[colorIdx];
                this.path = generatePath();
                this.dotSize = (2.5 + Math.random() * 1.5) * 1.3;
                this.trainLength = 8 + Math.floor(Math.random() * 35);
                this.speed = 0.3 + Math.random() * 0.5;
                this.headPos = Math.random() * this.path.length;
                this.spacings = Array.from({ length: 50 }, () => 0.6 + Math.random() * 1.0);
                this.stops = [];
                const numStops = 2 + Math.floor(Math.random() * 3);
                for (let i = 0; i < numStops; i++) {
                    this.stops.push(Math.floor((i + 1) / (numStops + 1) * this.path.length));
                }
            }

            draw() {
                const pathLen = this.path.length;
                if (pathLen < 10) return;

                // Outline
                ctx.beginPath();
                ctx.moveTo(this.path[0].x, this.path[0].y);
                for (let i = 1; i < pathLen; i++) {
                    ctx.lineTo(this.path[i].x, this.path[i].y);
                }
                ctx.strokeStyle = '#000';
                ctx.globalAlpha = 0.4;
                ctx.lineWidth = this.dotSize * 2.8;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.stroke();

                // Main line
                ctx.beginPath();
                ctx.moveTo(this.path[0].x, this.path[0].y);
                for (let i = 1; i < pathLen; i++) {
                    ctx.lineTo(this.path[i].x, this.path[i].y);
                }
                ctx.strokeStyle = this.color;
                ctx.globalAlpha = 0.18;
                ctx.lineWidth = this.dotSize * 2.2;
                ctx.stroke();
                ctx.globalAlpha = 1;

                // Train dots — no transparency, drawn as solid sausage
                this.headPos = (this.headPos + this.speed) % pathLen;

                // Draw outline pass first (black border around entire train)
                ctx.beginPath();
                let accum = 0;
                for (let i = 0; i < this.trainLength; i++) {
                    accum += this.spacings[i % this.spacings.length];
                    let idx = Math.floor(this.headPos - accum);
                    if (idx < 0) idx += pathLen;
                    idx = idx % pathLen;
                    const p = this.path[idx];
                    ctx.moveTo(p.x + this.dotSize + 1.5, p.y);
                    ctx.arc(p.x, p.y, this.dotSize + 1.5, 0, Math.PI * 2);
                }
                ctx.fillStyle = '#000';
                ctx.globalAlpha = 1;
                ctx.fill();

                // Draw fill pass (solid color, no alpha — merges into sausage)
                ctx.beginPath();
                accum = 0;
                for (let i = 0; i < this.trainLength; i++) {
                    accum += this.spacings[i % this.spacings.length];
                    let idx = Math.floor(this.headPos - accum);
                    if (idx < 0) idx += pathLen;
                    idx = idx % pathLen;
                    const p = this.path[idx];
                    ctx.moveTo(p.x + this.dotSize, p.y);
                    ctx.arc(p.x, p.y, this.dotSize, 0, Math.PI * 2);
                }
                ctx.fillStyle = this.color;
                ctx.globalAlpha = 1;
                ctx.fill();
            }
        }

        const routes = [];
        for (let i = 0; i < 60; i++) {
            routes.push(new Route(i % 4));
        }

        // Chaser routes — same dot-chain as background, follows cursor
        class ChaserRoute {
            constructor(colorIdx) {
                this.color = colors[colorIdx];
                this.dotSize = (2.5 + Math.random() * 1.5) * 1.3;
                this.trainLength = 8 + Math.floor(Math.random() * 35);
                this.spacings = Array.from({ length: 50 }, () => 0.6 + Math.random() * 1.0);
                this.speed = 0.5 + Math.random() * 0.8;
                this.alive = true;
                this.path = this.generatePath();
                this.headPos = 0;
            }

            generatePath() {
                const points = [];
                const side = Math.floor(Math.random() * 4);
                let x, y;
                if (side === 0) { x = -5; y = Math.random() * H * 0.8; }
                else if (side === 1) { x = W + 5; y = Math.random() * H * 0.8; }
                else if (side === 2) { x = Math.random() * W; y = -5; }
                else { x = Math.random() * W; y = H * 0.85; }

                const tx = mx > 0 ? mx : W * 0.5;
                const ty = mx > 0 ? my : H * 0.4;
                let angle = Math.atan2(ty - y, tx - x) + (Math.random() - 0.5) * 0.5;
                const totalPoints = 80 + Math.floor(Math.random() * 100);

                for (let i = 0; i < totalPoints; i++) {
                    points.push({ x, y });
                    const step = 3.5 + Math.random() * 2;
                    angle += (Math.random() - 0.5) * 0.4;
                    const targetAngle = Math.atan2(ty - y, tx - x);
                    let diff = targetAngle - angle;
                    while (diff > Math.PI) diff -= Math.PI * 2;
                    while (diff < -Math.PI) diff += Math.PI * 2;
                    angle += diff * 0.03;
                    if (Math.random() < 0.06) {
                        angle += (Math.random() > 0.5 ? 1 : -1) * (0.5 + Math.random() * 0.5);
                    }
                    x += Math.cos(angle) * step;
                    y += Math.sin(angle) * step;
                }
                return points;
            }

            update() {
                this.headPos += this.speed;
                const pathLen = this.path.length;
                if (this.headPos > pathLen + this.trainLength * 2) {
                    this.alive = false;
                }
            }

            draw() {
                const pathLen = this.path.length;
                if (pathLen < 10) return;

                // Dot chain only — same as background routes
                ctx.beginPath();
                let accum = 0;
                for (let i = 0; i < this.trainLength; i++) {
                    accum += this.spacings[i % this.spacings.length];
                    let idx = Math.floor(this.headPos - accum);
                    if (idx < 0 || idx >= pathLen) continue;
                    const p = this.path[idx];
                    ctx.moveTo(p.x + this.dotSize + 1.5, p.y);
                    ctx.arc(p.x, p.y, this.dotSize + 1.5, 0, Math.PI * 2);
                }
                ctx.fillStyle = '#000';
                ctx.globalAlpha = 1;
                ctx.fill();

                ctx.beginPath();
                accum = 0;
                for (let i = 0; i < this.trainLength; i++) {
                    accum += this.spacings[i % this.spacings.length];
                    let idx = Math.floor(this.headPos - accum);
                    if (idx < 0 || idx >= pathLen) continue;
                    const p = this.path[idx];
                    ctx.moveTo(p.x + this.dotSize, p.y);
                    ctx.arc(p.x, p.y, this.dotSize, 0, Math.PI * 2);
                }
                ctx.fillStyle = this.color;
                ctx.globalAlpha = 1;
                ctx.fill();
            }
        }

        const chasers = [];
        let lastSpawn = 0;

        function frame(time) {
            ctx.clearRect(0, 0, W, H);
            routes.forEach(r => r.draw());

            // Cursor indicator
            if (mx > 0) {
                ctx.beginPath();
                ctx.arc(mx, my, 12, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                ctx.lineWidth = 1.5;
                ctx.globalAlpha = 1;
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(mx, my, 3, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.fill();
            }

            // Spawn 6 chasers every 2 seconds
            if (time - lastSpawn > 2000) {
                for (let i = 0; i < 6; i++) {
                    chasers.push(new ChaserRoute(Math.floor(Math.random() * 4)));
                }
                lastSpawn = time;
            }

            for (let i = chasers.length - 1; i >= 0; i--) {
                chasers[i].update();
                chasers[i].draw();
                if (!chasers[i].alive) chasers.splice(i, 1);
            }

            while (chasers.length > 30) chasers.shift();

            requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
    </script>
</body>
</html>
