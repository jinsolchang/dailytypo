<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>5/8 — Newsroom Experiments</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#111;font-family:'Helvetica Neue',sans-serif}
.tabs{display:flex;height:36px;background:#222;border-bottom:1px solid #444}
.tabs button{flex:1;font-size:11px;letter-spacing:.1em;border:none;background:#222;color:#888;cursor:pointer;transition:all .2s}
.tabs button.active{background:#333;color:#fff;border-bottom:2px solid #fff}
.tabs button:hover{color:#ccc}
iframe{width:100%;height:calc(100% - 36px);border:none;display:block}
</style>
</head>
<body>
<div class="tabs">
  <button class="active" data-src="tab1.html">1</button>
  <button data-src="tab2.html">2</button>
  <button data-src="tab3.html">3</button>
</div>
<iframe id="frame" src="tab1.html"></iframe>
<script>
const btns=document.querySelectorAll('.tabs button');
const frame=document.getElementById('frame');
btns.forEach(btn=>{
  btn.addEventListener('click',()=>{
    btns.forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    frame.src=btn.dataset.src;
  });
});
</script>
</body>
</html>
