  <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 12px; color: var(--color-text-secondary);">

    <span style="width: 10px; height: 10px; border-radius: 50%; background: #febc2e;"></span>
    <span style="width: 10px; height: 10px; border-radius: 50%; background: #28c840;"></span>
    <span style="margin-left: 8px;">untitled — Paint</span>
  </div>

  <div style="display: flex; gap: 16px;">
    <!-- 좌측: 파라미터 -->
    <div style="display: flex; flex-direction: column; gap: 12px; min-width: 130px;">
      <div>
        <label style="font-size: 12px; color: var(--color-text-secondary); display: block; margin-bottom: 4px;">굵기</label>
        <input type="range" id="ms-thick" min="1" max="3" value="1" step="1" style="width: 100%;">
        <span id="ms-thick-out" style="font-size: 11px; color: var(--color-text-tertiary);">1</span>
      </div>
      <div>
        <label style="font-size: 12px; color: var(--color-text-secondary); display: block; margin-bottom: 4px;">글자크기</label>
        <input type="range" id="ms-scale" min="20" max="70" value="44" step="2" style="width: 100%;">
        <span id="ms-scale-out" style="font-size: 11px; color: var(--color-text-tertiary);">44</span>
      </div>
      <div>
        <label style="font-size: 12px; color: var(--color-text-secondary); display: block; margin-bottom: 4px;">끊김</label>
        <input type="range" id="ms-break" min="0" max="40" value="2" step="1" style="width: 100%;">
        <span id="ms-break-out" style="font-size: 11px; color: var(--color-text-tertiary);">2%</span>
      </div>
      <div>
        <label style="font-size: 12px; color: var(--color-text-secondary); display: block; margin-bottom: 4px;">떨림</label>
        <input type="range" id="ms-jitter" min="0" max="3" value="1" step="1" style="width: 100%;">

      <div>

      <button id="ms-clear" style="font-size: 12px; margin-top: 8px;">지우기</button>
    </div>

    <!-- 우측: 캔버스 -->
    <div style="flex: 1; background: white; border: 1px solid var(--color-border-secondary); border-radius: 4px; overflow: hidden;">
      <canvas id="ms-canvas" width="660" height="400" style="display: block; width: 100%; height: 400px; cursor: text;"></canvas>
    </div>
  </div>

  <input id="ms-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"

  function rand(n){ return (Math.random() * 2 - 1) * n; }

  function plotLine(x0, y0, x1, y1){
    x0 = Math.round(x0); y0 = Math.round(y0);
    x1 = Math.round(x1); y1 = Math.round(y1);
    const dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1;
    const dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1;
    let err = dx + dy;
    let safety = 0;
    while (safety++ < 5000){
      if (thick === 1){
        ctx.fillRect(x0, y0, 1, 1);
      } else {
        ctx.fillRect(x0 - Math.floor(thick/2), y0 - Math.floor(thick/2), thick, thick);
      }
      if (x0 === x1 && y0 === y1) break;
      const e2 = 2 * err;
      if (e2 >= dy){ err += dy; x0 += sx; }
      if (e2 <= dx){ err += dx; y0 += sy; }
    }
  }

  function buildStrokeSegments(stroke, ox, oy, w, h){
    if (stroke.length < 2) {
      if (stroke.length === 1){
        return [[[ox + stroke[0][0]*w + rand(jitter), oy + stroke[0][1]*h + rand(jitter)]]];
      }
      return [];
    }

    const abs = stroke.map(p => [ox + p[0]*w, oy + p[1]*h]);
    const dense = [abs[0].slice()];
    for (let i = 0; i < abs.length - 1; i++){
      const dx = abs[i+1][0] - abs[i][0];
      const dy = abs[i+1][1] - abs[i][1];
      const L = Math.sqrt(dx*dx + dy*dy);
      const stepSize = 4 + Math.random() * 3;
      const n = Math.max(1, Math.ceil(L / stepSize));
      for (let k = 1; k <= n; k++){
        const t = k / n;
        dense.push([
          abs[i][0] + dx * t + rand(jitter),
          abs[i][1] + dy * t + rand(jitter)
        ]);
      }
    }

    // 끊김 0%면 통째로 한 segment
    if (breakFreq === 0) return [dense];

    const segments = [];
    let current = [dense[0]];
    let breaksUsed = 0;
    const maxBreaks = Math.max(1, Math.floor(dense.length / 10));

    for (let i = 1; i < dense.length; i++){
      const canBreak = i > 2 && i < dense.length - 2 && breaksUsed < maxBreaks && Math.random() * 100 < breakFreq;
      if (canBreak){
        segments.push(current);
        breaksUsed++;
        const skipDist = 1 + Math.random() * 1.5;
        const dx = dense[i][0] - dense[i-1][0];
        const dy = dense[i][1] - dense[i-1][1];
        const L = Math.sqrt(dx*dx + dy*dy) || 1;
        current = [[dense[i][0] + (dx/L)*skipDist, dense[i][1] + (dy/L)*skipDist]];
      } else {
        current.push(dense[i]);
      }
    }
    if (current.length) segments.push(current);
    return segments;
  }

  function animateStroke(segments){
    if (!animEl.checked){
      ctx.fillStyle = color;
      segments.forEach(seg => {
        if (seg.length === 1){
          const p = seg[0];
          if (thick === 1) ctx.fillRect(Math.round(p[0]), Math.round(p[1]), 1, 1);
          else ctx.fillRect(Math.round(p[0]-thick/2), Math.round(p[1]-thick/2), thick, thick);
        } else {
          for (let i = 0; i < seg.length - 1; i++){
            plotLine(seg[i][0], seg[i][1], seg[i+1][0], seg[i+1][1]);
          }
        }
      });
      return;
    }
    const totalPoints = segments.reduce((a, s) => a + s.length, 0);
    const duration = Math.max(80, Math.min(250, totalPoints * 4));
    strokeQueue.push({
      segments, segIdx: 0, pointIdx: 0, totalPoints, drawnPoints: 0,
      start: performance.now(), duration
    });
    if (!rafId) rafId = requestAnimationFrame(tick);
  }

  function tick(now){
    if (strokeQueue.length === 0){ rafId = null; return; }
    const job = strokeQueue[0];
    const elapsed = now - job.start;
    const targetPoints = Math.min(job.totalPoints, Math.floor((elapsed / job.duration) * job.totalPoints));

    ctx.fillStyle = color;
    while (job.drawnPoints < targetPoints && job.segIdx < job.segments.length){
      const seg = job.segments[job.segIdx];
      if (job.pointIdx === 0){
        const p = seg[0];
        if (thick === 1) ctx.fillRect(Math.round(p[0]), Math.round(p[1]), 1, 1);
        else ctx.fillRect(Math.round(p[0]-thick/2), Math.round(p[1]-thick/2), thick, thick);
        job.pointIdx = 1;
        job.drawnPoints++;
      } else if (job.pointIdx < seg.length){
        plotLine(seg[job.pointIdx-1][0], seg[job.pointIdx-1][1], seg[job.pointIdx][0], seg[job.pointIdx][1]);
        job.pointIdx++;
        job.drawnPoints++;
      } else {
        job.segIdx++;
        job.pointIdx = 0;
      }
    }

    if (job.drawnPoints >= job.totalPoints) strokeQueue.shift();
    rafId = requestAnimationFrame(tick);
  }

    'ㅘ': [[[0.4,0.9],[0.4,0.3]], [[0.05,0.3],[0.7,0.3]], [[0.8,0.05],[0.8,0.95]], [[0.8,0.4],[0.95,0.4]]],
    'ㅙ': [[[0.35,0.9],[0.35,0.3]], [[0.05,0.3],[0.55,0.3]], [[0.65,0.05],[0.65,0.95]], [[0.65,0.4],[0.8,0.4]], [[0.9,0.05],[0.9,0.95]]],

    'ㅝ': [[[0.2,0.05],[0.2,0.95]], [[0.2,0.5],[0.5,0.5]], [[0.6,0.95],[0.6,0.35]], [[0.2,0.35],[0.9,0.35]]],
    'ㅞ': [[[0.15,0.05],[0.15,0.95]], [[0.15,0.5],[0.35,0.5]], [[0.45,0.05],[0.45,0.95]], [[0.6,0.95],[0.6,0.35]], [[0.15,0.35],[0.9,0.35]]],
    'ㅟ': [[[0.5,0.95],[0.5,0.35]], [[0.1,0.35],[0.9,0.35]], [[0.7,0.05],[0.7,0.95]]],
    'ㅠ': [[[0.3,0.95],[0.3,0.35]], [[0.7,0.95],[0.7,0.35]], [[0.1,0.35],[0.9,0.35]]],
    'ㅡ': [[[0.05,0.5],[0.95,0.5]]],
    'ㅢ': [[[0.05,0.5],[0.7,0.5]], [[0.8,0.05],[0.8,0.95]]],
    'ㅣ': [[[0.5,0.05],[0.5,0.95]]]
  };

  // 모음 유형: 세로형(오른쪽 배치), 가로형(아래 배치), 복합형
  const VERTICAL_JUNG = [0,1,2,3,4,5,6,7,20]; // ㅏㅐㅑㅒㅓㅔㅕㅖㅣ
  const HORIZONTAL_JUNG = [8,11,12,13,17,18]; // ㅗㅚㅛㅜㅟㅠㅡ
  // 나머지는 복합 (세로+가로)

  function isVerticalVowel(jungIdx){ return VERTICAL_JUNG.includes(jungIdx); }
  function isHorizontalVowel(jungIdx){ return HORIZONTAL_JUNG.includes(jungIdx); }

  function decomposeHangul(ch){
    const code = ch.charCodeAt(0);
    if (code < 0xAC00 || code > 0xD7A3) return null;
    const offset = code - 0xAC00;
    const cho = Math.floor(offset / (21 * 28));
    const jung = Math.floor((offset % (21 * 28)) / 28);
    const jong = offset % 28;
    return { cho, jung, jong };
  }

  function drawHangulChar(ch, startX, startY, w, h){
    const decomp = decomposeHangul(ch);
    if (!decomp) return false;

    const { cho, jung, jong } = decomp;
    const choJamo = CHOSEONG[cho];
    const jungJamo = JUNGSEONG[jung];
    const jongJamo = jong > 0 ? JONGSEONG[jong] : null;

    const choStrokes = JAMO[choJamo];
    const jungStrokes = JAMO[jungJamo];
    const jongStrokes = jongJamo ? (JAMO[jongJamo] || null) : null;

    if (!choStrokes || !jungStrokes) return false;

    const hasJong = !!jongStrokes;
    const isVert = isVerticalVowel(jung);
    const isHoriz = isHorizontalVowel(jung);

    // 레이아웃 계산 (초성/중성/종성 배치 영역)
    let choBox, jungBox, jongBox;

    if (isVert){
      if (hasJong){
        choBox = { x: 0, y: 0, w: 0.55, h: 0.55 };
        jungBox = { x: 0.58, y: 0, w: 0.42, h: 0.55 };
        jongBox = { x: 0.05, y: 0.6, w: 0.9, h: 0.4 };
      } else {
        choBox = { x: 0, y: 0.05, w: 0.55, h: 0.9 };
        jungBox = { x: 0.58, y: 0.05, w: 0.42, h: 0.9 };
      }
    } else if (isHoriz){
      if (hasJong){
        choBox = { x: 0.15, y: 0, w: 0.7, h: 0.45 };
        jungBox = { x: 0.05, y: 0.47, w: 0.9, h: 0.25 };
        jongBox = { x: 0.15, y: 0.73, w: 0.7, h: 0.27 };
      } else {
        choBox = { x: 0.15, y: 0, w: 0.7, h: 0.55 };
        jungBox = { x: 0.05, y: 0.58, w: 0.9, h: 0.4 };
      }
    } else {
      // 복합 모음
      if (hasJong){
        choBox = { x: 0, y: 0, w: 0.5, h: 0.45 };
        jungBox = { x: 0, y: 0, w: 1, h: 0.6 };
        jongBox = { x: 0.05, y: 0.65, w: 0.9, h: 0.35 };
      } else {
        choBox = { x: 0, y: 0, w: 0.5, h: 0.55 };
        jungBox = { x: 0, y: 0, w: 1, h: 0.95 };
      }
    }

    // 초성 그리기
    choStrokes.forEach(s => {
      const mapped = s.map(p => [
        choBox.x + p[0] * choBox.w,
        choBox.y + p[1] * choBox.h
      ]);
      const segments = buildStrokeSegments(mapped, startX, startY, w, h);
      animateStroke(segments);
    });

    // 중성 그리기
    jungStrokes.forEach(s => {
      const mapped = s.map(p => [
        jungBox.x + p[0] * jungBox.w,
        jungBox.y + p[1] * jungBox.h
      ]);
      const segments = buildStrokeSegments(mapped, startX, startY, w, h);
      animateStroke(segments);
    });

    // 종성 그리기
    if (jongStrokes && jongBox){
      jongStrokes.forEach(s => {
        const mapped = s.map(p => [
          jongBox.x + p[0] * jongBox.w,
          jongBox.y + p[1] * jongBox.h
        ]);
        const segments = buildStrokeSegments(mapped, startX, startY, w, h);
        animateStroke(segments);
      });
    }

    return true;
  }

  function drawChar(ch){
    if (ch === '\n'){
      cursor.x = 12;
      cursor.y += scale + Math.round(scale * 0.35);
      history.push({type:'newline'});
      return;
    }
    let strokes = G[ch] || G[ch.toUpperCase()];
    const code = ch.charCodeAt(0);
    const isHangul = code >= 0xAC00 && code <= 0xD7A3;
    const isKnown = !!strokes;
    const w = Math.round(scale * (isKnown ? 0.6 : 0.85));
    const h = scale;
    const space = Math.round(scale * 0.2);

    if (cursor.x + w > W - 12){
      cursor.x = 12;
      cursor.y += scale + Math.round(scale * 0.35);
    }
    if (cursor.y + h > H - 12) return;

    const startX = cursor.x;
    const startY = cursor.y;

    if (isHangul){
      drawHangulChar(ch, startX, startY, w, h);
    } else if (strokes){
      strokes.forEach(s => {
        const segments = buildStrokeSegments(s, startX, startY, w, h);
        animateStroke(segments);
      });
    } else {
      // 기타 미등록 문자: 사각형 fallback
      const fb = [[[0.1,0.2],[0.9,0.2],[0.9,0.9],[0.1,0.9],[0.1,0.2]]];
      fb.forEach(s => {
        const segments = buildStrokeSegments(s, startX, startY, w, h);
        animateStroke(segments);
      });
    }

    history.push({type:'char', x: startX - 4, y: startY - 6, w: w + space + 8, h: h * 1.5});
    cursor.x += w + space;
  }

  function backspace(){
    if (!history.length) return;
    strokeQueue.length = 0;
    if (rafId){ cancelAnimationFrame(rafId); rafId = null; }
    const last = history.pop();
    if (last.type === 'newline'){
      cursor.y -= scale + Math.round(scale * 0.35);
      let x = 12;
      for (let i = history.length - 1; i >= 0; i--){
        if (history[i].type === 'newline') break;
        if (history[i].type === 'char'){ x = history[i].x + history[i].w - 4; }
      }
      cursor.x = Math.max(12, x);
      return;
    }
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(last.x, last.y, last.w, last.h);
    cursor.x = last.x + 4;
    cursor.y = last.y + 6;
  }

  canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const sx = W / rect.width;
    const sy = H / rect.height;
    cursor.x = Math.max(12, Math.floor((e.clientX - rect.left) * sx));
    cursor.y = Math.max(12, Math.floor((e.clientY - rect.top) * sy));
    input.focus();
  });

  let composing = false;
  input.addEventListener('compositionstart', () => { composing = true; });
  input.addEventListener('compositionend', (e) => {
    composing = false;
    for (const ch of e.data) drawChar(ch);
    e.target.value = '';
  });
  input.addEventListener('input', (e) => {
    if (composing) return; // IME 조합 중에는 무시
    for (const ch of e.target.value) drawChar(ch);
    e.target.value = '';
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter'){ e.preventDefault(); drawChar('\n'); }
    else if (e.key === 'Backspace'){ e.preventDefault(); backspace(); }
  });

  thickEl.addEventListener('input', () => { thick = parseInt(thickEl.value,10); thickOut.textContent = thick; });
  scaleEl.addEventListener('input', () => { scale = parseInt(scaleEl.value,10); scaleOut.textContent = scale; });
  breakEl.addEventListener('input', () => { breakFreq = parseInt(breakEl.value,10); breakOut.textContent = breakFreq + '%'; });
  jitterEl.addEventListener('input', () => { jitter = parseInt(jitterEl.value,10); jitterOut.textContent = jitter; });
  clearBtn.addEventListener('click', () => {
    strokeQueue.length = 0;
    if (rafId){ cancelAnimationFrame(rafId); rafId = null; }
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);
    cursor = { x: 12, y: 12 };
    history = [];
    input.focus();
  });

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);
  ['안','녕','하','세','요',' ','H','e','l','l','o','!'].forEach(drawChar);
  drawChar('\n');

  setTimeout(() => input.focus(), 100);
})();
