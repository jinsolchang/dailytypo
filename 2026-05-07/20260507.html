    <span style="margin-left: 8px;">untitled — Paint</span>
  </div>

    <label style="font-size: 13px; color: var(--color-text-secondary);">굵기</label>
    <input type="range" id="ms-thick" min="1" max="3" value="1" step="1" style="width: 60px;">
    <span id="ms-thick-out" style="font-size: 13px; min-width: 14px;">1</span>

    <label style="font-size: 13px; color: var(--color-text-secondary);">떨림</label>

    <label style="font-size: 13px; color: var(--color-text-secondary);"><input type="checkbox" id="ms-anim" checked> 애니메이션</label>

    <div id="ms-palette" style="display: flex; gap: 4px;"></div>

    <button id="ms-clear" style="margin-left: auto; font-size: 12px;">지우기</button>
  </div>

  <div style="background: white; border: 1px solid var(--color-border-secondary); border-radius: 4px; overflow: hidden;">

  </div>

  <input id="ms-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
    style="position: absolute; opacity: 0; pointer-events: none; width: 1px; height: 1px;">

    끊김 0% = 완전 연속선 · 올리면 마우스 떼는 자국 추가

</div>

  function rand(n){ return (Math.random() * 2 - 1) * n; }

  function plotLine(x0, y0, x1, y1){
    x0 = Math.round(x0); y0 = Math.round(y0);
    x1 = Math.round(x1); y1 = Math.round(y1);
    const dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1;
    const dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1;
    let err = dx + dy;
    let safety = 0;
    while (safety++ < 5000){
      if (thick === 1){
        ctx.fillRect(x0, y0, 1, 1);
      } else {
        ctx.fillRect(x0 - Math.floor(thick/2), y0 - Math.floor(thick/2), thick, thick);
      }
      if (x0 === x1 && y0 === y1) break;
      const e2 = 2 * err;
      if (e2 >= dy){ err += dy; x0 += sx; }
      if (e2 <= dx){ err += dx; y0 += sy; }
    }
  }

  function buildStrokeSegments(stroke, ox, oy, w, h){
    if (stroke.length < 2) {
      if (stroke.length === 1){
        return [[[ox + stroke[0][0]*w + rand(jitter), oy + stroke[0][1]*h + rand(jitter)]]];
      }
      return [];
    }

    const abs = stroke.map(p => [ox + p[0]*w, oy + p[1]*h]);
    const dense = [abs[0].slice()];
    for (let i = 0; i < abs.length - 1; i++){
      const dx = abs[i+1][0] - abs[i][0];
      const dy = abs[i+1][1] - abs[i][1];
      const L = Math.sqrt(dx*dx + dy*dy);
      const stepSize = 4 + Math.random() * 3;
      const n = Math.max(1, Math.ceil(L / stepSize));
      for (let k = 1; k <= n; k++){
        const t = k / n;
        dense.push([
          abs[i][0] + dx * t + rand(jitter),
          abs[i][1] + dy * t + rand(jitter)
        ]);
      }
    }

    // 끊김 0%면 통째로 한 segment
    if (breakFreq === 0) return [dense];

    const segments = [];
    let current = [dense[0]];
    let breaksUsed = 0;
    const maxBreaks = Math.max(1, Math.floor(dense.length / 10));

    for (let i = 1; i < dense.length; i++){
      const canBreak = i > 2 && i < dense.length - 2 && breaksUsed < maxBreaks && Math.random() * 100 < breakFreq;
      if (canBreak){
        segments.push(current);
        breaksUsed++;
        const skipDist = 1 + Math.random() * 1.5;
        const dx = dense[i][0] - dense[i-1][0];
        const dy = dense[i][1] - dense[i-1][1];
        const L = Math.sqrt(dx*dx + dy*dy) || 1;
        current = [[dense[i][0] + (dx/L)*skipDist, dense[i][1] + (dy/L)*skipDist]];
      } else {
        current.push(dense[i]);
      }
    }
    if (current.length) segments.push(current);
    return segments;
  }

  function animateStroke(segments){
    if (!animEl.checked){
      ctx.fillStyle = color;
      segments.forEach(seg => {
        if (seg.length === 1){
          const p = seg[0];
          if (thick === 1) ctx.fillRect(Math.round(p[0]), Math.round(p[1]), 1, 1);
          else ctx.fillRect(Math.round(p[0]-thick/2), Math.round(p[1]-thick/2), thick, thick);
        } else {
          for (let i = 0; i < seg.length - 1; i++){
            plotLine(seg[i][0], seg[i][1], seg[i+1][0], seg[i+1][1]);
          }
        }
      });
      return;
    }
    const totalPoints = segments.reduce((a, s) => a + s.length, 0);
    const duration = Math.max(80, Math.min(250, totalPoints * 4));
    strokeQueue.push({
      segments, segIdx: 0, pointIdx: 0, totalPoints, drawnPoints: 0,
      start: performance.now(), duration
    });
    if (!rafId) rafId = requestAnimationFrame(tick);
  }

  function tick(now){
    if (strokeQueue.length === 0){ rafId = null; return; }
    const job = strokeQueue[0];
    const elapsed = now - job.start;
    const targetPoints = Math.min(job.totalPoints, Math.floor((elapsed / job.duration) * job.totalPoints));

    ctx.fillStyle = color;
    while (job.drawnPoints < targetPoints && job.segIdx < job.segments.length){
      const seg = job.segments[job.segIdx];
      if (job.pointIdx === 0){
        const p = seg[0];
        if (thick === 1) ctx.fillRect(Math.round(p[0]), Math.round(p[1]), 1, 1);
        else ctx.fillRect(Math.round(p[0]-thick/2), Math.round(p[1]-thick/2), thick, thick);
        job.pointIdx = 1;
        job.drawnPoints++;
      } else if (job.pointIdx < seg.length){
        plotLine(seg[job.pointIdx-1][0], seg[job.pointIdx-1][1], seg[job.pointIdx][0], seg[job.pointIdx][1]);
        job.pointIdx++;
        job.drawnPoints++;
      } else {
        job.segIdx++;
        job.pointIdx = 0;
      }
    }

    if (job.drawnPoints >= job.totalPoints) strokeQueue.shift();
    rafId = requestAnimationFrame(tick);
  }

  // 한글 등 미등록 글자: 캔버스 폰트 렌더링으로 직접 그리기
  const offCanvas = document.createElement('canvas');
  const offCtx = offCanvas.getContext('2d', {willReadFrequently: true});

  function drawFontChar(ch, startX, startY, w, h){
    const renderScale = 2; // 고해상도 렌더링 후 축소
    const rw = w * renderScale, rh = h * renderScale;
    offCanvas.width = rw; offCanvas.height = rh;
    offCtx.clearRect(0, 0, rw, rh);
    offCtx.fillStyle = '#000';
    offCtx.font = `900 ${Math.round(rh * 0.78)}px "Noto Sans KR", sans-serif`;
    offCtx.textBaseline = 'top';
    offCtx.textAlign = 'center';
    offCtx.fillText(ch, rw / 2, Math.round(rh * 0.1));

    const imgData = offCtx.getImageData(0, 0, rw, rh);
    const d = imgData.data;

    // 메인 캔버스에 픽셀 단위로 전사 (떨림 적용)
    ctx.fillStyle = color;
    const stepX = renderScale;
    const stepY = renderScale;
    for (let sy = 0; sy < rh; sy += stepY){
      for (let sx = 0; sx < rw; sx += stepX){
        const idx = (sy * rw + sx) * 4;
        if (d[idx + 3] < 128) continue;
        const px = startX + Math.round(sx / renderScale) + rand(jitter * 0.3);
        const py = startY + Math.round(sy / renderScale) + rand(jitter * 0.3);
        if (thick === 1){
          ctx.fillRect(px, py, 1, 1);
        } else {
          ctx.fillRect(px, py, thick, thick);
        }
      }
    }
  }

  function drawChar(ch){
    if (ch === '\n'){
      cursor.x = 12;
      cursor.y += scale + Math.round(scale * 0.35);
      history.push({type:'newline'});
      return;
    }
    let strokes = G[ch] || G[ch.toUpperCase()];
    const isKnown = !!strokes;
    const w = Math.round(scale * (isKnown ? 0.6 : 0.85));
    const h = scale;
    const space = Math.round(scale * 0.2);

    if (cursor.x + w > W - 12){
      cursor.x = 12;
      cursor.y += scale + Math.round(scale * 0.35);
    }
    if (cursor.y + h > H - 12) return;

    const startX = cursor.x;
    const startY = cursor.y;

    if (!strokes){
      // 한글 등 미등록 글자: 폰트 직접 렌더링
      drawFontChar(ch, startX, startY, w, h);
    } else {
      strokes.forEach(s => {
        const segments = buildStrokeSegments(s, startX, startY, w, h);
        animateStroke(segments);
      });
    }

    history.push({type:'char', x: startX - 4, y: startY - 6, w: w + space + 8, h: h * 1.5});
    cursor.x += w + space;
  }

  function backspace(){
    if (!history.length) return;
    strokeQueue.length = 0;
    if (rafId){ cancelAnimationFrame(rafId); rafId = null; }
    const last = history.pop();
    if (last.type === 'newline'){
      cursor.y -= scale + Math.round(scale * 0.35);
      let x = 12;
      for (let i = history.length - 1; i >= 0; i--){
        if (history[i].type === 'newline') break;
        if (history[i].type === 'char'){ x = history[i].x + history[i].w - 4; }
      }
      cursor.x = Math.max(12, x);
      return;
    }
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(last.x, last.y, last.w, last.h);
    cursor.x = last.x + 4;
    cursor.y = last.y + 6;
  }

  canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const sx = W / rect.width;
    const sy = H / rect.height;
    cursor.x = Math.max(12, Math.floor((e.clientX - rect.left) * sx));
    cursor.y = Math.max(12, Math.floor((e.clientY - rect.top) * sy));
    input.focus();
  });

  input.addEventListener('input', (e) => {
    for (const ch of e.target.value) drawChar(ch);
    e.target.value = '';
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter'){ e.preventDefault(); drawChar('\n'); }
    else if (e.key === 'Backspace'){ e.preventDefault(); backspace(); }
  });

  thickEl.addEventListener('input', () => { thick = parseInt(thickEl.value,10); thickOut.textContent = thick; });
  scaleEl.addEventListener('input', () => { scale = parseInt(scaleEl.value,10); scaleOut.textContent = scale; });
  breakEl.addEventListener('input', () => { breakFreq = parseInt(breakEl.value,10); breakOut.textContent = breakFreq + '%'; });
  jitterEl.addEventListener('input', () => { jitter = parseInt(jitterEl.value,10); jitterOut.textContent = jitter; });
  clearBtn.addEventListener('click', () => {
    strokeQueue.length = 0;
    if (rafId){ cancelAnimationFrame(rafId); rafId = null; }
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);
    cursor = { x: 12, y: 12 };
    history = [];
    input.focus();
  });

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);
  ['안','녕','하','세','요',' ','H','e','l','l','o','!'].forEach(drawChar);
  drawChar('\n');

  setTimeout(() => input.focus(), 100);
})();
</script>
