<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Letter Domino</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400;1,500&family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap');
  
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  :root {
    --paper: #efe9d8;
    --paper-dark: #ddd5be;
    --ink: #2a2620;
    --ink-light: #5a5247;
    --accent: #6b5b3f;
  }
  
  body {
    font-family: 'EB Garamond', 'Cormorant Garamond', Georgia, serif;
    background: var(--paper);
    background-image: 
      linear-gradient(rgba(120, 100, 70, 0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120, 100, 70, 0.06) 1px, transparent 1px);
    background-size: 24px 24px;
    min-height: 100vh;
    overflow: hidden;
    color: var(--ink);
    user-select: none;
  }
  
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: 
      radial-gradient(ellipse at center, transparent 0%, rgba(80, 60, 40, 0.08) 100%),
      url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/%3E%3CfeColorMatrix values='0 0 0 0 0.3 0 0 0 0 0.25 0 0 0 0 0.18 0 0 0 0.09 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 1;
  }
  
  .corner-note {
    position: fixed;
    top: 24px;
    left: 24px;
    z-index: 100;
    font-style: italic;
    font-size: 13px;
    color: var(--ink-light);
    line-height: 1.4;
    max-width: 180px;
  }
  
  .corner-note .dash { letter-spacing: 2px; }
  
  .stones-counter {
    position: fixed;
    top: 24px;
    right: 24px;
    z-index: 100;
    font-style: italic;
    font-size: 14px;
    border: 1.5px solid var(--ink);
    padding: 8px 16px;
    background: var(--paper);
    box-shadow: 3px 3px 0 var(--ink);
  }
  
  .stones-counter .dot {
    margin: 0 4px;
    color: var(--accent);
  }
  
  .header {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    text-align: center;
    width: 90%;
    max-width: 600px;
  }
  
  .title {
    font-size: 32px;
    font-style: italic;
    font-weight: 600;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
  }
  
  .title svg {
    width: 24px;
    height: 24px;
  }
  
  .subtitle {
    font-style: italic;
    font-size: 15px;
    color: var(--ink-light);
    margin-top: 2px;
  }
  
  .ornament {
    margin: 6px 0 12px;
    color: var(--ink-light);
    letter-spacing: 8px;
    font-size: 14px;
  }
  
  .control-frame {
    border: 1.5px solid var(--ink);
    background: var(--paper);
    padding: 10px 14px;
    display: inline-flex;
    align-items: center;
    gap: 14px;
    box-shadow: 4px 4px 0 var(--ink);
    margin: 0 auto;
  }
  
  .instruction {
    font-style: italic;
    font-size: 14px;
    color: var(--ink-light);
    letter-spacing: 0.3px;
  }
  
  /* 한글 IME 입력 받기 위한 숨겨진 input - 화면엔 안 보이지만 포커스는 받음 */
  #hiddenInput {
    position: fixed;
    top: -100px;
    left: -100px;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
    border: none;
    background: transparent;
  }
  
  .vbtn {
    border: 1.5px solid var(--ink);
    background: var(--paper);
    font-family: inherit;
    font-style: italic;
    font-size: 15px;
    color: var(--ink);
    padding: 6px 18px;
    cursor: pointer;
    transition: all 0.1s;
  }
  
  .vbtn:hover {
    background: var(--ink);
    color: var(--paper);
  }
  
  .vbtn:active {
    transform: translate(1px, 1px);
  }
  
  .vbtn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  
  .stage-wrap {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
  }
  
  .stage {
    position: absolute;
    top: 0;
    left: 0;
    width: 0;
    height: 0;
    transform-origin: 0 0;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    pointer-events: auto;
  }
  
  /* 도미노 SVG */
  .domino-svg {
    position: absolute;
    cursor: pointer;
    transform-origin: var(--ox) var(--oy);
    will-change: transform;
    overflow: visible;
  }
  
  .domino-svg.appearing {
    animation: appear 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  
  @keyframes appear {
    0% { opacity: 0; transform: translateY(-20px) scale(0.9); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  
  .domino-svg:hover .face-front {
    fill: #f5efde;
  }
  
  .hint {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    font-style: italic;
    font-size: 14px;
    color: var(--ink-light);
    pointer-events: none;
    z-index: 50;
    background: var(--paper);
    padding: 6px 16px;
    border: 1px solid var(--ink-light);
    transition: opacity 0.3s;
  }
  
  .hint.hidden { opacity: 0; }
  
  /* 먼지 */
  .dust {
    position: absolute;
    background: var(--ink-light);
    border-radius: 50%;
    pointer-events: none;
    will-change: transform, opacity;
    z-index: 200;
  }
  
  /* 피날레 - 정렬되는 글자들 */
  .finale-letter {
    position: fixed;
    font-family: 'EB Garamond', Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 56px;
    color: var(--ink);
    pointer-events: none;
    z-index: 50;
    will-change: left, top, transform, opacity;
    text-shadow: 0 1px 2px rgba(0,0,0,0.05);
    line-height: 1;
  }
  
  @media (max-width: 700px) {
    .title { font-size: 22px; }
    .subtitle { font-size: 12px; }
    .instruction { font-size: 11px; }
    .control-frame { gap: 8px; padding: 8px 10px; }
    .vbtn { font-size: 13px; padding: 5px 12px; }
    .corner-note { font-size: 11px; max-width: 120px; top: 12px; left: 12px; }
    .stones-counter { font-size: 12px; padding: 6px 10px; top: 12px; right: 12px; }
    .header { top: 12px; }
  }
</style>
</head>
<body>

<div class="corner-note">
  <div class="dash">— A small diversion —</div>
  <div>type to summon stones,</div>
  <div>press enter to topple them</div>
</div>

<div class="stones-counter">
  <span style="font-style:italic">stones</span>
  <span class="dot">·</span>
  <span id="stoneCount">0</span>
</div>

<div class="header">
  <div class="title">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 L14 8 L20 8 L15 12 L17 18 L12 14 L7 18 L9 12 L4 8 L10 8 Z" opacity="0.6"/></svg>
    <span>Letter Domino</span>
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 L14 8 L20 8 L15 12 L17 18 L12 14 L7 18 L9 12 L4 8 L10 8 Z" opacity="0.6"/></svg>
  </div>
  <div class="subtitle">a curious mechanical diversion</div>
  <div class="ornament">✦ · ✦ · ✦</div>
  <div class="control-frame">
    <span class="instruction">type to inscribe · backspace to undo · enter to topple</span>
    <button class="vbtn" onclick="clearAll()">clear</button>
  </div>
</div>

<!-- 한글 IME 입력을 받기 위한 숨겨진 입력창 -->
<input type="text" id="hiddenInput" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">

<div class="stage-wrap">
  <div class="stage" id="stage"></div>
</div>

<div class="hint hidden" id="hint">click stones · or press enter to topple all ✦</div>

<script>
  // ==========================================
  // 아이소메트릭 글자 도미노
  // ==========================================
  
  const stage = document.getElementById('stage');
  const hiddenInput = document.getElementById('hiddenInput');
  const stoneCount = document.getElementById('stoneCount');
  const hint = document.getElementById('hint');
  
  // 아이소메트릭 변환 (각도 30도)
  // 도미노는 3D 박스: 폭(W) × 높이(H) × 두께(D)
  // 카메라는 오른쪽-위에서 비스듬히 봄
  const ISO_ANGLE = 30 * Math.PI / 180;
  const COS = Math.cos(ISO_ANGLE);
  const SIN = Math.sin(ISO_ANGLE);
  
  // 월드 좌표 (x: 진행 방향, y: 세로(중력), z: 깊이)를 화면 좌표로 변환
  function worldToScreen(x, y, z) {
    // 표준 아이소메트릭 투영 (z축이 화면에서 뒤로)
    const sx = (x - z) * COS;
    const sy = y + (x + z) * SIN;
    return { x: sx, y: sy };
  }
  
  let dominos = [];
  let path = []; // 도미노들이 놓일 경로 (x, z 좌표)
  let scale = 1;
  let stageOffsetX = 0;
  let stageOffsetY = 0;
  
  // 도미노 크기 (월드 단위)
  const DOMINO_W = 50;   // 폭 (진행 방향과 수직)
  const DOMINO_H = 90;   // 높이
  const DOMINO_D = 16;   // 두께 (진행 방향)
  const SPACING = 26;    // 도미노 간격 (진행 방향, 두께보다 살짝 큼)
  
  // === 사운드 ===
  let audioCtx = null;
  function getAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  
  function playKnock(pitch = 1, volume = 1) {
    try {
      const ctx = getAudio();
      const now = ctx.currentTime;
      
      // 청아한 톡! 사운드 - 종/실로폰 느낌
      // 짧은 클릭 노이즈 (충돌 어택) - 고역 위주로 짧게
      const buf = ctx.createBuffer(1, ctx.sampleRate * 0.015, ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < data.length; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 4);
      }
      const noise = ctx.createBufferSource();
      noise.buffer = buf;
      const nFilter = ctx.createBiquadFilter();
      nFilter.type = 'highpass';
      nFilter.frequency.value = 4000;
      const nGain = ctx.createGain();
      nGain.gain.setValueAtTime(0.15 * volume, now);
      nGain.gain.exponentialRampToValueAtTime(0.001, now + 0.02);
      noise.connect(nFilter); nFilter.connect(nGain); nGain.connect(ctx.destination);
      noise.start(now);
      
      // 메인 톤 - 고음역 sine wave (실로폰/종) 
      // 기본 주파수 ~880Hz (A5) ~ 1320Hz (E6) 사이를 pitch로 흔듦
      const baseFreq = 880 * pitch;
      const osc1 = ctx.createOscillator();
      osc1.type = 'sine';
      osc1.frequency.setValueAtTime(baseFreq, now);
      const g1 = ctx.createGain();
      g1.gain.setValueAtTime(0, now);
      g1.gain.linearRampToValueAtTime(0.35 * volume, now + 0.003); // 빠른 어택
      g1.gain.exponentialRampToValueAtTime(0.001, now + 0.5);       // 길게 울리는 릴리즈
      osc1.connect(g1); g1.connect(ctx.destination);
      osc1.start(now); osc1.stop(now + 0.55);
      
      // 하모닉 - 3배음(완전5도+1옥타브) sine으로 청아함 더하기
      const osc2 = ctx.createOscillator();
      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(baseFreq * 3, now);
      const g2 = ctx.createGain();
      g2.gain.setValueAtTime(0, now);
      g2.gain.linearRampToValueAtTime(0.1 * volume, now + 0.002);
      g2.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
      osc2.connect(g2); g2.connect(ctx.destination);
      osc2.start(now); osc2.stop(now + 0.3);
      
      // 옥타브 위 살짝 - 반짝이는 셔머
      const osc3 = ctx.createOscillator();
      osc3.type = 'sine';
      osc3.frequency.setValueAtTime(baseFreq * 2, now);
      const g3 = ctx.createGain();
      g3.gain.setValueAtTime(0, now);
      g3.gain.linearRampToValueAtTime(0.15 * volume, now + 0.003);
      g3.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
      osc3.connect(g3); g3.connect(ctx.destination);
      osc3.start(now); osc3.stop(now + 0.45);
    } catch(e) { console.warn(e); }
  }
  
  // 정렬 피날레 사운드 - 짠! 하는 마무리 (하프/글로켄슈필 느낌의 화음)
  function playFinaleChime() {
    try {
      const ctx = getAudio();
      const now = ctx.currentTime;
      
      // 메이저 화음 음 (C-E-G-C 옥타브) - 살짝 시간차로 아르페지오
      const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
      notes.forEach((freq, i) => {
        const t = now + i * 0.06;
        const osc = ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, t);
        const g = ctx.createGain();
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(0.25, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.001, t + 1.2);
        osc.connect(g); g.connect(ctx.destination);
        osc.start(t); osc.stop(t + 1.3);
        
        // 셔머 옥타브
        const osc2 = ctx.createOscillator();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(freq * 2, t);
        const g2 = ctx.createGain();
        g2.gain.setValueAtTime(0, t);
        g2.gain.linearRampToValueAtTime(0.08, t + 0.005);
        g2.gain.exponentialRampToValueAtTime(0.001, t + 0.8);
        osc2.connect(g2); g2.connect(ctx.destination);
        osc2.start(t); osc2.stop(t + 0.85);
      });
    } catch(e) { console.warn(e); }
  }
  
  // === 경로 생성 ===
  // 도미노 N번째가 놓일 (worldX, worldZ) 좌표를 생성.
  // 핵심: 인접 도미노 간 거리(호 길이)가 항상 SPACING이 되도록 누적 계산.
  // 진행 방향각 θ(idx)를 정의하고, 점은 (x[i+1], z[i+1]) = (x[i], z[i]) + SPACING * (cos θ, sin θ)
  
  let pathSeed = Math.random();
  let pathType = 'wave';
  
  // 캐시: 호 길이 기반이라 매번 누적 계산하면 비싸니까 idx별로 캐싱
  let pathCache = []; // [{worldX, worldZ}]
  
  // idx 위치에서의 진행 방향각 (라디안). 화면 비율과 도미노 수에 맞춰 휘어지는 정도 조절
  function pathAngleAt(idx) {
    if (pathType === 'straight') {
      return 0;
    } else if (pathType === 'wave') {
      const period = 22; 
      const ampDeg = 28;
      return Math.sin(idx / period * Math.PI * 2 + pathSeed * Math.PI * 2) * ampDeg * Math.PI / 180;
    } else if (pathType === 'scurve') {
      const period = 30;
      const ampDeg = 38;
      return Math.sin(idx / period * Math.PI * 2 + pathSeed * Math.PI * 2) * ampDeg * Math.PI / 180;
    } else if (pathType === 'zigzag') {
      const period = 18;
      const ampDeg = 35;
      const phase = idx / period * Math.PI * 2 + pathSeed * Math.PI * 2;
      const s = Math.sin(phase);
      const sharp = Math.sign(s) * Math.pow(Math.abs(s), 0.5);
      return sharp * ampDeg * Math.PI / 180;
    }
    return 0;
  }
  
  function generatePathPoint(idx) {
    // 캐시 확인
    if (pathCache[idx]) return pathCache[idx];
    
    if (idx === 0) {
      const p = { worldX: 0, worldZ: 0 };
      pathCache[0] = p;
      return p;
    }
    
    // 이전 점 + SPACING만큼 진행각 방향으로 이동
    const prev = generatePathPoint(idx - 1);
    const angle = pathAngleAt(idx - 1);
    const p = {
      worldX: prev.worldX + SPACING * Math.cos(angle),
      worldZ: prev.worldZ + SPACING * Math.sin(angle)
    };
    pathCache[idx] = p;
    return p;
  }
  
  // 진행 방향 각도 (도미노가 경로 방향에 수직으로 서도록)
  function getDirectionAngle(idx) {
    if (idx === 0) {
      // 첫 도미노는 0번→1번 방향
      return pathAngleAt(0);
    }
    // idx-1 → idx 방향각
    return pathAngleAt(idx - 1);
  }
  
  // === 도미노 SVG 생성 ===
  // 아이소메트릭 박스 - 진행 방향(direction)을 따라 도미노가 서있음
  // 도미노의 "폭(넓은 면)"이 진행 방향과 수직이 되도록
  // 진행 방향 단위 벡터: (cos a, sin a) (월드 평면 xz)
  // 도미노 폭 방향: (-sin a, cos a)
  // 도미노 높이 방향: (0, 1, 0) - y축
  
  function createDominoSVG(char, idx, total) {
    const point = generatePathPoint(idx);
    const angle = getDirectionAngle(idx);
    
    // 도미노 박스의 8개 꼭짓점 (월드 좌표)
    // 중심점 (point.worldX, 0, point.worldZ)에서 출발
    const cx = point.worldX;
    const cz = point.worldZ;
    
    // 진행방향 (두께 D 방향) 단위벡터
    const dx = Math.cos(angle), dz = Math.sin(angle);
    // 폭 방향 (W 방향)
    const wx = -Math.sin(angle), wz = Math.cos(angle);
    
    // 도미노 박스 꼭짓점 (서있을 때) - 아래면 4개, 윗면 4개
    // 박스 중심을 (cx, H/2, cz)에 두고 W, H, D 방향으로 ±0.5씩 확장
    const halfW = DOMINO_W / 2;
    const halfD = DOMINO_D / 2;
    
    // 8 corners: 아래(y=0) 4개 + 위(y=H) 4개
    // p1: -W -D, p2: +W -D, p3: +W +D, p4: -W +D (아래)
    // p5~p8 (위)
    const corners3D = [
      [cx - wx*halfW - dx*halfD, 0, cz - wz*halfW - dz*halfD], // 0: 아래-앞-왼
      [cx + wx*halfW - dx*halfD, 0, cz + wz*halfW - dz*halfD], // 1: 아래-앞-오
      [cx + wx*halfW + dx*halfD, 0, cz + wz*halfW + dz*halfD], // 2: 아래-뒤-오
      [cx - wx*halfW + dx*halfD, 0, cz - wz*halfW + dz*halfD], // 3: 아래-뒤-왼
      [cx - wx*halfW - dx*halfD, DOMINO_H, cz - wz*halfW - dz*halfD], // 4: 위-앞-왼
      [cx + wx*halfW - dx*halfD, DOMINO_H, cz + wz*halfW - dz*halfD], // 5: 위-앞-오
      [cx + wx*halfW + dx*halfD, DOMINO_H, cz + wz*halfW + dz*halfD], // 6: 위-뒤-오
      [cx - wx*halfW + dx*halfD, DOMINO_H, cz - wz*halfW + dz*halfD], // 7: 위-뒤-왼
    ];
    
    // 각 꼭짓점을 화면 좌표로 변환
    const screen = corners3D.map(([x, y, z]) => worldToScreen(x, -y, z));
    // 주의: y는 위로 갈수록 작아져야 하므로 -y
    
    // 면 4개 정의 (꼭짓점 인덱스)
    // 꼭짓점 순서는 화면에서 봤을 때 시계방향 또는 반시계방향으로 일관되게
    const faceFront1 = [0, 1, 5, 4];   // -D 방향 면 (법선: -d 방향)
    const faceFront2 = [3, 2, 6, 7];   // +D 방향 면 (법선: +d 방향)
    const faceTop    = [4, 5, 6, 7];   // 윗면
    const faceSide1  = [0, 3, 7, 4];   // -W 방향 면 (법선: -w 방향)
    const faceSide2  = [1, 2, 6, 5];   // +W 방향 면 (법선: +w 방향)
    
    // 어느 면이 카메라쪽(=화면에서 더 앞=아래쪽)인지 직접 화면 좌표로 판정.
    // 월드에서 두 후보 면의 중심을 화면에 투영해서, 화면 y가 더 큰 쪽(=화면 아래쪽=카메라에 가까움)을 보이는 면으로 선택.
    
    // 앞면 두 후보의 중심 (월드)
    const front1WorldCenter = [cx - dx*halfD, DOMINO_H/2, cz - dz*halfD]; // -D쪽 면 중심
    const front2WorldCenter = [cx + dx*halfD, DOMINO_H/2, cz + dz*halfD]; // +D쪽 면 중심
    const f1s = worldToScreen(front1WorldCenter[0], -front1WorldCenter[1], front1WorldCenter[2]);
    const f2s = worldToScreen(front2WorldCenter[0], -front2WorldCenter[1], front2WorldCenter[2]);
    
    let frontFaceCorners;
    if (f2s.y > f1s.y) {
      // +D쪽 면 중심이 화면에서 더 아래 = 카메라에 가까움 = 우리에게 보이는 면
      frontFaceCorners = faceFront2;
    } else {
      frontFaceCorners = faceFront1;
    }
    
    // 옆면(W방향)도 동일
    const side1WorldCenter = [cx - wx*halfW, DOMINO_H/2, cz - wz*halfW];
    const side2WorldCenter = [cx + wx*halfW, DOMINO_H/2, cz + wz*halfW];
    const s1s = worldToScreen(side1WorldCenter[0], -side1WorldCenter[1], side1WorldCenter[2]);
    const s2s = worldToScreen(side2WorldCenter[0], -side2WorldCenter[1], side2WorldCenter[2]);
    
    let visibleSideCorners;
    if (s2s.y > s1s.y) {
      visibleSideCorners = faceSide2;
    } else {
      visibleSideCorners = faceSide1;
    }
    
    // SVG path 생성용 - 모든 좌표를 양수로 만들기 위한 bbox 계산
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    screen.forEach(p => {
      if (p.x < minX) minX = p.x;
      if (p.y < minY) minY = p.y;
      if (p.x > maxX) maxX = p.x;
      if (p.y > maxY) maxY = p.y;
    });
    
    const padding = 8;
    const svgW = maxX - minX + padding * 2;
    const svgH = maxY - minY + padding * 2;
    
    // 회전 원점 = 도미노 바닥 모서리 (진행방향 반대쪽 = 카메라에서 멀어지는 쪽 아니고, 쓰러질 방향의 반대 모서리)
    // 도미노가 진행방향(+dx,+dz)으로 쓰러진다고 가정 → 회전축은 진행방향 반대쪽 바닥 모서리
    // = corners3D[0]과 corners3D[1]을 잇는 모서리 (아래-앞-왼/오) = -D 쪽 바닥 모서리
    // 회전축의 중점을 회전 원점으로 사용
    const pivotWorld = [
      cx - dx*halfD,  // 진행 방향 반대 = -D 쪽
      0,
      cz - dz*halfD
    ];
    const pivotScreen = worldToScreen(pivotWorld[0], 0, pivotWorld[2]);
    const pivotSvgX = pivotScreen.x - minX + padding;
    const pivotSvgY = pivotScreen.y - minY + padding;
    
    // 면 좌표를 SVG 좌표로 변환 (bbox 기준)
    const toSvgPoint = (cornerIdx) => {
      const p = screen[cornerIdx];
      return [p.x - minX + padding, p.y - minY + padding];
    };
    
    const facePoints = (corners) => corners.map(toSvgPoint);
    const polyStr = (pts) => pts.map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
    
    const topPts = facePoints(faceTop);
    const frontPts = facePoints(frontFaceCorners);
    const sidePts = facePoints(visibleSideCorners);
    
    // 글자 위치 - 앞면의 중심
    const frontCenter = [
      (frontPts[0][0] + frontPts[1][0] + frontPts[2][0] + frontPts[3][0]) / 4,
      (frontPts[0][1] + frontPts[1][1] + frontPts[2][1] + frontPts[3][1]) / 4
    ];
    
    // 글자 기울기 - 도미노 폭(W) 방향을 화면에 투영한 벡터의 각도
    // 이게 글자 baseline 방향이 됨 (왼쪽→오른쪽)
    // 폭 방향 월드 단위벡터 (wx, 0, wz)를 화면 변위로 변환
    const widthDirScreen = worldToScreen(wx, 0, wz); // 원점 기준 변위
    let textAngleDeg = Math.atan2(widthDirScreen.y, widthDirScreen.x) * 180 / Math.PI;
    // 글자가 거꾸로 안 되도록 보장 (-90~90 사이)
    if (textAngleDeg > 90) textAngleDeg -= 180;
    if (textAngleDeg < -90) textAngleDeg += 180;
    
    // 앞면의 너비 (글자 크기 결정)
    const frontWidth = Math.hypot(frontPts[1][0] - frontPts[0][0], frontPts[1][1] - frontPts[0][1]);
    const frontHeight = Math.hypot(frontPts[3][0] - frontPts[0][0], frontPts[3][1] - frontPts[0][1]);
    const fontSize = Math.min(frontHeight * 0.55, frontWidth * 1.2);
    
    // 해칭 패턴 ID (도미노마다 다름)
    const patternId = `hatch-${idx}`;
    const dotsId = `dots-${idx}`;
    
    // SVG 조립
    const svgNS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('xmlns', svgNS);
    svg.setAttribute('width', svgW);
    svg.setAttribute('height', svgH);
    svg.setAttribute('viewBox', `0 0 ${svgW} ${svgH}`);
    svg.classList.add('domino-svg', 'appearing');
    
    svg.innerHTML = `
      <defs>
        <pattern id="${patternId}" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
          <line x1="0" y1="0" x2="0" y2="6" stroke="${'#5a5247'}" stroke-width="0.6" opacity="0.55"/>
        </pattern>
        <pattern id="${dotsId}" patternUnits="userSpaceOnUse" width="5" height="5">
          <circle cx="2.5" cy="2.5" r="0.7" fill="#5a5247" opacity="0.5"/>
        </pattern>
      </defs>
      <!-- 옆면 (해칭) - 패턴 뒤 비침 방지를 위해 종이색 채움 + 패턴 -->
      <polygon points="${polyStr(sidePts)}" fill="#efe9d8"/>
      <polygon points="${polyStr(sidePts)}" fill="url(#${patternId})" stroke="#2a2620" stroke-width="1.2" stroke-linejoin="round"/>
      <!-- 윗면 (도트) - 패턴 뒤 비침 방지 -->
      <polygon points="${polyStr(topPts)}" fill="#efe9d8"/>
      <polygon points="${polyStr(topPts)}" fill="url(#${dotsId})" stroke="#2a2620" stroke-width="1.2" stroke-linejoin="round"/>
      <!-- 앞면 (글자가 새겨질 곳) -->
      <polygon class="face-front" points="${polyStr(frontPts)}" fill="#efe9d8" stroke="#2a2620" stroke-width="1.2" stroke-linejoin="round"/>
      <!-- 글자 -->
      <text 
        x="${frontCenter[0]}" 
        y="${frontCenter[1]}" 
        text-anchor="middle" 
        dominant-baseline="central"
        font-family="'EB Garamond', Georgia, serif"
        font-size="${fontSize}"
        font-style="italic"
        font-weight="500"
        fill="#2a2620"
        transform="rotate(${textAngleDeg.toFixed(2)} ${frontCenter[0]} ${frontCenter[1]})"
      >${escapeText(char)}</text>
    `;
    
    // SVG 위치 설정 - bbox의 좌상단을 stage 좌표로 배치
    svg.style.left = (minX - padding) + 'px';
    svg.style.top = (minY - padding) + 'px';
    svg.style.setProperty('--ox', `${pivotSvgX}px`);
    svg.style.setProperty('--oy', `${pivotSvgY}px`);
    svg.style.transformOrigin = `${pivotSvgX}px ${pivotSvgY}px`;
    
    return {
      svg,
      bbox: { minX, minY, maxX, maxY, width: svgW, height: svgH },
      pivot: { x: pivotScreen.x, y: pivotScreen.y },
      worldPos: { x: cx, z: cz },
      angle,
      idx
    };
  }
  
  function escapeText(s) {
    return s.replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'})[c]);
  }
  
  // === 글자 한 개 추가 ===
  function addChar(char) {
    if (!char || char === ' ' || char === '\n') return;
    
    // 피날레가 진행/완료 상태면 자동으로 정리하고 처음부터 새로 시작
    if (finaleActive) {
      finaleLetters.forEach(L => {
        L.el.style.transition = 'opacity 0.3s';
        L.el.style.opacity = '0';
        setTimeout(() => L.el.remove(), 300);
      });
      finaleLetters = [];
      finaleActive = false;
      
      pathCache = [];
      stage.style.transform = '';
    }
    
    createDomino(char);
  }
  
  // === 마지막 도미노 제거 (backspace) ===
  function removeLastDomino() {
    if (dominos.length === 0) return;
    const last = dominos.pop();
    last.svg.style.transition = 'opacity 0.25s, transform 0.25s';
    last.svg.style.opacity = '0';
    last.svg.style.transform = (last.fallen ? 'rotate(88deg)' : '') + ' translateY(-15px) scale(0.85)';
    setTimeout(() => last.svg.remove(), 280);
    
    // 카운터에서 인덱스가 줄어들었으니 경로 시드는 유지 (다음 글자가 같은 자리에 들어가도록)
    updateStone();
    updateLayout();
  }
  
  // === Enter: 모든 도미노 쓰러뜨리기 (서있는 첫 도미노부터) ===
  function toppleAll() {
    const standing = dominos.filter(d => !d.fallen && !d.falling);
    if (standing.length === 0) return;
    standing.sort((a, b) => a.idx - b.idx);
    triggerChain(standing[0]);
  }
  
  function createDomino(char) {
    const idx = dominos.length;
    
    // 첫 도미노 생성 시 경로 스타일과 시드를 새로 정하고 캐시 초기화
    if (idx === 0) {
      const types = ['wave', 'wave', 'scurve', 'zigzag', 'straight'];
      pathType = types[Math.floor(Math.random() * types.length)];
      pathSeed = Math.random();
      pathCache = [];
    }
    
    const dominoData = createDominoSVG(char, idx, dominos.length + 1);
    dominoData.fallen = false;
    dominoData.falling = false;
    dominoData.char = char;
    
    // z-order: 화면 y가 큰 (= 더 앞쪽) 도미노가 위에 오도록
    // SVG의 top 위치 + height로 baseline 계산
    const baseline = dominoData.bbox.maxY;
    dominoData.zIndex = Math.floor(baseline + 1000);
    dominoData.svg.style.zIndex = dominoData.zIndex;
    
    dominoData.svg.addEventListener('click', (e) => {
      e.stopPropagation();
      triggerChain(dominoData);
    });
    
    stage.appendChild(dominoData.svg);
    dominos.push(dominoData);
    
    // 등장 애니메이션이 끝난 후 클래스를 제거해야
    // 이후 style.transform (회전, 등)이 정상 적용됨.
    // CSS animation은 inline style보다 우선순위가 높으므로 애니메이션이 살아 있으면 회전이 무시됨.
    setTimeout(() => {
      dominoData.svg.classList.remove('appearing');
    }, 500); // appear 애니메이션 길이(0.5s)와 일치
    
    updateStone();
    updateLayout();
  }
  
  // === 레이아웃: 모든 도미노를 화면 중앙에 맞추고, 항상 전체가 보이도록 축소 ===
  function updateLayout() {
    if (dominos.length === 0) {
      stage.style.transform = 'translate(0, 0) scale(1)';
      return;
    }
    
    // 전체 bbox 계산 (도미노 SVG들의 stage 좌표상 외곽)
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    dominos.forEach(d => {
      if (d.bbox.minX < minX) minX = d.bbox.minX;
      if (d.bbox.minY < minY) minY = d.bbox.minY;
      if (d.bbox.maxX > maxX) maxX = d.bbox.maxX;
      if (d.bbox.maxY > maxY) maxY = d.bbox.maxY;
    });
    
    const totalW = maxX - minX;
    const totalH = maxY - minY;
    const centerX = (minX + maxX) / 2;
    const centerY = (minY + maxY) / 2;
    
    // 사용 가능 영역 - UI 요소들이 차지하는 공간을 모두 빼고 여백
    // 위쪽: 헤더(타이틀+컨트롤박스)
    // 아래쪽: hint 박스
    // 좌우: 코너 노트, 카운터 박스 + 일반 여백
    const isMobile = window.innerWidth < 700;
    const topInset    = isMobile ? 170 : 220;  // 헤더 + 여유
    const bottomInset = isMobile ? 70  : 90;   // hint + 여유
    const sideInset   = isMobile ? 30  : 60;
    
    const availW = Math.max(100, window.innerWidth  - sideInset * 2);
    const availH = Math.max(100, window.innerHeight - topInset - bottomInset);
    
    // 스케일: 항상 사용 가능 영역에 들어맞도록 - 상한 1, 하한은 매우 낮게
    // (도미노가 매우 길어져도 항상 한 화면에 들어오도록)
    const newScale = Math.min(1, availW / totalW, availH / totalH);
    
    // 사용 가능 영역의 중앙 좌표
    const stageCenterX = sideInset + availW / 2;
    const stageCenterY = topInset + availH / 2;
    
    // stage 좌표상 도미노들의 중심 (centerX, centerY)을 화면 중앙에 정렬
    const tx = stageCenterX - centerX * newScale;
    const ty = stageCenterY - centerY * newScale;
    
    stage.style.transform = `translate(${tx}px, ${ty}px) scale(${newScale})`;
    scale = newScale;
  }
  
  // === 도미노 쓰러뜨리기 ===
  function fallOne(d, delay = 0) {
    if (d.fallen || d.falling) return;
    d.falling = true;
    
    setTimeout(() => {
      // 등장 애니메이션이 아직 진행 중이면 강제 종료 (CSS animation이 inline transform을 덮어쓰지 않도록)
      d.svg.classList.remove('appearing');
      
      // 진행방향 벡터를 화면에 투영
      const dirScreenX = COS * Math.cos(d.angle) - COS * 0;
      const rotateDeg = 88; // 90도지만 살짝 못 미치게 (실제 도미노 효과)
      
      d.svg.style.transition = 'transform 0.45s cubic-bezier(0.55, 0.085, 0.68, 0.53)';
      d.svg.style.transform = `rotate(${rotateDeg}deg)`;
      
      // 충격 시점 - 펜타토닉 스케일에서 도미노 idx 기반으로 음정 선택
      // 같은 화음 안의 음들이라 어떻게 울려도 화음감이 좋음
      setTimeout(() => {
        // C 메이저 펜타토닉: C, D, E, G, A → ratio from base
        // 옥타브를 살짝 분산: 베이스 880Hz 기준, 살짝 위/아래
        const pentatonic = [1.0, 9/8, 5/4, 3/2, 5/3, 2.0, 9/4, 5/2]; // C,D,E,G,A,C',D',E'
        const noteIdx = d.idx % pentatonic.length;
        const pitch = pentatonic[noteIdx] * (0.95 + Math.random() * 0.05); // 살짝의 흔들림
        playKnock(pitch, 0.7);
        spawnDust(d);
      }, 380);
      
      setTimeout(() => {
        d.fallen = true;
        d.falling = false;
        updateStone();
      }, 450);
    }, delay);
  }
  
  function spawnDust(d) {
    const count = 4;
    const stageRect = stage.getBoundingClientRect();
    
    for (let i = 0; i < count; i++) {
      const dust = document.createElement('div');
      dust.className = 'dust';
      const size = 2 + Math.random() * 4;
      dust.style.width = size + 'px';
      dust.style.height = size + 'px';
      dust.style.opacity = 0.4 + Math.random() * 0.3;
      // pivot 위치에 먼지 스폰 (stage 좌표계 안에)
      dust.style.left = (d.pivot.x + (Math.random() - 0.5) * 30) + 'px';
      dust.style.top = (d.pivot.y + (Math.random() - 0.5) * 10) + 'px';
      dust.style.zIndex = 999;
      stage.appendChild(dust);
      
      const tx = (Math.random() - 0.3) * 40;
      const ty = -20 - Math.random() * 25;
      
      requestAnimationFrame(() => {
        dust.style.transition = 'transform 0.8s ease-out, opacity 0.8s ease-out';
        dust.style.transform = `translate(${tx}px, ${ty}px)`;
        dust.style.opacity = '0';
      });
      
      setTimeout(() => dust.remove(), 900);
    }
  }
  
  function triggerChain(startDomino) {
    if (startDomino.fallen || startDomino.falling) return;
    
    // 시작 도미노 이후 모든 도미노를 인덱스 순으로 (경로를 따라)
    const chain = dominos
      .filter(d => d.idx >= startDomino.idx && !d.fallen && !d.falling)
      .sort((a, b) => a.idx - b.idx);
    
    const cascadeDelay = 110;
    chain.forEach((d, i) => fallOne(d, i * cascadeDelay));
    
    // 마지막 도미노가 쓰러지고 충격까지 끝난 후 피날레
    // fallOne의 충격 사운드는 delay + 380ms, 회전 완료는 delay + 450ms
    const finalDelay = (chain.length - 1) * cascadeDelay + 700; // 마지막 충격 후 약간의 여운
    setTimeout(() => {
      // 모든 도미노가 정말로 다 쓰러졌는지 확인 (다른 클릭으로 부분 토플된 경우 제외)
      if (dominos.length > 0 && dominos.every(d => d.fallen)) {
        playFinale();
      }
    }, finalDelay);
  }
  
  // === 피날레: 글자들이 정렬된 한 줄로 모이는 연출 ===
  let finaleActive = false;
  let finaleLetters = []; // {el, ...}
  
  function playFinale() {
    if (finaleActive) return;
    finaleActive = true;
    
    // 1. 각 도미노의 글자 자리를 화면 좌표로 계산하고, 그 자리에 글자 div를 새로 띄움
    //    동시에 도미노 SVG들은 페이드아웃
    const letters = [];
    
    dominos.forEach((d, i) => {
      const rect = d.svg.getBoundingClientRect();
      const startX = rect.left + rect.width / 2;
      const startY = rect.top + rect.height / 2;
      
      // 글자만 따로 띄우는 div 생성 (body 직속, position: fixed)
      const letterEl = document.createElement('div');
      letterEl.className = 'finale-letter';
      letterEl.textContent = d.char;
      letterEl.style.left = startX + 'px';
      letterEl.style.top = startY + 'px';
      letterEl.style.transform = `translate(-50%, -50%) rotate(${(Math.random()-0.5)*30}deg) scale(0.8)`;
      letterEl.style.opacity = '0';
      document.body.appendChild(letterEl);
      
      letters.push({ el: letterEl, char: d.char, idx: i });
      
      // 도미노 SVG는 페이드아웃
      d.svg.style.transition = 'opacity 0.6s ease-out';
      d.svg.style.opacity = '0';
    });
    
    finaleLetters = letters;
    
    // 2. 글자들이 자기 자리에서 살짝 떠오르는 단계
    requestAnimationFrame(() => {
      letters.forEach((L, i) => {
        setTimeout(() => {
          L.el.style.transition = 'opacity 0.3s, transform 0.3s';
          L.el.style.opacity = '1';
          L.el.style.transform = 'translate(-50%, -50%) rotate(0deg) scale(1)';
        }, i * 8);
      });
    });
    
    // 3. 정렬된 한 줄 위치로 이동 - 화면 폭에 맞춰 줄바꿈
    const totalChars = letters.length;
    const isMobile = window.innerWidth < 700;
    const letterFontSize = isMobile ? 36 : 56;
    const letterSpacing = letterFontSize * 0.85;
    const lineHeight = letterFontSize * 1.4;
    
    const sideMargin = 60;
    const availLineW = window.innerWidth - sideMargin * 2;
    const maxPerLine = Math.max(1, Math.floor(availLineW / letterSpacing));
    const lineCount = Math.ceil(totalChars / maxPerLine);
    const charsPerLine = Math.ceil(totalChars / lineCount);
    
    const totalH = lineCount * lineHeight;
    const startY = window.innerHeight / 2 - totalH / 2 + lineHeight / 2;
    
    letters.forEach((L, i) => {
      const lineIdx = Math.floor(i / charsPerLine);
      const colIdx = i % charsPerLine;
      const lineLen = (lineIdx === lineCount - 1) ? (totalChars - lineIdx * charsPerLine) : charsPerLine;
      
      const lineW = (lineLen - 1) * letterSpacing;
      const lineStartX = window.innerWidth / 2 - lineW / 2;
      
      L.targetX = lineStartX + colIdx * letterSpacing;
      L.targetY = startY + lineIdx * lineHeight;
    });
    
    // 4. 일정 시간 후 정렬 위치로 spring 이동
    const moveStartDelay = 350;
    letters.forEach((L, i) => {
      setTimeout(() => {
        L.el.style.transition = 'left 0.9s cubic-bezier(0.34, 1.56, 0.64, 1), top 0.9s cubic-bezier(0.34, 1.56, 0.64, 1), font-size 0.6s ease-out';
        L.el.style.fontSize = letterFontSize + 'px';
        L.el.style.left = L.targetX + 'px';
        L.el.style.top = L.targetY + 'px';
      }, moveStartDelay + i * 25);
    });
    
    // 5. 정렬 완료 시점에 짠! 사운드 + 펄스
    const arriveTime = moveStartDelay + (totalChars - 1) * 25 + 900;
    setTimeout(() => {
      playFinaleChime();
      letters.forEach((L, i) => {
        setTimeout(() => {
          L.el.style.transition = 'transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1)';
          L.el.style.transform = 'translate(-50%, -50%) rotate(0deg) scale(1.15)';
          setTimeout(() => {
            L.el.style.transform = 'translate(-50%, -50%) rotate(0deg) scale(1)';
          }, 300);
        }, i * 15);
      });
    }, arriveTime);
    
    // dominos 배열은 비워둠
    dominos = [];
    pathCache = [];
    updateStone();
  }
  
  function clearFinaleLetters() {
    finaleLetters.forEach(L => L.el.remove());
    finaleLetters = [];
    finaleActive = false;
  }
  
  function clearAll() {
    // 피날레 진행 중이거나 완료된 글자도 함께 제거
    if (finaleLetters.length > 0) {
      finaleLetters.forEach((L, i) => {
        setTimeout(() => {
          L.el.style.transition = 'opacity 0.4s, transform 0.4s';
          L.el.style.opacity = '0';
          L.el.style.transform = (L.el.style.transform || 'translate(-50%, -50%)') + ' scale(0.5)';
        }, i * 8);
      });
      setTimeout(clearFinaleLetters, 500 + finaleLetters.length * 8);
    }
    
    const len = dominos.length;
    dominos.forEach((d, i) => {
      setTimeout(() => {
        d.svg.style.transition = 'opacity 0.3s, transform 0.3s';
        d.svg.style.opacity = '0';
      }, i * 10);
    });
    setTimeout(() => {
      dominos.forEach(d => d.svg.remove());
      dominos = [];
      pathCache = []; // 경로 캐시 초기화 → 다음 입력 시 새 경로 시작
      updateStone();
      stage.style.transform = '';
    }, 400 + len * 10);
  }
  
  function updateStone() {
    stoneCount.textContent = dominos.length;
    const hasStanding = dominos.some(d => !d.fallen && !d.falling);
    if (hasStanding) hint.classList.remove('hidden');
    else hint.classList.add('hidden');
  }
  
  // ========== 키보드 입력 처리 ==========
  // 한글 IME 처리:
  //   - composition 중인 글자는 hiddenInput.value에 미리보기로 들어가지만
  //     compositionend 시점에 최종 글자가 확정됨
  //   - 영문/숫자/특수문자는 IME 거치지 않고 곧바로 input 이벤트로 들어옴
  //   - 우리는 한 글자 단위로 도미노 생성해야 하므로:
  //     1) compositionend → 확정된 한글 글자(들)를 도미노화
  //     2) 일반 input (composition 아닌 경우) → 추가된 글자(들)를 도미노화
  //   - hiddenInput을 처리 후 항상 비워서 동일 시퀀스 재처리 방지
  
  let isComposing = false;
  let lastInputValue = ''; // 일반 input 이벤트의 변화량 추적용
  
  hiddenInput.addEventListener('compositionstart', () => {
    isComposing = true;
  });
  
  hiddenInput.addEventListener('compositionend', (e) => {
    isComposing = false;
    // e.data: 확정된 조합 결과 (예: "한")
    if (e.data) {
      for (const ch of e.data) addChar(ch);
    }
    hiddenInput.value = '';
    lastInputValue = '';
  });
  
  hiddenInput.addEventListener('input', (e) => {
    // composition 중에는 처리하지 않음 (compositionend에서 처리)
    if (isComposing) return;
    
    const cur = hiddenInput.value;
    // 새로 추가된 글자만 도미노화 (이전 값 대비 추가분)
    if (cur.length > lastInputValue.length) {
      const added = cur.slice(lastInputValue.length);
      for (const ch of added) addChar(ch);
    }
    
    hiddenInput.value = '';
    lastInputValue = '';
  });
  
  // Backspace, Enter 등 특수키 처리
  document.addEventListener('keydown', (e) => {
    // 입력 도중 IME 조합 중이면 특수키도 IME가 처리할 수 있으니 양보
    if (e.isComposing || isComposing) return;
    
    // clear 버튼 등 다른 input/button에 포커스 있을 때는 처리 양보 가능하지만
    // hiddenInput이 항상 포커스를 가지므로 사실상 모든 키가 여기로 옴
    if (e.key === 'Backspace') {
      e.preventDefault();
      removeLastDomino();
    } else if (e.key === 'Enter') {
      e.preventDefault();
      toppleAll();
    }
  });
  
  // hiddenInput이 포커스를 잃지 않도록 - 다른 곳 클릭해도 다시 포커스
  function refocusHidden() {
    setTimeout(() => hiddenInput.focus(), 0);
  }
  document.addEventListener('click', refocusHidden);
  document.addEventListener('touchend', refocusHidden);
  
  window.addEventListener('resize', updateLayout);
  document.addEventListener('click', () => { getAudio(); }, { once: true });
  
  hiddenInput.focus();
  updateStone();
</script>

</body>
