const VERTICAL_JUNG = [0,1,2,3,4,5,6,7,20];
const HORIZONTAL_JUNG = [8,11,12,13,17,18];

function rand(n){ return (Math.random()*2-1)*n; }

function plotLine(x0,y0,x1,y1){
  x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);
  const dx=Math.abs(x1-x0),sx=x0<x1?1:-1;
  const dy=-Math.abs(y1-y0),sy=y0<y1?1:-1;
  let err=dx+dy,safety=0;
  while(safety++<5000){
    if(thick===1)ctx.fillRect(x0,y0,1,1);
    else ctx.fillRect(x0-Math.floor(thick/2),y0-Math.floor(thick/2),thick,thick);
    if(x0===x1&&y0===y1)break;
    const e2=2*err;
    if(e2>=dy){err+=dy;x0+=sx;}
    if(e2<=dx){err+=dx;y0+=sy;}
  }
}

function buildStrokeSegments(stroke,ox,oy,w,h){
  if(stroke.length<2){
    if(stroke.length===1)return[[[ox+stroke[0][0]*w+rand(jitter),oy+stroke[0][1]*h+rand(jitter)]]];
    return[];
  }
  const abs=stroke.map(p=>[ox+p[0]*w,oy+p[1]*h]);
  const dense=[abs[0].slice()];
  for(let i=0;i<abs.length-1;i++){
    const dx=abs[i+1][0]-abs[i][0],dy=abs[i+1][1]-abs[i][1];
    const L=Math.sqrt(dx*dx+dy*dy);
    const step=4+Math.random()*3;
    const n=Math.max(1,Math.ceil(L/step));
    for(let k=1;k<=n;k++){
      const t=k/n;
      dense.push([abs[i][0]+dx*t+rand(jitter),abs[i][1]+dy*t+rand(jitter)]);
    }
  }
  if(breakFreq===0)return[dense];
  const segments=[];let current=[dense[0]],breaksUsed=0;
  const maxBreaks=Math.max(1,Math.floor(dense.length/10));
  for(let i=1;i<dense.length;i++){
    if(i>2&&i<dense.length-2&&breaksUsed<maxBreaks&&Math.random()*100<breakFreq){
      segments.push(current);breaksUsed++;
      const dx2=dense[i][0]-dense[i-1][0],dy2=dense[i][1]-dense[i-1][1];
      const L2=Math.sqrt(dx2*dx2+dy2*dy2)||1;
      current=[[dense[i][0]+(dx2/L2)*1.5,dense[i][1]+(dy2/L2)*1.5]];
    } else current.push(dense[i]);
  }
  if(current.length)segments.push(current);
  return segments;
}

function animateStroke(segments){
  ctx.fillStyle=color;
  segments.forEach(seg=>{
    if(seg.length===1){
      const p=seg[0];
      if(thick===1)ctx.fillRect(Math.round(p[0]),Math.round(p[1]),1,1);
      else ctx.fillRect(Math.round(p[0]-thick/2),Math.round(p[1]-thick/2),thick,thick);
    } else {
      for(let i=0;i<seg.length-1;i++) plotLine(seg[i][0],seg[i][1],seg[i+1][0],seg[i+1][1]);
    }
  });
}

function decomposeHangul(ch){
  const code=ch.charCodeAt(0);
  if(code<0xAC00||code>0xD7A3)return null;
  const off=code-0xAC00;
  return{cho:Math.floor(off/(21*28)),jung:Math.floor((off%(21*28))/28),jong:off%28};
}

function drawHangulChar(ch,sx,sy,w,h){
  const d=decomposeHangul(ch);if(!d)return;
  const{cho,jung,jong}=d;
  const choS=JAMO[CHOSEONG[cho]],jungS=JAMO[JUNGSEONG[jung]];
  const jongS=jong>0?(JAMO[JONGSEONG[jong]]||null):null;
  if(!choS||!jungS)return;
  const hasJ=!!jongS,isV=VERTICAL_JUNG.includes(jung),isH=HORIZONTAL_JUNG.includes(jung);
  let cB,jB,jgB;
  if(isV){
    if(hasJ){cB={x:0,y:0,w:0.55,h:0.55};jB={x:0.58,y:0,w:0.42,h:0.55};jgB={x:0.05,y:0.6,w:0.9,h:0.4};}
    else{cB={x:0,y:0.05,w:0.55,h:0.9};jB={x:0.58,y:0.05,w:0.42,h:0.9};}
  }else if(isH){
    if(hasJ){cB={x:0.15,y:0,w:0.7,h:0.45};jB={x:0.05,y:0.47,w:0.9,h:0.25};jgB={x:0.15,y:0.73,w:0.7,h:0.27};}
    else{cB={x:0.15,y:0,w:0.7,h:0.55};jB={x:0.05,y:0.58,w:0.9,h:0.4};}
  }else{
    if(hasJ){cB={x:0,y:0,w:0.5,h:0.45};jB={x:0,y:0,w:1,h:0.6};jgB={x:0.05,y:0.65,w:0.9,h:0.35};}
    else{cB={x:0,y:0,w:0.5,h:0.55};jB={x:0,y:0,w:1,h:0.95};}
  }
  choS.forEach(s=>{const m=s.map(p=>[cB.x+p[0]*cB.w,cB.y+p[1]*cB.h]);animateStroke(buildStrokeSegments(m,sx,sy,w,h));});
  jungS.forEach(s=>{const m=s.map(p=>[jB.x+p[0]*jB.w,jB.y+p[1]*jB.h]);animateStroke(buildStrokeSegments(m,sx,sy,w,h));});
  if(jongS&&jgB)jongS.forEach(s=>{const m=s.map(p=>[jgB.x+p[0]*jgB.w,jgB.y+p[1]*jgB.h]);animateStroke(buildStrokeSegments(m,sx,sy,w,h));});
}

function drawChar(ch){
  if(ch==='\n'){cursor.x=24;cursor.y+=scale+Math.round(scale*0.35);history.push({type:'newline'});return;}
  let strokes=G[ch]||G[ch.toUpperCase()];
  const code=ch.charCodeAt(0);
  const isHangul=code>=0xAC00&&code<=0xD7A3;
  const isKnown=!!strokes;
  const w=Math.round(scale*(isKnown?0.6:0.85)),h=scale,space=Math.round(scale*0.2);
  if(cursor.x+w>W-24){cursor.x=24;cursor.y+=scale+Math.round(scale*0.35);}
  if(cursor.y+h>H-24)return;
  const sx=cursor.x,sy=cursor.y;
  if(isHangul)drawHangulChar(ch,sx,sy,w,h);
  else if(strokes)strokes.forEach(s=>animateStroke(buildStrokeSegments(s,sx,sy,w,h)));
  else{const fb=[[[0.1,0.2],[0.9,0.2],[0.9,0.9],[0.1,0.9],[0.1,0.2]]];fb.forEach(s=>animateStroke(buildStrokeSegments(s,sx,sy,w,h)));}
  history.push({type:'char',x:sx-4,y:sy-6,w:w+space+8,h:h*1.5});
  cursor.x+=w+space;
}

function backspace(){
  if(!history.length)return;
  const last=history.pop();
  if(last.type==='newline'){cursor.y-=scale+Math.round(scale*0.35);let x=24;for(let i=history.length-1;i>=0;i--){if(history[i].type==='newline')break;if(history[i].type==='char')x=history[i].x+history[i].w-4;}cursor.x=Math.max(24,x);return;}
  ctx.fillStyle='#2d5016';ctx.fillRect(last.x,last.y,last.w,last.h);
  cursor.x=last.x+4;cursor.y=last.y+6;
}

// 이벤트
document.getElementById('board').addEventListener('click',()=>input.focus());
let composing=false;
input.addEventListener('compositionstart',()=>{composing=true;});
input.addEventListener('compositionend',(e)=>{composing=false;for(const ch of e.data)drawChar(ch);e.target.value='';});
input.addEventListener('input',(e)=>{if(composing)return;for(const ch of e.target.value)drawChar(ch);e.target.value='';});
input.addEventListener('keydown',(e)=>{
  if(e.key==='Enter'){e.preventDefault();drawChar('\n');}
  else if(e.key==='Backspace'){e.preventDefault();backspace();}
});

// 초기 데모
ctx.fillStyle=color;
['칠','판','에',' ','글','씨','를',' ','써','보','세','요'].forEach(drawChar);
drawChar('\n');
setTimeout(()=>input.focus(),100);
})();
</script>
