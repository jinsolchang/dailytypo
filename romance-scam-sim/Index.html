<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { 
  font-family: 'Noto Sans KR', -apple-system, sans-serif;
  background: #0a0a0a; color: #fff;
  height: 100vh; overflow: hidden;
}

/* ── 화면 전환 ── */
.screen { display:none; height:100vh; flex-direction:column; }
.screen.active { display:flex; }

/* ── 인트로 화면 ── */
#intro {
  justify-content: center; align-items: center;
  padding: 40px 24px; text-align: center;
  background: linear-gradient(180deg, #0a0a0a 0%, #1a0a0a 100%);
}
#intro h1 { font-size: clamp(1.8rem, 6vw, 3rem); font-weight:900; margin-bottom:12px; }
#intro h1 span { color: #ff3b5c; }
#intro p { color: rgba(255,255,255,0.5); font-size:0.85rem; max-width:400px; margin-bottom:32px; }
.warning-badge {
  display:inline-block; background:rgba(255,59,92,0.15); border:1px solid rgba(255,59,92,0.3);
  color:#ff6b8a; font-size:0.7rem; padding:6px 14px; border-radius:20px; margin-bottom:24px;
}
.btn {
  background: #ff3b5c; color:#fff; border:none; padding:14px 36px;
  font-size:1rem; font-weight:700; border-radius:8px; cursor:pointer;
  transition: all 0.2s;
}
.btn:hover { background:#ff5577; transform:scale(1.02); }
.btn:disabled { background:#333; color:#666; cursor:not-allowed; transform:none; }

/* ── 프로필 입력 화면 ── */
#profile {
  padding: 24px; overflow-y:auto;
  background: #0a0a0a;
}
#profile h2 { font-size:1.3rem; font-weight:900; margin-bottom:8px; }
#profile .subtitle { color:rgba(255,255,255,0.4); font-size:0.8rem; margin-bottom:24px; }
.form-group { margin-bottom:16px; }
.form-group label { display:block; font-size:0.75rem; color:rgba(255,255,255,0.6); margin-bottom:6px; font-weight:700; }
.form-group input, .form-group select, .form-group textarea {
  width:100%; background:#111; border:1px solid #222; color:#fff;
  padding:12px 14px; border-radius:8px; font-size:0.9rem; font-family:inherit;
  outline:none; transition: border-color 0.2s;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  border-color: #ff3b5c;
}
.form-group textarea { resize:none; height:60px; }
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }

/* ── 채팅 화면 ── */
#chatScreen {
  background: #0a0a0a;
}
.chat-header {
  display:flex; align-items:center; gap:12px;
  padding:12px 16px; background:#111; border-bottom:1px solid #1a1a1a;
  flex-shrink:0;
}
.chat-avatar {
  width:40px; height:40px; border-radius:50%; background:linear-gradient(135deg,#ff6b8a,#ff3b5c);
  display:flex; align-items:center; justify-content:center; font-size:1.2rem;
}
.chat-name { font-weight:700; font-size:0.95rem; }
.chat-status { font-size:0.7rem; color:rgba(255,255,255,0.4); }
.chat-header-right { margin-left:auto; }
.stage-badge {
  font-size:0.6rem; padding:4px 8px; border-radius:10px;
  background:rgba(255,59,92,0.15); color:#ff6b8a; font-weight:700;
}

.chat-messages {
  flex:1; overflow-y:auto; padding:16px;
  display:flex; flex-direction:column; gap:8px;
}
.msg {
  max-width:75%; padding:10px 14px; border-radius:16px;
  font-size:0.88rem; line-height:1.5; word-break:break-word;
  animation: msgIn 0.3s ease;
}
@keyframes msgIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
.msg.them {
  align-self:flex-start; background:#1a1a1a; border-bottom-left-radius:4px;
}
.msg.me {
  align-self:flex-end; background:#ff3b5c; border-bottom-right-radius:4px;
}
.msg.system {
  align-self:center; background:rgba(255,200,0,0.1); border:1px solid rgba(255,200,0,0.2);
  color:#ffd84a; font-size:0.75rem; text-align:center; max-width:90%;
  border-radius:8px;
}
.msg .photo-placeholder {
  background:#222; border-radius:8px; padding:20px; text-align:center;
  color:rgba(255,255,255,0.4); font-size:0.75rem; margin-top:6px;
}
.typing {
  align-self:flex-start; padding:10px 14px; background:#1a1a1a;
  border-radius:16px; border-bottom-left-radius:4px;
}
.typing span {
  display:inline-block; width:6px; height:6px; background:rgba(255,255,255,0.4);
  border-radius:50%; margin:0 2px; animation: typingDot 1.4s infinite;
}
.typing span:nth-child(2) { animation-delay:0.2s; }
.typing span:nth-child(3) { animation-delay:0.4s; }
@keyframes typingDot { 0%,60%,100%{opacity:0.3;transform:translateY(0)} 30%{opacity:1;transform:translateY(-3px)} }

.red-flag-bar {
  padding:8px 16px; background:rgba(255,59,92,0.08); border-top:1px solid rgba(255,59,92,0.15);
  font-size:0.7rem; color:#ff6b8a; overflow-x:auto; white-space:nowrap;
  flex-shrink:0;
}

.chat-input {
  display:flex; gap:8px; padding:12px 16px; background:#111;
  border-top:1px solid #1a1a1a; flex-shrink:0;
}
.chat-input input {
  flex:1; background:#1a1a1a; border:1px solid #222; color:#fff;
  padding:10px 14px; border-radius:20px; font-size:0.88rem; font-family:inherit;
  outline:none;
}
.chat-input input:focus { border-color:#ff3b5c; }
.chat-input button {
  background:#ff3b5c; border:none; color:#fff; width:38px; height:38px;
  border-radius:50%; cursor:pointer; font-size:1.1rem; display:flex;
  align-items:center; justify-content:center;
}
.chat-input button:disabled { background:#333; cursor:not-allowed; }

/* ── 위험도 게이지 ── */
.danger-gauge {
  height:3px; background:#1a1a1a; flex-shrink:0;
}
.danger-gauge-fill {
  height:100%; background: linear-gradient(90deg, #ffd84a, #ff3b5c, #cc0000);
  transition: width 0.5s ease;
}

/* ── 디브리핑 화면 ── */
#debriefing {
  padding:24px; overflow-y:auto;
  background: linear-gradient(180deg, #0a0a0a 0%, #1a0505 100%);
}
#debriefing h2 { font-size:1.4rem; font-weight:900; margin-bottom:4px; }
#debriefing .subtitle { color:rgba(255,255,255,0.4); font-size:0.8rem; margin-bottom:24px; }
.debrief-section {
  background:#111; border:1px solid #1a1a1a; border-radius:12px;
  padding:16px; margin-bottom:12px;
}
.debrief-section h3 {
  font-size:0.8rem; font-weight:700; color:#ff6b8a; margin-bottom:8px;
  letter-spacing:0.05em;
}
.debrief-section ul { list-style:none; }
.debrief-section li {
  font-size:0.85rem; color:rgba(255,255,255,0.8); padding:4px 0;
  padding-left:16px; position:relative;
}
.debrief-section li::before {
  content:'•'; position:absolute; left:0; color:#ff3b5c;
}
.danger-score {
  text-align:center; padding:20px;
}
.danger-score .number {
  font-size:3rem; font-weight:900; color:#ff3b5c;
}
.danger-score .label {
  font-size:0.75rem; color:rgba(255,255,255,0.4); margin-top:4px;
}
.restart-btn {
  display:block; width:100%; margin-top:20px; padding:14px;
  background:transparent; border:1px solid #ff3b5c; color:#ff3b5c;
  font-size:0.9rem; font-weight:700; border-radius:8px; cursor:pointer;
}
.restart-btn:hover { background:rgba(255,59,92,0.1); }

/* ── 로딩 ── */
.loading-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,0.85);
  display:none; align-items:center; justify-content:center;
  flex-direction:column; gap:16px; z-index:100;
}
.loading-overlay.active { display:flex; }
.loading-spinner {
  width:32px; height:32px; border:3px solid #222;
  border-top-color:#ff3b5c; border-radius:50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }
.loading-text { font-size:0.85rem; color:rgba(255,255,255,0.6); }
</style>
</head>
<body>

<!-- 인트로 -->
<div id="intro" class="screen active">
  <div class="warning-badge">⚠️ 교육 목적 시뮬레이션</div>
  <h1>로맨스 <span>스캠</span> 체험</h1>
  <p>당신의 정보를 입력하면, AI가 당신을 타겟으로 한 가장 정교한 스캐머 페르소나를 생성합니다. 실제 스캠 수법을 체험하고 경각심을 가지세요.</p>
  <button class="btn" onclick="showScreen('profile')">체험 시작</button>
</div>

<!-- 프로필 입력 -->
<div id="profile" class="screen">
  <h2>당신에 대해 알려주세요</h2>
  <p class="subtitle">스캐머는 타겟의 정보를 분석해 맞춤형으로 접근합니다</p>
  
  <div class="form-row">
    <div class="form-group">
      <label>나이</label>
      <input type="number" id="inputAge" placeholder="30" min="18" max="80">
    </div>
    <div class="form-group">
      <label>성별</label>
      <select id="inputGender">
        <option value="여성">여성</option>
        <option value="남성">남성</option>
      </select>
    </div>
  </div>
  
  <div class="form-group">
    <label>직업</label>
    <input type="text" id="inputJob" placeholder="예: 마케터, 개발자, 대학원생...">
  </div>
  
  <div class="form-group">
    <label>관심사 / 취미</label>
    <input type="text" id="inputInterests" placeholder="예: 여행, 요리, 넷플릭스, 운동...">
  </div>
  
  <div class="form-group">
    <label>현재 연애 상태</label>
    <select id="inputRelationship">
      <option value="싱글">싱글</option>
      <option value="썸 타는 중">썸 타는 중</option>
      <option value="연애 중">연애 중</option>
      <option value="이별 직후">이별 직후</option>
    </select>
  </div>
  
  <div class="form-group">
    <label>주로 사용하는 SNS</label>
    <input type="text" id="inputSNS" placeholder="예: 인스타그램, 틱톡, 트위터...">
  </div>
  
  <button class="btn" id="startBtn" onclick="startSimulation()" style="width:100%;margin-top:16px;">
    스캐머 생성하기
  </button>
</div>

<!-- 채팅 -->
<div id="chatScreen" class="screen">
  <div class="chat-header">
    <div class="chat-avatar" id="chatAvatar">💕</div>
    <div>
      <div class="chat-name" id="chatName">Loading...</div>
      <div class="chat-status">온라인</div>
    </div>
    <div class="chat-header-right">
      <span class="stage-badge" id="stageBadge">1단계: 첫 접근</span>
    </div>
  </div>
  <div class="danger-gauge"><div class="danger-gauge-fill" id="dangerFill" style="width:5%"></div></div>
  <div class="chat-messages" id="chatMessages"></div>
  <div class="red-flag-bar" id="redFlagBar" style="display:none;"></div>
  <div class="chat-input">
    <input type="text" id="chatInput" placeholder="메시지를 입력하세요..." onkeydown="if(event.key==='Enter')sendMessage()">
    <button onclick="sendMessage()" id="sendBtn">➤</button>
  </div>
</div>

<!-- 디브리핑 -->
<div id="debriefing" class="screen">
  <h2>🚨 시뮬레이션 종료</h2>
  <p class="subtitle">당신이 방금 체험한 것은 실제 로맨스 스캠 수법입니다</p>
  <div id="debriefContent"></div>
  <button class="restart-btn" onclick="location.reload()">처음부터 다시 체험</button>
</div>

<!-- 로딩 오버레이 -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-spinner"></div>
  <div class="loading-text" id="loadingText">스캐머 페르소나 생성 중...</div>
</div>

<script>
// ── State ──
let userProfile = {};
let scammerPersona = {};
let chatHistory = [];
let currentStage = 1;
let messageCount = 0;

const STAGE_NAMES = {
  1: '1단계: 첫 접근',
  2: '2단계: 친밀감 형성',
  3: '3단계: 감정 심화',
  4: '4단계: 금전 요구',
  5: '시뮬레이션 종료'
};

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function showLoading(text) {
  document.getElementById('loadingText').textContent = text;
  document.getElementById('loadingOverlay').classList.add('active');
}
function hideLoading() {
  document.getElementById('loadingOverlay').classList.remove('active');
}

// ── 시뮬레이션 시작 ──
function startSimulation() {
  userProfile = {
    age: document.getElementById('inputAge').value || '30',
    gender: document.getElementById('inputGender').value,
    job: document.getElementById('inputJob').value || '회사원',
    interests: document.getElementById('inputInterests').value || '여행, 맛집',
    relationship: document.getElementById('inputRelationship').value,
    sns: document.getElementById('inputSNS').value || '인스타그램'
  };

  showLoading('당신을 분석하고 있습니다...');

  google.script.run
    .withSuccessHandler(onPersonaReady)
    .withFailureHandler(onError)
    .generateScammerPersona(userProfile);
}

function onPersonaReady(persona) {
  scammerPersona = persona;
  hideLoading();
  
  // 채팅 화면 세팅
  document.getElementById('chatName').textContent = persona.name;
  document.getElementById('chatAvatar').textContent = persona.gender === '여' ? '👩' : '👨';
  
  showScreen('chatScreen');
  
  // 시스템 메시지
  addSystemMessage(`${persona.name} (${persona.nameKr})님이 당신에게 메시지를 보냈습니다`);
  
  // 스캐머 첫 메시지 생성
  setTimeout(() => {
    showTyping();
    google.script.run
      .withSuccessHandler(onChatResponse)
      .withFailureHandler(onError)
      .chat([], scammerPersona, 1, userProfile);
  }, 1000);
}

// ── 채팅 ──
function sendMessage() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  
  input.value = '';
  addMessage(text, 'me');
  chatHistory.push({ role: 'user', content: text });
  messageCount++;
  
  // 종료 체크
  if (currentStage >= 5) {
    endSimulation();
    return;
  }
  
  document.getElementById('sendBtn').disabled = true;
  showTyping();
  
  google.script.run
    .withSuccessHandler(onChatResponse)
    .withFailureHandler(onError)
    .chat(chatHistory, scammerPersona, currentStage, userProfile);
}

function onChatResponse(result) {
  hideTyping();
  document.getElementById('sendBtn').disabled = false;
  
  let reply = result.reply;
  
  // [사진: ...] 처리
  const photoMatch = reply.match(/\[사진:\s*(.+?)\]/);
  if (photoMatch) {
    reply = reply.replace(photoMatch[0], '');
    addMessage(reply.trim(), 'them');
    addPhotoMessage(photoMatch[1]);
  } else {
    addMessage(reply, 'them');
  }
  
  chatHistory.push({ role: 'assistant', content: result.reply });
  
  // 단계 업데이트
  if (result.stage !== currentStage) {
    currentStage = result.stage;
    updateStageUI();
    
    if (currentStage >= 5) {
      setTimeout(endSimulation, 1500);
      return;
    }
  }
  
  // 레드플래그 표시
  if (result.redFlags && result.redFlags.length > 0) {
    showRedFlags(result.redFlags);
  }
}

function updateStageUI() {
  document.getElementById('stageBadge').textContent = STAGE_NAMES[currentStage] || '';
  
  const dangerPercent = Math.min(95, currentStage * 22);
  document.getElementById('dangerFill').style.width = dangerPercent + '%';
  
  if (currentStage >= 2) {
    addSystemMessage(`⚠️ ${STAGE_NAMES[currentStage]} — 주의하세요`);
  }
}

function showRedFlags(flags) {
  const bar = document.getElementById('redFlagBar');
  bar.style.display = 'block';
  bar.textContent = flags.join('  ·  ');
}

// ── 메시지 UI ──
function addMessage(text, type) {
  const el = document.createElement('div');
  el.className = 'msg ' + type;
  el.textContent = text;
  document.getElementById('chatMessages').appendChild(el);
  scrollToBottom();
}

function addPhotoMessage(description) {
  const el = document.createElement('div');
  el.className = 'msg them';
  el.innerHTML = `<div class="photo-placeholder">📷 ${description}</div>`;
  document.getElementById('chatMessages').appendChild(el);
  scrollToBottom();
}

function addSystemMessage(text) {
  const el = document.createElement('div');
  el.className = 'msg system';
  el.textContent = text;
  document.getElementById('chatMessages').appendChild(el);
  scrollToBottom();
}

function showTyping() {
  const el = document.createElement('div');
  el.className = 'typing';
  el.id = 'typingIndicator';
  el.innerHTML = '<span></span><span></span><span></span>';
  document.getElementById('chatMessages').appendChild(el);
  scrollToBottom();
}

function hideTyping() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

function scrollToBottom() {
  const container = document.getElementById('chatMessages');
  container.scrollTop = container.scrollHeight;
}

// ── 시뮬레이션 종료 & 디브리핑 ──
function endSimulation() {
  showLoading('대화를 분석하고 있습니다...');
  
  google.script.run
    .withSuccessHandler(onDebriefingReady)
    .withFailureHandler(onDebriefingFallback)
    .generateDebriefing(chatHistory, scammerPersona, userProfile);
}

function onDebriefingReady(data) {
  hideLoading();
  renderDebriefing(data);
  showScreen('debriefing');
}

function onDebriefingFallback(err) {
  hideLoading();
  renderDebriefing({
    vulnerabilities: ['시뮬레이션에서 감정적 교류에 응했습니다'],
    redFlagsMissed: ['너무 빠른 감정 표현', '실제 만남 회피', '금전 요구'],
    techniques: ['빠른 친밀감 형성 (Love Bombing)', '감정적 의존 유도', '긴급 상황 연출'],
    realCaseComparison: '2024년 한국 로맨스 스캠 피해액은 약 1,200억원으로 추정됩니다.',
    preventionTips: [
      '온라인에서 만난 사람에게 절대 돈을 보내지 마세요',
      '영상통화를 거부하면 강하게 의심하세요',
      '프로필 사진을 역이미지 검색해보세요',
      '주변 사람에게 상황을 공유하세요',
      '"급하다"는 말에 절대 서두르지 마세요'
    ],
    dangerScore: 7
  });
  showScreen('debriefing');
}

function renderDebriefing(data) {
  const html = `
    <div class="danger-score">
      <div class="number">${data.dangerScore}/10</div>
      <div class="label">위험도 점수</div>
    </div>
    
    <div class="debrief-section">
      <h3>🎯 당신의 취약 포인트</h3>
      <ul>${data.vulnerabilities.map(v => `<li>${v}</li>`).join('')}</ul>
    </div>
    
    <div class="debrief-section">
      <h3>🚩 놓쳤을 수 있는 위험 신호</h3>
      <ul>${data.redFlagsMissed.map(r => `<li>${r}</li>`).join('')}</ul>
    </div>
    
    <div class="debrief-section">
      <h3>🧠 스캐머가 사용한 심리 기법</h3>
      <ul>${data.techniques.map(t => `<li>${t}</li>`).join('')}</ul>
    </div>
    
    <div class="debrief-section">
      <h3>📊 실제 사례</h3>
      <ul><li>${data.realCaseComparison}</li></ul>
    </div>
    
    <div class="debrief-section">
      <h3>🛡️ 예방 수칙</h3>
      <ul>${data.preventionTips.map(p => `<li>${p}</li>`).join('')}</ul>
    </div>
  `;
  document.getElementById('debriefContent').innerHTML = html;
}

// ── 에러 처리 ──
function onError(err) {
  hideLoading();
  hideTyping();
  document.getElementById('sendBtn').disabled = false;
  console.error(err);
  addSystemMessage('⚠️ 오류가 발생했습니다. 다시 시도해주세요.');
}
</script>
</body>
</html>
