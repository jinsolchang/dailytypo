<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Darkroom</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #000;
  font-family: 'Noto Sans KR', sans-serif;
  height: 100vh;
  overflow: hidden;
}

/* === 인화조: 전체화면 === */
.tank {
  position: fixed;
  inset: 0;
  background: #040608;
  overflow: hidden;
  cursor: pointer;
}

/* 깊은 물 그라데이션 오버레이 */
.depth-overlay {
  position: absolute;
  inset: 0;
  background: radial-gradient(
    ellipse 70% 50% at 50% 45%,
    rgba(4,20,40,0.0) 0%,
    rgba(2,10,25,0.7) 40%,
    rgba(0,3,10,0.95) 100%
  );
  pointer-events: none;
  z-index: 2;
}

/* 수면 코스틱 (빛 일렁임) */
.caustics {
  position: absolute;
  inset: 0;
  opacity: 0.08;
  pointer-events: none;
  z-index: 3;
  mix-blend-mode: screen;
}

/* 업로드 영역 */
.upload-zone {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  z-index: 10;
  cursor: pointer;
}

.upload-zone .icon {
  width: 80px;
  height: 80px;
  border: 2px dashed rgba(180,200,220,0.3);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2rem;
  color: rgba(180,200,220,0.4);
  transition: all 0.3s;
}

.upload-zone:hover .icon {
  border-color: rgba(180,200,220,0.6);
  color: rgba(180,200,220,0.7);
}

.upload-zone p {
  font-size: 0.85rem;
  color: rgba(180,200,220,0.4);
}

.upload-zone.hidden { display: none; }

/* 사진 (물속 깊이에서 떠오름) */
.photo-container {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.7);
  z-index: 1;
  opacity: 0;
  transition: none;
}

.photo-frame {
  background: #f5f5f0;
  padding: 16px 16px 52px 16px;
  box-shadow: 0 8px 60px rgba(0,0,0,0.8);
}

.photo-inner {
  position: relative;
  overflow: hidden;
}

.photo-inner img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* 물결 오버레이 — 사진 위에 직접 */
.ripple-overlay {
  position: absolute;
  inset: 0;
  z-index: 10;
  pointer-events: none;
}

/* 인화 레이어 */
.layer-fog {
  position: absolute;
  inset: 0;
  background: rgba(240,238,230,1);
  z-index: 4;
}

.layer-edges {
  position: absolute;
  inset: 0;
  z-index: 3;
  opacity: 0;
}

.layer-edges img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: grayscale(1) contrast(3) brightness(0.3) sepia(0.8);
}

.layer-mid {
  position: absolute;
  inset: 0;
  z-index: 2;
  opacity: 0;
}

.layer-mid img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: grayscale(0.6) contrast(1.3) brightness(0.6) saturate(0.4);
}

.layer-full {
  position: absolute;
  inset: 0;
  z-index: 1;
  opacity: 0;
}

.layer-full img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* 빨랫줄 (하단 고정) */
.clothesline {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 100px;
  padding: 0 20px;
  overflow-x: auto;
  overflow-y: hidden;
  white-space: nowrap;
  z-index: 20;
  background: linear-gradient(transparent, rgba(0,0,0,0.8));
  display: flex;
  align-items: flex-end;
  padding-bottom: 12px;
}

.clothesline::before {
  content: '';
  position: absolute;
  top: 40px;
  left: 0;
  right: 0;
  height: 1px;
  background: rgba(150,120,80,0.4);
}

.clothesline-item {
  display: inline-block;
  position: relative;
  margin: 0 10px;
  cursor: pointer;
  transition: transform 0.3s;
  flex-shrink: 0;
}

.clothesline-item:hover {
  transform: scale(1.15) rotate(-3deg);
}

.clothesline-item::before {
  content: '';
  position: absolute;
  top: -6px;
  left: 50%;
  transform: translateX(-50%);
  width: 8px;
  height: 12px;
  background: #6b4423;
  border-radius: 1px 1px 3px 3px;
}

.clothesline-item img {
  width: 52px;
  height: 52px;
  object-fit: cover;
  border: 2px solid #f5f5f0;
  box-shadow: 0 2px 8px rgba(0,0,0,0.6);
}

/* 컨트롤 */
.controls {
  position: fixed;
  top: 20px;
  right: 20px;
  display: flex;
  gap: 8px;
  z-index: 20;
}

.btn {
  padding: 8px 14px;
  border: 1px solid rgba(200,200,200,0.2);
  background: rgba(0,0,0,0.4);
  color: rgba(200,200,200,0.7);
  font-size: 0.75rem;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
  backdrop-filter: blur(4px);
}

.btn:hover {
  background: rgba(40,40,40,0.6);
  border-color: rgba(200,200,200,0.4);
  color: #fff;
}

.btn:disabled {
  opacity: 0.2;
  cursor: not-allowed;
}

/* 진행 표시 */
.progress-ring {
  position: fixed;
  bottom: 120px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 20;
  opacity: 0;
  transition: opacity 0.3s;
}

.progress-ring.active { opacity: 1; }

.progress-ring circle {
  fill: none;
  stroke-width: 2;
}

.progress-ring .bg { stroke: rgba(255,255,255,0.1); }
.progress-ring .fg { stroke: rgba(200,170,100,0.6); stroke-linecap: round; transition: stroke-dashoffset 0.1s linear; }

#fileInput { display: none; }
</style>
</head>
<body>

<div class="tank" id="tank">
  <div class="depth-overlay"></div>
  <canvas class="caustics" id="caustics"></canvas>

  <div class="upload-zone" id="uploadZone">
    <div class="icon">◎</div>
    <p>클릭하여 사진을 현상액에 담그세요</p>
  </div>

  <div class="photo-container" id="photoContainer">
    <div class="photo-frame" id="photoFrame">
      <div class="photo-inner" id="photoInner">
        <div class="layer-fog" id="layerFog"></div>
        <div class="layer-edges" id="layerEdges"></div>
        <div class="layer-mid" id="layerMid"></div>
        <div class="layer-full" id="layerFull"></div>
        <div class="ripple-overlay" id="rippleOverlay"></div>
      </div>
    </div>
  </div>
</div>

<div class="clothesline" id="clothesline"></div>

<div class="controls">
  <button class="btn" id="btnDownload" disabled>저장</button>
  <button class="btn" id="btnReset">새 사진</button>
</div>

<svg class="progress-ring" id="progressRing" width="40" height="40">
  <circle class="bg" cx="20" cy="20" r="16"/>
  <circle class="fg" id="progressCircle" cx="20" cy="20" r="16"
    stroke-dasharray="100.53" stroke-dashoffset="100.53"
    transform="rotate(-90 20 20)"/>
</svg>

<input type="file" id="fileInput" accept="image/*">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.ripples/0.5.3/jquery.ripples.min.js"></script>
<script>
const tankEl = document.getElementById('tank');
const uploadZone = document.getElementById('uploadZone');
const fileInput = document.getElementById('fileInput');
const photoContainer = document.getElementById('photoContainer');
const photoInner = document.getElementById('photoInner');
const layerFog = document.getElementById('layerFog');
const layerEdges = document.getElementById('layerEdges');
const layerMid = document.getElementById('layerMid');
const layerFull = document.getElementById('layerFull');
const progressRing = document.getElementById('progressRing');
const progressCircle = document.getElementById('progressCircle');
const btnDownload = document.getElementById('btnDownload');
const btnReset = document.getElementById('btnReset');
const clothesline = document.getElementById('clothesline');

const CIRCUMFERENCE = 2 * Math.PI * 16; // ~100.53
let currentImageSrc = null;

// === 코스틱 (수면 빛 일렁임) ===
(function(){
  const cv = document.getElementById('caustics');
  cv.width = window.innerWidth;
  cv.height = window.innerHeight;
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;

  function draw(){
    const t = performance.now() * 0.0008;
    ctx.clearRect(0, 0, W, H);

    for (let i = 0; i < 6; i++) {
      ctx.beginPath();
      for (let x = 0; x < W; x += 8) {
        const y = H * 0.2 + i * (H * 0.12) +
          Math.sin(x * 0.005 + t + i * 1.2) * 30 +
          Math.sin(x * 0.012 + t * 1.5 + i) * 15;
        x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.strokeStyle = `rgba(120,180,220,${0.15 - i * 0.02})`;
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    requestAnimationFrame(draw);
  }
  draw();

  window.addEventListener('resize', () => {
    cv.width = window.innerWidth;
    cv.height = window.innerHeight;
  });
})();

// === 업로드 ===
uploadZone.addEventListener('click', () => fileInput.click());
tankEl.addEventListener('dragover', e => e.preventDefault());
tankEl.addEventListener('drop', e => {
  e.preventDefault();
  if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', e => {
  if (e.target.files[0]) handleFile(e.target.files[0]);
});

function handleFile(file) {
  if (!file.type.startsWith('image/')) return;
  const reader = new FileReader();
  reader.onload = e => {
    currentImageSrc = e.target.result;
    startDeveloping(currentImageSrc);
  };
  reader.readAsDataURL(file);
}

// === 인화 시작 ===
function startDeveloping(src) {
  uploadZone.classList.add('hidden');

  const img = new Image();
  img.onload = () => {
    // 비율 계산 — 화면의 50~60% 차지
    const maxW = window.innerWidth * 0.55;
    const maxH = window.innerHeight * 0.6;
    let w = img.naturalWidth;
    let h = img.naturalHeight;
    const scale = Math.min(maxW / w, maxH / h, 1);
    w = Math.round(w * scale);
    h = Math.round(h * scale);

    photoInner.style.width = w + 'px';
    photoInner.style.height = h + 'px';

    // 레이어에 이미지 삽입
    layerEdges.innerHTML = `<img src="${src}">`;
    layerMid.innerHTML = `<img src="${src}">`;
    layerFull.innerHTML = `<img src="${src}">`;

    // 초기 상태: 깊은 물속, 작고 흐릿
    photoContainer.style.opacity = '0';
    photoContainer.style.transform = 'translate(-50%, -50%) scale(0.5)';
    photoContainer.style.filter = 'blur(8px) brightness(0.3)';
    layerFog.style.opacity = '1';
    layerEdges.style.opacity = '0';
    layerMid.style.opacity = '0';
    layerFull.style.opacity = '0';

    // 시작
    requestAnimationFrame(() => {
      photoContainer.style.opacity = '1';
      // 사진이 보인 후 ripples 초기화
      setTimeout(() => {
        initRipples();
        startDevelopRipples();
      }, 100);
      runDevelopAnimation();
    });
  };
  img.src = src;
}

// === 인화 애니메이션 (10초, 마지막에야 드러남) ===
function runDevelopAnimation() {
  progressRing.classList.add('active');

  const duration = 10000;
  const start = performance.now();

  function animate(now) {
    const elapsed = now - start;
    const p = Math.min(elapsed / duration, 1);

    // 진행 링
    progressCircle.style.strokeDashoffset = CIRCUMFERENCE * (1 - p);

    // Phase 1 (0~0.2): 물속에서 서서히 떠오름, 아직 아무것도 안 보임
    if (p < 0.2) {
      const t = p / 0.2;
      photoContainer.style.transform = `translate(-50%, -50%) scale(${0.5 + t * 0.15})`;
      photoContainer.style.filter = `blur(${8 - t * 3}px) brightness(${0.3 + t * 0.1})`;
      layerFog.style.opacity = `${1 - t * 0.3}`;
    }
    // Phase 2 (0.2~0.45): 안개 걷히며 어두운 윤곽선만 등장
    else if (p < 0.45) {
      const t = (p - 0.2) / 0.25;
      photoContainer.style.transform = `translate(-50%, -50%) scale(${0.65 + t * 0.1})`;
      photoContainer.style.filter = `blur(${5 - t * 2.5}px) brightness(${0.4 + t * 0.15})`;
      layerFog.style.opacity = `${0.7 - t * 0.5}`;
      layerEdges.style.opacity = `${t * 0.9}`;
    }
    // Phase 3 (0.45~0.75): 중간톤 등장, 형체가 보이기 시작
    else if (p < 0.75) {
      const t = (p - 0.45) / 0.3;
      photoContainer.style.transform = `translate(-50%, -50%) scale(${0.75 + t * 0.1})`;
      photoContainer.style.filter = `blur(${2.5 - t * 1.5}px) brightness(${0.55 + t * 0.2})`;
      layerFog.style.opacity = `${0.2 - t * 0.2}`;
      layerEdges.style.opacity = `${0.9 - t * 0.9}`;
      layerMid.style.opacity = `${t}`;
    }
    // Phase 4 (0.75~1.0): 최종 — 컬러 완전 드러남
    else {
      const t = (p - 0.75) / 0.25;
      photoContainer.style.transform = `translate(-50%, -50%) scale(${0.85 + t * 0.15})`;
      photoContainer.style.filter = `blur(${1 - t}px) brightness(${0.75 + t * 0.25})`;
      layerFog.style.opacity = '0';
      layerEdges.style.opacity = '0';
      layerMid.style.opacity = `${1 - t}`;
      layerFull.style.opacity = `${t}`;
    }

    if (p < 1) {
      requestAnimationFrame(animate);
    } else {
      finishDeveloping();
    }
  }

  requestAnimationFrame(animate);
}

function finishDeveloping() {
  progressRing.classList.remove('active');
  btnDownload.disabled = false;
  stopDevelopRipples();
  addToClothesline(currentImageSrc);
}

// === 빨랫줄 ===
function addToClothesline(src) {
  const item = document.createElement('div');
  item.className = 'clothesline-item';
  item.innerHTML = `<img src="${src}">`;
  item.addEventListener('click', () => downloadImage(src));
  clothesline.appendChild(item);
  clothesline.scrollLeft = clothesline.scrollWidth;
}

// === 다운로드 ===
btnDownload.addEventListener('click', () => {
  if (currentImageSrc) downloadImage(currentImageSrc);
});

function downloadImage(src) {
  const img = new Image();
  img.onload = () => {
    const pad = 24, bot = 60;
    const cw = img.naturalWidth + pad * 2;
    const ch = img.naturalHeight + pad + bot;
    const canvas = document.createElement('canvas');
    canvas.width = cw; canvas.height = ch;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#f5f5f0';
    ctx.fillRect(0, 0, cw, ch);
    ctx.drawImage(img, pad, pad, img.naturalWidth, img.naturalHeight);
    const link = document.createElement('a');
    link.download = `darkroom_${Date.now()}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  };
  img.src = src;
}

// === 리셋 ===
btnReset.addEventListener('click', () => {
  destroyRipples();
  photoContainer.style.opacity = '0';
  photoContainer.style.transform = 'translate(-50%, -50%) scale(0.5)';
  photoContainer.style.filter = 'blur(8px) brightness(0.3)';
  layerFog.style.opacity = '1';
  layerEdges.style.opacity = '0';
  layerMid.style.opacity = '0';
  layerFull.style.opacity = '0';
  layerEdges.innerHTML = '';
  layerMid.innerHTML = '';
  layerFull.innerHTML = '';
  uploadZone.classList.remove('hidden');
  btnDownload.disabled = true;
  currentImageSrc = null;
  fileInput.value = '';
});

// === jQuery Ripples — 사진 위에 직접 물결 ===
let ripplesReady = false;
let developingActive = false;
let $rippleTarget = null;

function initRipples() {
  try {
    $rippleTarget = $('#photoInner');
    $rippleTarget.ripples({
      resolution: 256,
      dropRadius: 20,
      perturbance: 0.04,
      interactive: true
    });
    ripplesReady = true;
  } catch(e) {
    ripplesReady = false;
  }
}

function destroyRipples() {
  if ($rippleTarget) {
    try { $rippleTarget.ripples('destroy'); } catch(e) {}
    $rippleTarget = null;
    ripplesReady = false;
  }
}

// 인화 시작 시 역동적 물결 시퀀스
function startDevelopRipples() {
  if (!ripplesReady || !$rippleTarget) return;
  developingActive = true;
  const w = $rippleTarget.outerWidth();
  const h = $rippleTarget.outerHeight();
  const cx = w / 2, cy = h / 2;

  // Phase 1: 사진이 물에 빠지는 순간 — 큰 충격파
  $rippleTarget.ripples('drop', cx, cy, 35, 0.08);
  setTimeout(() => { if($rippleTarget) $rippleTarget.ripples('drop', cx - 20, cy + 15, 25, 0.05); }, 200);
  setTimeout(() => { if($rippleTarget) $rippleTarget.ripples('drop', cx + 25, cy - 10, 20, 0.04); }, 400);

  // Phase 2: 인화 중 지속적인 물결
  let rippleInterval = setInterval(() => {
    if (!developingActive || !$rippleTarget) { clearInterval(rippleInterval); return; }
    const rx = cx + (Math.random() - 0.5) * w * 0.7;
    const ry = cy + (Math.random() - 0.5) * h * 0.7;
    const radius = 12 + Math.random() * 18;
    const strength = 0.015 + Math.random() * 0.025;
    $rippleTarget.ripples('drop', rx, ry, radius, strength);
  }, 500);

  // Phase 3: 중간 대파동
  setTimeout(() => {
    if (!developingActive || !$rippleTarget) return;
    $rippleTarget.ripples('drop', cx, cy, 40, 0.07);
  }, 3000);

  setTimeout(() => {
    if (!developingActive || !$rippleTarget) return;
    $rippleTarget.ripples('drop', cx + w*0.2, cy - h*0.15, 30, 0.05);
    $rippleTarget.ripples('drop', cx - w*0.2, cy + h*0.15, 25, 0.04);
  }, 5500);

  // Phase 4: 마무리 — 잔잔해짐
  setTimeout(() => {
    clearInterval(rippleInterval);
    if (!$rippleTarget) return;
    for (let i = 0; i < 5; i++) {
      setTimeout(() => {
        if (!$rippleTarget) return;
        const rx = cx + (Math.random() - 0.5) * w * 0.4;
        const ry = cy + (Math.random() - 0.5) * h * 0.4;
        $rippleTarget.ripples('drop', rx, ry, 6 + Math.random() * 5, 0.004 + Math.random() * 0.004);
      }, i * 350);
    }
  }, 8500);
}

function stopDevelopRipples() {
  developingActive = false;
}
</script>
</body>
</html>
