<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Darkroom</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #1a1a1a;
  color: #e0e0e0;
  font-family: 'Noto Sans KR', sans-serif;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* === 빨랫줄 (Clothesline) === */
.clothesline {
  position: relative;
  height: 140px;
  min-height: 140px;
  padding: 10px 20px;
  overflow-x: auto;
  overflow-y: hidden;
  white-space: nowrap;
  border-bottom: 1px solid #333;
}

.clothesline::before {
  content: '';
  position: absolute;
  top: 30px;
  left: 0;
  right: 0;
  height: 2px;
  background: #666;
}

.clothesline-item {
  display: inline-block;
  position: relative;
  top: 35px;
  margin: 0 12px;
  cursor: pointer;
  transition: transform 0.3s;
}

.clothesline-item:hover {
  transform: scale(1.1) rotate(-2deg);
}

.clothesline-item::before {
  content: '';
  position: absolute;
  top: -8px;
  left: 50%;
  transform: translateX(-50%);
  width: 12px;
  height: 16px;
  background: #8B4513;
  border-radius: 2px 2px 4px 4px;
  z-index: 1;
}

.clothesline-item img {
  width: 70px;
  height: 70px;
  object-fit: cover;
  border: 3px solid #f5f5f0;
  box-shadow: 0 2px 8px rgba(0,0,0,0.5);
}

.clothesline-empty {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: #555;
  font-size: 0.85rem;
}

/* === 메인 작업 영역 === */
.darkroom {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

/* 인화조 (Tank) */
.tank {
  position: relative;
  width: 420px;
  height: 420px;
  background: radial-gradient(ellipse at center, #2a1a0a 0%, #0d0d0d 100%);
  border-radius: 16px;
  border: 2px solid #3a2a1a;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

/* 물결 효과 오버레이 */
.tank::after {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 4px,
    rgba(255,255,255,0.015) 4px,
    rgba(255,255,255,0.015) 5px
  );
  animation: waterShift 3s ease-in-out infinite;
  pointer-events: none;
  border-radius: 14px;
}

@keyframes waterShift {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(3px); }
}

/* 업로드 영역 */
.upload-zone {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  cursor: pointer;
}

.upload-zone .icon {
  font-size: 3rem;
  opacity: 0.4;
}

.upload-zone p {
  font-size: 0.85rem;
  color: #888;
}

/* 폴라로이드 */
.polaroid {
  position: absolute;
  background: #f5f5f0;
  padding: 12px 12px 40px 12px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.6);
  transform: rotate(-2deg);
  transition: transform 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}

.polaroid.developing {
  animation: float 4s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: rotate(-2deg) translateY(0); }
  50% { transform: rotate(-1deg) translateY(-4px); }
}

.polaroid-image {
  position: relative;
  overflow: hidden;
  background: #fff;
}

.polaroid-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* 인화 레이어들 */
.develop-layer {
  position: absolute;
  inset: 0;
}

.layer-white {
  background: #fff;
  z-index: 3;
}

.layer-sepia {
  z-index: 2;
  mix-blend-mode: multiply;
  opacity: 0;
}

.layer-sepia img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: grayscale(1) contrast(2) sepia(1) brightness(0.4);
}

.layer-color {
  z-index: 1;
  opacity: 0;
}

.layer-color img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* 진행 바 */
.progress-bar {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  width: 200px;
  height: 3px;
  background: #333;
  border-radius: 2px;
  overflow: hidden;
  opacity: 0;
  transition: opacity 0.3s;
}

.progress-bar.active {
  opacity: 1;
}

.progress-bar .fill {
  height: 100%;
  width: 0%;
  background: #c9a96e;
  transition: width 0.1s linear;
}

/* 컨트롤 */
.controls {
  position: absolute;
  bottom: 30px;
  right: 30px;
  display: flex;
  gap: 10px;
}

.btn {
  padding: 8px 16px;
  border: 1px solid #555;
  background: transparent;
  color: #ccc;
  font-size: 0.8rem;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
}

.btn:hover {
  background: #333;
  border-color: #888;
}

.btn:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}

/* 숨김 input */
#fileInput { display: none; }

/* 상태 텍스트 */
.status {
  position: absolute;
  bottom: 30px;
  left: 30px;
  font-size: 0.75rem;
  color: #666;
}
</style>
</head>
<body>

<!-- 빨랫줄 갤러리 -->
<div class="clothesline" id="clothesline">
  <span class="clothesline-empty">인화된 사진이 여기에 걸립니다</span>
</div>

<!-- 메인 암실 -->
<div class="darkroom">
  <div class="tank" id="tank">
    <div class="upload-zone" id="uploadZone">
      <div class="icon">◎</div>
      <p>클릭하여 사진을 넣으세요</p>
    </div>
  </div>

  <div class="progress-bar" id="progressBar">
    <div class="fill" id="progressFill"></div>
  </div>

  <div class="controls">
    <button class="btn" id="btnDownload" disabled>저장</button>
    <button class="btn" id="btnReset">새 사진</button>
  </div>

  <div class="status" id="status">대기 중</div>
</div>

<input type="file" id="fileInput" accept="image/*">

<script>
const tank = document.getElementById('tank');
const uploadZone = document.getElementById('uploadZone');
const fileInput = document.getElementById('fileInput');
const progressBar = document.getElementById('progressBar');
const progressFill = document.getElementById('progressFill');
const btnDownload = document.getElementById('btnDownload');
const btnReset = document.getElementById('btnReset');
const status = document.getElementById('status');
const clothesline = document.getElementById('clothesline');

let currentImageSrc = null;
let gallery = [];

// 업로드 트리거
uploadZone.addEventListener('click', () => fileInput.click());
tank.addEventListener('dragover', e => { e.preventDefault(); tank.style.borderColor = '#c9a96e'; });
tank.addEventListener('dragleave', () => { tank.style.borderColor = '#3a2a1a'; });
tank.addEventListener('drop', e => {
  e.preventDefault();
  tank.style.borderColor = '#3a2a1a';
  if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', e => {
  if (e.target.files[0]) handleFile(e.target.files[0]);
});

function handleFile(file) {
  if (!file.type.startsWith('image/')) return;
  const reader = new FileReader();
  reader.onload = e => {
    currentImageSrc = e.target.result;
    startDeveloping(currentImageSrc);
  };
  reader.readAsDataURL(file);
}

function startDeveloping(src) {
  // 업로드 존 숨기기
  uploadZone.style.display = 'none';
  status.textContent = '인화 중...';

  // 이미지 로드 후 비율 계산
  const img = new Image();
  img.onload = () => {
    const ratio = img.naturalWidth / img.naturalHeight;
    let w, h;
    if (ratio > 1.2) { w = 280; h = 200; }
    else if (ratio < 0.8) { w = 200; h = 280; }
    else { w = 240; h = 240; }

    // 폴라로이드 생성
    const polaroid = document.createElement('div');
    polaroid.className = 'polaroid developing';
    polaroid.innerHTML = `
      <div class="polaroid-image" style="width:${w}px;height:${h}px;">
        <div class="develop-layer layer-white"></div>
        <div class="develop-layer layer-sepia"><img src="${src}"></div>
        <div class="develop-layer layer-color"><img src="${src}"></div>
      </div>
    `;
    tank.appendChild(polaroid);

    // 인화 애니메이션 시작
    runDevelopAnimation(polaroid);
  };
  img.src = src;
}

function runDevelopAnimation(polaroid) {
  const layerWhite = polaroid.querySelector('.layer-white');
  const layerSepia = polaroid.querySelector('.layer-sepia');
  const layerColor = polaroid.querySelector('.layer-color');

  progressBar.classList.add('active');

  const duration = 6000; // 6초
  const start = performance.now();

  function animate(now) {
    const elapsed = now - start;
    const progress = Math.min(elapsed / duration, 1);
    progressFill.style.width = (progress * 100) + '%';

    // Phase 1 (0~0.3): 흰색이 사라지며 세피아 윤곽 등장
    if (progress < 0.3) {
      const p = progress / 0.3;
      layerWhite.style.opacity = 1 - p;
      layerSepia.style.opacity = p * 0.8;
    }
    // Phase 2 (0.3~0.7): 세피아 유지, 컬러가 서서히 등장
    else if (progress < 0.7) {
      const p = (progress - 0.3) / 0.4;
      layerWhite.style.opacity = 0;
      layerSepia.style.opacity = 0.8 - p * 0.8;
      layerColor.style.opacity = p;
      layerColor.querySelector('img').style.filter = `blur(${(1-p)*3}px) saturate(${0.3 + p*0.7})`;
    }
    // Phase 3 (0.7~1.0): 완전 선명
    else {
      const p = (progress - 0.7) / 0.3;
      layerSepia.style.opacity = 0;
      layerColor.style.opacity = 1;
      layerColor.querySelector('img').style.filter = `blur(0px) saturate(1) brightness(${0.9 + p*0.1})`;
    }

    if (progress < 1) {
      requestAnimationFrame(animate);
    } else {
      finishDeveloping(polaroid);
    }
  }

  requestAnimationFrame(animate);
}

function finishDeveloping(polaroid) {
  polaroid.classList.remove('developing');
  progressBar.classList.remove('active');
  progressFill.style.width = '0%';
  status.textContent = '인화 완료';
  btnDownload.disabled = false;

  // 갤러리에 추가
  addToClothesline(currentImageSrc);
}

function addToClothesline(src) {
  // 빈 메시지 제거
  const empty = clothesline.querySelector('.clothesline-empty');
  if (empty) empty.remove();

  gallery.push(src);

  const item = document.createElement('div');
  item.className = 'clothesline-item';
  item.innerHTML = `<img src="${src}">`;
  item.addEventListener('click', () => {
    // 클릭 시 다운로드
    downloadImage(src);
  });
  clothesline.appendChild(item);

  // 스크롤 끝으로
  clothesline.scrollLeft = clothesline.scrollWidth;
}

// 다운로드
btnDownload.addEventListener('click', () => {
  if (currentImageSrc) downloadImage(currentImageSrc);
});

function downloadImage(src) {
  // 폴라로이드 프레임 포함 캔버스 생성
  const img = new Image();
  img.onload = () => {
    const padding = 24;
    const bottom = 60;
    const cw = img.naturalWidth + padding * 2;
    const ch = img.naturalHeight + padding + bottom;

    const canvas = document.createElement('canvas');
    canvas.width = cw;
    canvas.height = ch;
    const ctx = canvas.getContext('2d');

    // 프레임 배경
    ctx.fillStyle = '#f5f5f0';
    ctx.fillRect(0, 0, cw, ch);

    // 이미지
    ctx.drawImage(img, padding, padding, img.naturalWidth, img.naturalHeight);

    // 다운로드
    const link = document.createElement('a');
    link.download = `darkroom_${Date.now()}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  };
  img.src = src;
}

// 리셋
btnReset.addEventListener('click', () => {
  const polaroid = tank.querySelector('.polaroid');
  if (polaroid) polaroid.remove();
  uploadZone.style.display = 'flex';
  btnDownload.disabled = true;
  status.textContent = '대기 중';
  currentImageSrc = null;
  fileInput.value = '';
});
</script>
</body>
</html>
